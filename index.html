const STATS_PROBLEMS = [
{ t: "scat", q: `The table shows the heights and weights of 10 men aged between 25 and 35, none of whom has any physical illness.<br><table class="dt"><tr><th>Person</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>Height (m)</th><td>1.8</td><td>1.6</td><td>1.7</td><td>1.8</td><td>1.9</td><td>2.0</td><td>1.9</td><td>1.7</td><td>1.9</td><td>1.6</td></tr><tr><th>Weight (stone)</th><td>12</td><td>11.5</td><td>12.5</td><td>13</td><td>13.5</td><td>13</td><td>12</td><td>11</td><td>12</td><td>10.5</td></tr></table>(i) Draw a scatter plot of the data. (ii) Describe the correlation between height and weight. (iii) Estimate the correlation coefficient from your graph.`, s: [`Plot height (x-axis) against weight (y-axis); the points rise from left to right.`, `Direction: positive (taller men tend to weigh more). Strength: the points lie reasonably close to a rising line, so moderate to strong.`, `A fair estimate from the graph is r ≈ 0.7 (anything from about 0.6 to 0.8 is reasonable).`], a: `Moderate to strong positive correlation; r ≈ 0.7`, gs: "hw" },
{ t: "scat", q: `Using the data for the heights and weights of the 10 men below, find the correlation coefficient r using your calculator. Give your answer to 3 decimal places and say what it tells you about the relationship.<br><table class="dt"><tr><th>Person</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>Height (m)</th><td>1.8</td><td>1.6</td><td>1.7</td><td>1.8</td><td>1.9</td><td>2.0</td><td>1.9</td><td>1.7</td><td>1.9</td><td>1.6</td></tr><tr><th>Weight (stone)</th><td>12</td><td>11.5</td><td>12.5</td><td>13</td><td>13.5</td><td>13</td><td>12</td><td>11</td><td>12</td><td>10.5</td></tr></table>`, s: [`Enter the heights as x and the weights as y in statistics mode.`, `r = 0.701 (to 3 decimal places; 0.7010163…)`, `r is positive and fairly close to 1, so there is a fairly strong positive linear relationship.`], a: `r ≈ 0.701: a fairly strong positive linear correlation` },
{ t: "scat", q: `Eight students recorded the number of hours they studied for a test and their score (%).<br><table class="dt"><tr><th>Hours studied</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr><tr><th>Score (%)</th><td>38</td><td>45</td><td>47</td><td>56</td><td>55</td><td>66</td><td>70</td><td>79</td></tr></table>Draw a scatter plot, describe the correlation, and find the correlation coefficient r to 3 decimal places.`, s: [`Plot hours on the x-axis and score on the y-axis; the points rise steadily.`, `Describe: strong positive linear correlation.`, `Calculator: r = 0.985`], a: `Strong positive correlation; r ≈ 0.985`, gs: "study" },
{ t: "scat", q: `The scatter plot shows the age of 12 cars of the same model and their price. Which of these is the best estimate for the correlation coefficient: 0.9, 0.2, −0.3 or −0.9? Describe the correlation in words.`, s: [`Direction: as age increases the price falls, so the correlation is negative. That rules out 0.9 and 0.2.`, `Strength: the points hug a straight line closely, so |r| is close to 1. That rules out −0.3.`, `Calculator check: r = −0.973`], a: `r ≈ −0.9: strong negative correlation`, g: "neg" },
{ t: "scat", q: `The scatter plot shows ten data points. One point does not follow the pattern of the others. Identify it, and say whether the correlation coefficient would increase or decrease if it were removed. The calculator gives r = 0.734 with it included and r = 0.998 without it.`, s: [`The point (6, 30) lies far above the rising pattern of the other nine points: it is an outlier.`, `With it r = 0.734; without it r = 0.998.`, `Removing the outlier makes the points lie much closer to a straight line, so r increases (it moves closer to 1).`], a: `Outlier (6, 30); r increases from 0.734 to 0.998 when it is removed`, g: "outl" },
{ t: "scat", q: `A study of 40 adults finds a correlation coefficient of r = −0.82 between the hours of television watched per week and the score on a fitness test. Describe what this value tells you about the relationship between the two variables.`, s: [`r is negative, so as TV hours increase the fitness score tends to decrease.`, `|r| = 0.82 is close to 1, so the relationship is strong and fairly linear.`, `r only measures the strength of a linear relationship; it does not by itself say that TV watching causes lower fitness.`], a: `A strong negative linear correlation: more TV hours go with lower fitness scores` },
{ t: "scat", q: `The table shows the hours of sunshine and the maximum temperature in ten Irish coastal towns on one day.<br><table class="dt"><tr><th>Sunshine (hours)</th><td>3.5</td><td>5</td><td>6</td><td>7.5</td><td>8</td><td>9</td><td>9.5</td><td>10.5</td><td>11</td><td>12.5</td></tr><tr><th>Max temp (°C)</th><td>11</td><td>12</td><td>14</td><td>15</td><td>15</td><td>17</td><td>16</td><td>18</td><td>19</td><td>20</td></tr></table>(i) Display the data on a scatter plot. (ii) Calculate the correlation coefficient, correct to four decimal places. (iii) Comment on the value of r in the context of the question.`, s: [`(i) Hours of sunshine on the x-axis, temperature on the y-axis.`, `(ii) r = 0.9854`, `(iii) r is very close to 1: there is a very strong positive linear relationship; towns with more sunshine had higher maximum temperatures.`], a: `r ≈ 0.9854: very strong positive correlation between sunshine hours and temperature`, gs: "sun" },
{ t: "lobf", q: `The line of best fit for the height and weight data of the 10 men passes through the points (1.6, 11.5) and (2, 13). Find the equation of the line, and use it to estimate the weight of a man who is 2.2 m tall.<br><table class="dt"><tr><th>Person</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>Height (m)</th><td>1.8</td><td>1.6</td><td>1.7</td><td>1.8</td><td>1.9</td><td>2.0</td><td>1.9</td><td>1.7</td><td>1.9</td><td>1.6</td></tr><tr><th>Weight (stone)</th><td>12</td><td>11.5</td><td>12.5</td><td>13</td><td>13.5</td><td>13</td><td>12</td><td>11</td><td>12</td><td>10.5</td></tr></table>`, s: [`Slope m = (13 − 11.5)/(2 − 1.6) = 1.5/0.4 = 15/4`, `Through (2, 13): y − 13 = 15/4 (x − 2)`, `y = 15/4 x + 11/2`, `x = 2.2: y = 15/4 (2.2) + 11/2 = 13.75`], a: `y = (15/4)x + 11/2; estimate 13.75 stone`, gs: "hws" },
{ t: "lobf", q: `A shop records its monthly advertising spend and sales, both in thousands of euro.<br><table class="dt"><tr><th>Spend</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr><tr><th>Sales</th><td>12</td><td>15</td><td>19</td><td>20</td><td>26</td><td>27</td><td>33</td><td>35</td></tr></table>Use your calculator to find the equation of the line of best fit y = mx + c, giving m and c correct to 2 decimal places. Use it to estimate the sales when the spend is €6,500.`, s: [`Regression on the calculator: m = 3.35, c = 8.32`, `y = 3.35x + 8.32`, `x = 6.5: y = 3.35(6.5) + 8.32 = 30.10 (thousand), about €30,100`], a: `y = 3.35x + 8.32; sales ≈ €30,100`, gs: "adv" },
{ t: "lobf", q: `The scatter plot shows data collected in an experiment. A line of best fit has been drawn through the marked points (2, 30) and (10, 70). Find the equation of the line, estimate y when x = 6, and say whether the line should be used to estimate y when x = 25.`, s: [`m = (70 − 30)/(10 − 2) = 5`, `y − 30 = 5(x − 2), so y = 5x + 20`, `x = 6: y = 5(6) + 20 = 50`, `x = 25 is far outside the data (x from 1 to 11): that would be extrapolation, so it is not reliable.`], a: `y = 5x + 20; y ≈ 50 at x = 6; not reliable at x = 25 (extrapolation)`, g: "lb3", gs: "lb3s" },
{ t: "lobf", q: `The line of best fit for the value of a car is y = −1.2x + 19, where x is the age of the car in years and y is its value in thousands of euro. (i) Interpret the slope and the y-intercept in context. (ii) Estimate the value of a 5-year-old car. (iii) Why is the line not suitable for estimating the value of a car that is 20 years old?`, s: [`(i) Slope −1.2: the value falls by about €1,200 for each extra year of age. y-intercept 19: a new car (age 0) is worth about €19,000.`, `(ii) x = 5: y = −1.2(5) + 19 = 13, i.e. €13,000.`, `(iii) At x = 20 the line gives y = −5, a negative value, which is impossible. It is outside the range of the data, so the linear pattern cannot be trusted.`], a: `€1,200 lost per year, new price €19,000; €13,000 at 5 years; 20 years is extrapolation (negative value)` },
{ t: "lobf", q: `For the sunshine and temperature data of the ten coastal towns, the mean number of sunshine hours is 8.25 and the mean temperature is 15.7°C. The line of best fit passes through the point (mean x, mean y) and through the point (12, 19.5). Find its equation and estimate the temperature in a town with 11.5 hours of sunshine.<br><table class="dt"><tr><th>Sunshine (hours)</th><td>3.5</td><td>5</td><td>6</td><td>7.5</td><td>8</td><td>9</td><td>9.5</td><td>10.5</td><td>11</td><td>12.5</td></tr><tr><th>Max temp (°C)</th><td>11</td><td>12</td><td>14</td><td>15</td><td>15</td><td>17</td><td>16</td><td>18</td><td>19</td><td>20</td></tr></table>`, s: [`Points on the line: (8.25, 15.7) and (12, 19.5).`, `m = (19.5 − 15.7)/(12 − 8.25) = 1.013`, `Using (12, 19.5): y − 19.5 = 1.013(x − 12), so y = 1.013x + 7.34`, `x = 11.5: y = 19.0`], a: `y ≈ 1.013x + 7.34; about 19.0°C` },
{ t: "caus", q: `For the height and weight data of the 10 men, the line of best fit would not be reliable for estimating the weight of a man who is 2.6 m tall. Explain why. Do you think the relationship between height and weight is causal? Give a reason for your answer.`, s: [`2.6 m is far outside the range of the data (1.6 m to 2.0 m). Assuming the straight-line pattern continues beyond the data is extrapolation and is unreliable.`, `Height and weight are plausibly related through body size: a taller body generally has more mass. It is reasonable to say that height contributes to weight, although other factors (diet, build) also matter.`], a: `Extrapolation outside the data range is unreliable; a causal link is reasonable because greater height means a larger body` },
{ t: "caus", q: `Over a year, a coastal town records a correlation coefficient of r = 0.85 between the monthly sales of ice cream and the number of people rescued from the sea. Does this mean that eating ice cream causes people to need rescue? Explain.`, s: [`A strong correlation does not prove that one variable causes the other.`, `A third (lurking) variable explains both: warm weather. In hot months more people buy ice cream and more people swim, so more need rescue.`, `So the correlation is real but not causal.`], a: `No: correlation is not causation; warm weather (a lurking variable) drives both` },
{ t: "caus", q: `A fire service finds a strong positive correlation (r = 0.92) between the number of firefighters sent to a fire and the amount of damage done. A councillor says, “Sending fewer firefighters would reduce the damage.” Comment on this claim.`, s: [`The correlation is strong, but it does not show cause and effect.`, `A lurking variable: the size of the fire. Bigger fires cause more damage and also lead to more firefighters being sent.`, `Reducing the number of firefighters would not reduce damage; it would probably increase it.`], a: `The claim is wrong: the size of the fire causes both; correlation does not imply causation` },
{ t: "caus", q: `A student calculates the correlation coefficient for the points shown and gets r = 0. She concludes that there is no relationship between x and y. Is she right? Explain.`, s: [`The points lie exactly on the curve y = x², so there is a perfect relationship.`, `r measures only the strength of a linear relationship. Here the relationship is curved, so r = 0.`, `A scatter plot should always be drawn: r alone can be misleading.`], a: `No: the relationship is perfect but not linear; r only measures linear correlation`, g: "ushape" },
{ t: "emp", q: `The scores in a test are normally distributed with mean 42 and standard deviation 6. Use the empirical rule to find: (i) the percentage of people who scored between 30 and 54; (ii) the percentage who scored more than 36.`, s: [`Write each score in terms of the mean and standard deviation: 30 = 42 − 2(6) and 54 = 42 + 2(6); 36 = 42 − 1(6).`, `(i) Within 2 standard deviations of the mean: 95%.`, `(ii) More than 36 means above −1 standard deviation: 34% + 50% = 84%.`], a: `(i) 95%  (ii) 84%`, gs: "e1" },
{ t: "emp", q: `The scores in a test are normally distributed with mean 42 and standard deviation 6. (i) Alex scored 60. What percentage of people scored less than Alex? (ii) There are 1200 people in the population. How many scored between 24 and 48?`, s: [`60 = 42 + 3(6), so Alex is 3 standard deviations above the mean.`, `(i) 50% + 49.85% = 99.85% scored less than Alex (99.7% lie within 3 s.d., so 49.85% lie between the mean and +3 s.d.).`, `(ii) 24 = 42 − 3(6) and 48 = 42 + 1(6). Percentage = 49.85% + 34% = 83.85%.`, `1200 × 0.8385 = 1006.2, so about 1006 people.`], a: `(i) 99.85%  (ii) about 1006 people`, gs: "e2" },
{ t: "emp", q: `The scores of 1500 people are normally distributed with mean 42 and standard deviation 6. Mark scored higher than 1260 of them. Use the empirical rule to find Mark's score.`, s: [`Percentage who scored lower than Mark = 1260/1500 = 84%.`, `84% = 50% + 34%, so Mark is 1 standard deviation above the mean.`, `Score = 42 + 1(6) = 48.`], a: `Mark scored 48`, gs: "e3" },
{ t: "emp", q: `The heights of 2000 students are normally distributed with mean 170 cm and standard deviation 8 cm. Use the empirical rule to estimate (i) the percentage with heights between 154 cm and 178 cm, and (ii) the number of students taller than 186 cm.`, s: [`154 = 170 − 2(8) and 178 = 170 + 1(8); 186 = 170 + 2(8).`, `(i) 47.5% + 34% = 81.5%.`, `(ii) Above +2 s.d.: (100 − 95)/2 = 2.5%.`, `2.5% of 2000 = 50 students.`], a: `(i) 81.5%  (ii) 50 students`, gs: "e4" },
{ t: "emp", q: `The lifetime of a type of battery is normally distributed with mean 800 hours and standard deviation 50 hours. A batch of 4000 batteries is tested. (i) What percentage last less than 700 hours? (ii) How many last between 750 and 900 hours?`, s: [`700 = 800 − 2(50): the percentage below −2 s.d. is (100 − 95)/2 = 2.5%.`, `750 = 800 − 1(50) and 900 = 800 + 2(50): 34% + 47.5% = 81.5%.`, `4000 × 0.815 = 3260.`], a: `(i) 2.5%  (ii) 3260 batteries`, gs: "e5" },
{ t: "emp", q: `A test is designed so that scores are normally distributed with mean 100 and standard deviation 15. (i) Between which two scores do the middle 95% of people lie? (ii) What percentage score more than 145? (iii) What percentage score between 85 and 130?`, s: [`(i) The middle 95% lie within 2 s.d.: 100 ± 2(15), i.e. between 70 and 130.`, `(ii) 145 = 100 + 3(15): only 0.15% lie above +3 s.d. (100 − 99.7)/2.`, `(iii) 85 = −1 s.d. and 130 = +2 s.d.: 34% + 47.5% = 81.5%.`], a: `(i) 70 to 130  (ii) 0.15%  (iii) 81.5%`, gs: "e6" },
{ t: "emp", q: `The marks of 500 students in an exam are normally distributed with mean 55 and standard deviation 10. How many students scored below 35 or above 75, and how many scored between 45 and 65?`, s: [`35 = 55 − 2(10) and 75 = 55 + 2(10): the two tails together contain 100% − 95% = 5%.`, `5% of 500 = 25 students.`, `45 and 65 are 1 s.d. either side of the mean: 68% of 500 = 340 students.`], a: `25 students below 35 or above 75; 340 students between 45 and 65`, gs: "e7" },
{ t: "zp", q: `The grades in Aislinn's maths class are normally distributed with mean 54% and standard deviation 8%. Aislinn scored 65%. Find her z-score and hence the percentage of the class she did better than.`, s: [`z = (x − μ)/σ = (65 − 54)/8 = 1.375 ≈ 1.38`, `P(Z ≤ 1.38) = 0.9162`, `She did better than 91.62% of the class.`], a: `z ≈ 1.38; better than 91.62%`, gs: "z1" },
{ t: "zp", q: `The grades in Aislinn's English class are normally distributed with mean 60% and standard deviation 11%. Aislinn scored 64%. What percentage of the class scored better than Aislinn?`, s: [`z = (64 − 60)/11 = 0.364 ≈ 0.36`, `P(Z > 0.36) = 1 − P(Z ≤ 0.36) = 1 − 0.6406 = 0.3594`], a: `35.94% scored better than Aislinn`, gs: "z2" },
{ t: "zp", q: `The grades in a maths class are normally distributed with mean 54% and standard deviation 8%. Sean scored 48%. What percentage of the class did he do better than?`, s: [`z = (48 − 54)/8 = −0.75`, `A negative z-score: P(Z ≤ −0.75) = 1 − P(Z ≤ 0.75)`, `= 1 − 0.7734 = 0.2266`], a: `Sean did better than 22.66% of the class`, gs: "z3" },
{ t: "zp", q: `The grades in a maths class are normally distributed with mean 54% and standard deviation 8%. What percentage of the class scored between 45% and 65%?`, s: [`z₁ = (45 − 54)/8 = −1.125 ≈ −1.13;  z₂ = (65 − 54)/8 = 1.375 ≈ 1.38`, `P(−1.13 ≤ Z ≤ 1.38) = P(Z ≤ 1.38) − P(Z ≤ −1.13)`, `P(Z ≤ −1.13) = 1 − P(Z ≤ 1.13) = 1 − 0.8708 = 0.1292`, `= 0.9162 − 0.1292 = 0.7870`], a: `78.70%`, gs: "z4" },
{ t: "zp", q: `The grades in an English class are normally distributed with mean 60% and standard deviation 11%. A student is selected at random. Find the probability that their grade is greater than 78% or less than 49%.`, s: [`Two separate tails, so find each probability and add.`, `x > 78: z = (78 − 60)/11 = 1.636 ≈ 1.64; P(Z > 1.64) = 1 − 0.9495 = 0.0505`, `x < 49: z = (49 − 60)/11 = −1; P(Z < −1) = 1 − 0.8413 = 0.1587`, `Total = 0.0505 + 0.1587 = 0.2092`], a: `0.2092`, gs: "z5" },
{ t: "zp", q: `The weights of the players at a football match are normally distributed with mean 79 kg and standard deviation 3 kg. Find (i) P(W ≤ 80.1 kg) and (ii) P(75.5 kg ≤ W ≤ 81 kg).`, s: [`(i) z = (80.1 − 79)/3 = 0.367 ≈ 0.37, so P(W ≤ 80.1) = 0.6443`, `(ii) z₁ = (75.5 − 79)/3 = −1.167 ≈ −1.17;  z₂ = (81 − 79)/3 = 0.667 ≈ 0.67`, `P = 0.7486 − P(Z ≤ −1.17) = 0.7486 − (1 − 0.8790) = 0.7486 − 0.1210 = 0.6276`], a: `(i) 0.6443  (ii) 0.6276` },
{ t: "zp", q: `The finishing times of the runners in a marathon are approximately normally distributed with mean 210 minutes and standard deviation 22 minutes. A runner is chosen at random. Find the probability that the runner finished in a time between 3 hours and 4 hours.`, s: [`Convert to minutes: 3 hours = 180 minutes and 4 hours = 240 minutes.`, `z₁ = (180 − 210)/22 = −1.364 ≈ −1.36;  z₂ = (240 − 210)/22 = 1.364 ≈ 1.36`, `P(−1.36 ≤ Z ≤ 1.36) = 0.9131 − (1 − 0.9131) = 0.8262`], a: `0.8262`, gs: "z7" },
{ t: "zp", q: `Aislinn scored 65% in maths (class mean 54%, standard deviation 8%) and 72% in English (class mean 60%, standard deviation 11%). Assuming both sets of grades are normally distributed, in which subject did she perform better relative to her classmates?`, s: [`Compare z-scores. Maths: z = (65 − 54)/8 = 1.375`, `English: z = (72 − 60)/11 = 1.091`, `Her maths z-score is higher, so relative to her class she did better in maths (about 91.62% of the class below her, against 86.21% in English).`], a: `Maths (z = 1.38 against z = 1.09)` },
{ t: "zp", q: `SAT scores are normally distributed with mean 1060 and standard deviation 215. In a group of 5000 candidates, how many would you expect to score above 1300?`, s: [`z = (1300 − 1060)/215 = 1.116 ≈ 1.12`, `P(Z > 1.12) = 1 − 0.8686 = 0.1314`, `5000 × 0.1314 = 657.0`], a: `about 657 candidates`, gs: "z9" },
{ t: "zb", q: `The grades in an English class are normally distributed with mean 60% and standard deviation 11%. Aoife scored better than 85% of the class. What was her grade?`, s: [`P(Z ≤ z) = 0.85. From the tables, z = 1.04.`, `z = (x − μ)/σ:  1.04 = (x − 60)/11`, `x − 60 = 11.44, so x = 71.44`], a: `about 71%`, gs: "b1" },
{ t: "zb", q: `The finishing times of marathon runners are approximately normally distributed with mean 210 minutes and standard deviation 22 minutes. The fastest 20% of runners receive an automatic entry to a later race. Find, in minutes and seconds, the time below which a runner must finish to receive automatic entry.`, s: [`Fastest 20% means P(T < t) = 0.20. The z-score is negative: P(Z < z) = 0.2 means P(Z < −z′) with P(Z ≤ z′) = 0.8.`, `From the tables z′ = 0.84, so z = −0.84.`, `t = 210 + (−0.84)(22) = 191.52 minutes`, `0.52 minutes × 60 ≈ 31 seconds`], a: `191 minutes 31 seconds`, gs: "b2" },
{ t: "zb", q: `SAT scores are normally distributed with mean 1060 and standard deviation 215. What score must a candidate obtain to be ranked in the top 5%?`, s: [`Top 5% means P(X > x) = 0.05, so P(Z ≤ z) = 0.95.`, `In the tables 0.9495 corresponds to 1.64 and 0.9505 to 1.65, so z ≈ 1.645.`, `x = 1060 + 1.645(215) = 1413.7`], a: `A score of about 1414 or higher`, gs: "b3" },
{ t: "zb", q: `SAT scores are normally distributed with mean 1060 and standard deviation 215. The probability that a candidate scores in the range [a, 1361] is 0.7073. Find the value of a.`, s: [`z for 1361: (1361 − 1060)/215 = 1.40, and P(Z ≤ 1.40) = 0.9192`, `P(Z ≤ zₐ) = 0.9192 − 0.7073 = 0.2119`, `From the tables zₐ = −0.80.`, `a = 1060 + (−0.80)(215) = 888`], a: `a = 888`, gs: "b4" },
{ t: "zb", q: `The heights of adult women in a region are normally distributed with a mean of 165 cm. 10% of the women are taller than 178 cm. Find the standard deviation.`, s: [`P(X > 178) = 0.10, so P(Z ≤ z) = 0.90 and z = 1.28.`, `z = (x − μ)/σ:  1.28 = (178 − 165)/σ`, `σ = 13/1.28 = 10.16`], a: `σ ≈ 10.2 cm` },
{ t: "zb", q: `The lengths of metal rods produced by a machine are normally distributed with standard deviation 0.6 cm. 3% of the rods are shorter than 9.2 cm. Find the mean length of the rods.`, s: [`P(X < 9.2) = 0.03. The z-score is negative; P(Z ≤ 1.88) = 0.9699, so P(Z < −1.88) = 0.0301 ≈ 0.03.`, `z = −1.88`, `−1.88 = (9.2 − μ)/0.6, so 9.2 − μ = −1.128`, `μ = 10.33`], a: `μ ≈ 10.33 cm` },
{ t: "zb", q: `The marks in an exam are normally distributed with mean 58 and standard deviation 12. The pass mark is set so that 70% of the candidates pass. What is the pass mark?`, s: [`70% pass means P(X > c) = 0.70, so P(X ≤ c) = 0.30 and z is negative.`, `P(Z ≤ 0.52) = 0.6985 ≈ 0.70, so P(Z ≤ −0.52) ≈ 0.30 and z = −0.52.`, `c = 58 + (−0.52)(12) = 51.76`], a: `Pass mark ≈ 52`, gs: "b7" },
{ t: "pci", q: `An insurance assessor takes a random sample of 140 computers from 3000 damaged in a flood and finds that 34 of them are damaged beyond repair. Create a 95% confidence interval for the proportion of computers that are damaged beyond repair.`, s: [`p̂ = 34/140 = 0.2429`, `Margin of error = 1.96${R(F("p̂(1 − p̂)","n"))} = 1.96${R(F("0.2429 × 0.7571","140"))} = 0.0710`, `Interval: 0.2429 ± 0.0710 = [0.172, 0.314]`], a: `0.172 ≤ p ≤ 0.314` },
{ t: "pci", q: `In an election campaign, a candidate believes that 59% of voters support him. A random sample of 504 voters is taken and 360 of them say they support him. Find a 95% confidence interval for the proportion of all voters who support the candidate.`, s: [`p̂ = 360/504 = 0.7143`, `Margin of error = 1.96${R(F("p̂(1 − p̂)","n"))} = 1.96${R(F("0.7143 × 0.2857","504"))} = 0.0394`, `Interval: 0.7143 ± 0.0394 = [0.675, 0.754]`], a: `0.675 ≤ p ≤ 0.754` },
{ t: "pci", q: `In a poll of 400 randomly selected adults, 120 said they use public transport to travel to work. Find a 95% confidence interval for the percentage of all adults who use public transport to travel to work.`, s: [`p̂ = 120/400 = 0.3000`, `Margin of error = 1.96${R(F("p̂(1 − p̂)","n"))} = 1.96${R(F("0.3000 × 0.7000","400"))} = 0.0449`, `Interval: 0.3000 ± 0.0449 = [0.255, 0.345]`], a: `25.5% ≤ p ≤ 34.5%` },
{ t: "pci", q: `In a referendum poll, 312 of a random sample of 600 voters say they will vote “Yes”. (i) Find a 95% confidence interval for the proportion of all voters who will vote Yes. (ii) The Yes campaign says it is certain to win a majority (more than 50%). Is the poll evidence enough to be sure of this?`, s: [`p̂ = 312/600 = 0.5200`, `Margin of error = 1.96${R(F("p̂(1 − p̂)","n"))} = 1.96${R(F("0.5200 × 0.4800","600"))} = 0.0400`, `Interval: 0.5200 ± 0.0400 = [0.480, 0.560]`, `(ii) 0.5 lies inside the interval [0.480, 0.560], so a true proportion at or below 50% is plausible. The poll does not prove a majority.`], a: `0.480 ≤ p ≤ 0.560; no, because 0.5 lies inside the interval` },
{ t: "pci", q: `A school surveys a random sample of 250 students and finds that 180 of them walk to school. Find a 95% confidence interval for the proportion of all students at the school who walk, and state it as a percentage range.`, s: [`p̂ = 180/250 = 0.7200`, `Margin of error = 1.96${R(F("p̂(1 − p̂)","n"))} = 1.96${R(F("0.7200 × 0.2800","250"))} = 0.0557`, `Interval: 0.7200 ± 0.0557 = [0.664, 0.776]`], a: `66.4% ≤ p ≤ 77.6%` },
{ t: "pbk", q: `A random sample of n runners is surveyed. It is found that the 95% confidence interval for the proportion of runners who drank a certain energy drink is [60.2%, 79.8%]. (i) Work out the proportion of the sample who drank the drink. (ii) Hence find n, the number of runners surveyed.`, s: [`(i) The sample proportion is the midpoint of the interval: p̂ = (0.602 + 0.798)/2 = 0.70`, `(ii) The margin of error is half the width: (0.798 − 0.602)/2 = 0.098`, `1.96${R(F("0.7 × 0.3","n"))} = 0.098`, `${R(F("0.21","n"))} = 0.098/1.96 = 0.05, so 0.21/n = 0.0025`, `n = 0.21/0.0025 = 84`], a: `(i) p̂ = 0.7  (ii) n = 84` },
{ t: "pbk", q: `In a poll, 60% of a sample of x voters said they voted in the last general election. A 95% confidence interval for the proportion of voters who said they voted was 0.55706 ≤ p ≤ 0.64294. Calculate the number of voters surveyed.`, s: [`Margin of error = (0.64294 − 0.55706)/2 = 0.04294`, `1.96${R(F("0.6 × 0.4","x"))} = 0.04294`, `0.24/x = (0.04294/1.96)² = 0.0004800`, `x = 0.24/0.0004800 = 500`], a: `x = 500 voters` },
{ t: "pbk", q: `An insurance assessor finds that 34 of a random sample of 140 computers are damaged. He wishes to halve the margin of error of the 95% confidence interval. Assuming the proportion damaged stays the same, how many computers should he include in the sample?`, s: [`The margin of error is 1.96${R(F("p̂(1 − p̂)","n"))}, proportional to 1/√n.`, `To halve it, √n must double, so n must be multiplied by 4.`, `New n = 4 × 140 = 560 computers.`], a: `560 computers` },
{ t: "pbk", q: `A polling company wants a 95% confidence interval for a proportion with a margin of error of at most 3%. Find the sample size needed (i) if an earlier survey suggested that the proportion is about 0.4, and (ii) if nothing is known about the proportion, so the worst case p = 0.5 is used.`, s: [`Margin of error = 1.96${R(F("p(1 − p)","n"))} ≤ 0.03`, `(i) n ≥ (1.96/0.03)² × 0.4 × 0.6 = 1024.4, so n = 1025`, `(ii) n ≥ (1.96/0.03)² × 0.5 × 0.5 = 1067.1, so n = 1068`, `Always round up to the next whole number.`], a: `(i) 1025  (ii) 1068` },
{ t: "pbk", q: `A 95% confidence interval for a population proportion, from a random sample of n people, is [0.42, 0.58]. Find the sample proportion and the sample size n.`, s: [`Midpoint: p̂ = (0.42 + 0.58)/2 = 0.5`, `Margin of error = (0.58 − 0.42)/2 = 0.08`, `1.96${R(F("0.5 × 0.5","n"))} = 0.08, so 0.25/n = (0.08/1.96)² = 0.001666`, `n = 0.25/0.001666 = 150.1 ≈ 150`], a: `p̂ = 0.5, n = 150` },
{ t: "moe", q: `A national poll surveys 1600 randomly chosen voters. Find the margin of error of the poll, as a percentage.`, s: [`Margin of error ≈ ${F("1",R("n"))} = ${F("1",R("1600"))} = ${F("1","40")} = 0.025`], a: `±2.5%` },
{ t: "moe", q: `A poll of 1000 voters finds that 56% support a proposal. Use the margin of error 1/√n to give an interval for the percentage of all voters who support it.`, s: [`Margin of error = 1/√1000 = 0.0316, i.e. 3.2%`, `Interval: 56% ± 3.2% = [52.8%, 59.2%]`], a: `52.8% to 59.2%` },
{ t: "moe", q: `A newspaper wants the margin of error of its poll to be ±2%. How many people must be surveyed?`, s: [`1/√n = 0.02`, `√n = 50, so n = 2500.`], a: `2500 people` },
{ t: "moe", q: `The margin of error of an opinion poll is quoted as ±4%. (i) How many people were surveyed? (ii) The poll company wants to halve the margin of error. How many people should it survey?`, s: [`(i) 1/√n = 0.04, so √n = 25 and n = 625.`, `(ii) 1/√n = 0.02, so √n = 50 and n = 2500.`, `Halving the margin of error needs four times the sample size.`], a: `(i) 625  (ii) 2500` },
{ t: "clt", q: `The incomes of employees at a large company are not normally distributed. The graph shows the shape of the distribution of incomes. The mean income is €60,000, the modal (most common) income is €40,000 and the standard deviation is €30,000. (i) Describe the shape of the distribution and mark the mean and the mode on it. (ii) Estimate the median income. (iii) Random samples of 32 employees are taken and the mean income of each sample is recorded. Describe the sampling distribution of the sample means, including its mean and standard deviation.`, s: [`(i) The distribution is skewed to the right (a long tail of high earners). The mode is at the peak (€40,000) and the mean (€60,000) is pulled out along the tail.`, `(ii) For a right-skewed distribution mode < median < mean, so the median lies between €40,000 and €60,000, for example about €50,000.`, `(iii) n = 32 ≥ 30, so by the Central Limit Theorem the sample means are approximately normally distributed, even though the population is not.`, `Mean of the sample means = μ = €60,000. Standard error = σ/√n = 30000/√32 = 5303.`], a: `Right-skewed; median between €40,000 and €60,000; sample means approximately normal with mean €60,000 and standard error ≈ €5,303`, g: "inc", gs: "incs" },
{ t: "clt", q: `A population has a very skewed distribution with mean 50 and standard deviation 20. Random samples of size 100 are taken. Describe the sampling distribution of the sample mean: its shape, its mean and its standard error.`, s: [`n = 100 ≥ 30, so by the Central Limit Theorem the sampling distribution of the mean is approximately normal, whatever the shape of the population.`, `Mean = μ = 50`, `Standard error = σ/√n = 20/√100 = 2`], a: `Approximately normal, mean 50, standard error 2` },
{ t: "clt", q: `The masses of a type of apple are normally distributed with mean 150 g and standard deviation 12 g. Random samples of 9 apples are taken. Describe the sampling distribution of the sample mean. Is it necessary for the sample size to be at least 30?`, s: [`The population is normal, so the sampling distribution of the mean is normal for every sample size, including n = 9.`, `Mean = 150 g.`, `Standard error = 12/√9 = 4 g.`, `The n ≥ 30 condition is only needed when the population is not normal.`], a: `Normal, mean 150 g, standard error 4 g; n ≥ 30 is not needed because the population is normal` },
{ t: "clt", q: `The standard deviation of the weights of newborn babies is 0.6 kg. A researcher takes random samples of size n and the standard error of the sample means is 0.075 kg. Find n. By what factor must n increase to halve the standard error?`, s: [`Standard error = σ/√n: 0.075 = 0.6/√n`, `√n = 0.6/0.075 = 8, so n = 64.`, `Halving the standard error needs √n to double, so n must be multiplied by 4 (to 256).`], a: `n = 64; multiply n by 4` },
{ t: "clt", q: `A light bulb manufacturer claims that the lifetime of its bulbs has a mean of 16 months and a standard deviation of 3 months. An independent company tests a random sample of 60 bulbs. Calculate an approximate value for the standard deviation of the sample means.`, s: [`Standard error = σ/√n = 3/√60 = 0.3873`], a: `≈ 0.387 months` },
{ t: "clt", q: `State whether each statement about the sampling distribution of the mean is true or false and correct any false statement. (a) Its mean is approximately equal to the population mean. (b) Its standard deviation is σ/n. (c) If the population is normal, the distribution is normal only when n ≥ 30. (d) If n ≥ 30 it is approximately normal whatever the population.`, s: [`(a) True: the mean of the sample means is μ.`, `(b) False: the standard deviation (standard error) is σ/√n, not σ/n.`, `(c) False: if the population is normal the sampling distribution is normal for any n.`, `(d) True (Central Limit Theorem).`], a: `(a) true  (b) false: σ/√n  (c) false: any n  (d) true` },
{ t: "zm", q: `A light bulb manufacturer claims that the lifetime of its bulbs has mean 16 months and standard deviation 3 months. A random sample of 60 bulbs is tested. (i) Assuming the claim is true, find the probability that the sample mean lifetime is 15 months or less. (ii) Do you agree with the manufacturer's claim if the sample mean was 15 months? Explain.`, s: [`Standard error = 3/√60 = 0.3873`, `(i) z = (x̄ − μ)/(σ/√n) = (15 − 16)/0.3873 = −2.582 ≈ −2.58`, `P(x̄ ≤ 15) = P(Z ≤ −2.58) = 1 − 0.9951 = 0.0049`, `(ii) If the claim were true, a sample mean this low would happen only about 0.5% of the time. This is very unlikely, so there is good reason to disagree with the claim.`], a: `(i) 0.0049  (ii) disagree: the probability is very small`, gs: "m1" },
{ t: "zm", q: `The masses of adult male swans have mean 11 kg and standard deviation 1.4 kg. A random sample of 49 swans is selected. Find the probability that the sample mean is greater than 11.3 kg.`, s: [`Standard error = 1.4/√49 = 0.20`, `z = (11.3 − 11)/0.20 = 1.50`, `P(Z > 1.50) = 1 − 0.9332 = 0.0668`], a: `0.0668` },
{ t: "zm", q: `Commuting times to a city centre have mean 34 minutes and standard deviation 9 minutes. A random sample of 36 commuters is taken. Find the probability that their mean commuting time is between 32 and 36 minutes.`, s: [`Standard error = 9/√36 = 1.5`, `z₁ = (32 − 34)/1.5 = −1.333 ≈ −1.33;  z₂ = (36 − 34)/1.5 = 1.333 ≈ 1.33`, `P(−1.33 ≤ Z ≤ 1.33) = 0.9082 − (1 − 0.9082) = 0.8164`], a: `0.8164` },
{ t: "zm", q: `The time taken to complete a task is normally distributed with mean 40 seconds and standard deviation 6 seconds. (i) Find the probability that a single task takes longer than 43 seconds. (ii) Find the probability that the mean time of a random sample of 25 tasks is longer than 43 seconds. Why are the answers so different?`, s: [`(i) A single value, so use σ: z = (43 − 40)/6 = 0.50; P(Z > 0.50) = 1 − 0.6915 = 0.3085`, `(ii) A sample mean, so use the standard error 6/√25 = 1.2: z = (43 − 40)/1.2 = 2.50; P(Z > 2.50) = 1 − 0.9938 = 0.0062`, `Sample means vary much less than individual values, because the standard error σ/√n is much smaller than σ.`], a: `(i) 0.3085  (ii) 0.0062` },
{ t: "zm", q: `Scores on a test have mean 75 and standard deviation 15. A random sample of 100 scores is taken. Find the probability that the sample mean differs from 75 by more than 2.`, s: [`Standard error = 15/√100 = 1.5`, `The sample mean is more than 2 away if x̄ > 77 or x̄ < 73. By symmetry both tails have the same probability.`, `z = 2/1.5 = 1.333 ≈ 1.33;  P(Z > 1.33) = 1 − 0.9082 = 0.0918`, `Total = 2 × 0.0918 = 0.1836`], a: `0.1836` },
{ t: "mci", q: `A random sample of 50 two-bedroom apartments in Dublin has a mean monthly rent of €1050 and a standard deviation of €390. Find a 95% confidence interval for the mean monthly rent of a two-bedroom apartment in Dublin.`, s: [`x̄ = 1050.0, s = 390.0, n = 50`, `Margin of error = 1.96 × ${F("390.0",R("50"))} = 108.10`, `Interval: 1050.0 ± 108.10 = [941.90, 1158.10]`], a: `941.90 ≤ μ ≤ 1158.10` },
{ t: "mci", q: `A random sample of 60 one-bedroom apartments in an area of Dublin has a mean monthly rent of €1150 and a standard deviation of €400. Find a 95% confidence interval for the mean rent of a one-bedroom apartment in this area, and interpret your interval.`, s: [`x̄ = 1150.0, s = 400.0, n = 60`, `Margin of error = 1.96 × ${F("400.0",R("60"))} = 101.21`, `Interval: 1150.0 ± 101.21 = [1048.79, 1251.21]`, `Interpretation: we are 95% confident that the mean monthly rent of all one-bedroom apartments in this area lies between these two values.`], a: `1048.79 ≤ μ ≤ 1251.21` },
{ t: "mci", q: `In the 2023 Rugby World Cup, the mean number of tries per match in a random sample of 36 matches was 6.4 with a standard deviation of 1.8. Form a 95% confidence interval for the mean number of tries per match.`, s: [`x̄ = 6.4, s = 1.8, n = 36`, `Margin of error = 1.96 × ${F("1.8",R("36"))} = 0.59`, `Interval: 6.4 ± 0.59 = [5.81, 6.99]`], a: `5.81 ≤ μ ≤ 6.99` },
{ t: "mci", q: `A random sample of 100 students has a mean height of 172.4 cm and a standard deviation of 6.5 cm. Find a 95% confidence interval for the mean height of all the students, and state the margin of error.`, s: [`x̄ = 172.4, s = 6.5, n = 100`, `Margin of error = 1.96 × ${F("6.5",R("100"))} = 1.27`, `Interval: 172.4 ± 1.27 = [171.13, 173.67]`], a: `171.13 ≤ μ ≤ 173.67, margin of error 1.27 cm` },
{ t: "mci", q: `The waiting time at a clinic has a sample mean of 12.5 minutes and sample standard deviation of 3.1 minutes from a random sample of 40 patients. Find a 95% confidence interval for the mean waiting time. Does it support a claim by the clinic that the mean waiting time is 15 minutes?`, s: [`x̄ = 12.5, s = 3.1, n = 40`, `Margin of error = 1.96 × ${F("3.1",R("40"))} = 0.96`, `Interval: 12.5 ± 0.96 = [11.54, 13.46]`, `15 is above the upper end of the interval, so the data do not support the clinic's claim.`], a: `11.54 ≤ μ ≤ 13.46; the claim of 15 minutes is not supported` },
{ t: "mbk", q: `A random sample of 100 students took the SAT. A 95% confidence interval for the mean SAT score of the sample was [1070.8, 1149.2]. Find the sample mean and the sample standard deviation.`, s: [`Sample mean = midpoint = (1070.8 + 1149.2)/2 = 1110`, `Margin of error = (1149.2 − 1070.8)/2 = 39.2`, `1.96 × ${F("s",R("100"))} = 39.2, so 0.196s = 39.2`, `s = 39.2/0.196 = 200`], a: `Sample mean 1110, standard deviation 200` },
{ t: "mbk", q: `A 95% confidence interval for the mean mass of a bag of sugar, based on a random sample of 64 bags, is [49.1, 50.9] grams. Find the sample mean and the sample standard deviation, to 2 decimal places.`, s: [`Midpoint: (49.1 + 50.9)/2 = 50`, `Margin of error = (50.9 − 49.1)/2 = 0.9`, `1.96 × ${F("s",R("64"))} = 0.9, so 0.245s = 0.9`, `s = 0.9/0.245 = 3.67`], a: `Mean 50 g, s ≈ 3.67 g` },
{ t: "mbk", q: `The standard deviation of the heights of a plant species is 15 mm. How large a random sample is needed so that the margin of error of a 95% confidence interval for the mean height is at most 2 mm?`, s: [`1.96 × ${F("15",R("n"))} ≤ 2`, `√n ≥ 1.96 × 15/2 = 14.7`, `n ≥ 216.09, so n = 217 (round up)`], a: `n = 217` },
{ t: "mbk", q: `A random sample has mean 82 and standard deviation 12. The 95% confidence interval for the population mean has a width of 6 units. Find the sample size n and write down the interval.`, s: [`Width 6, so the margin of error is 3.`, `1.96 × ${F("12",R("n"))} = 3, so √n = 1.96 × 12/3 = 7.84`, `n = 7.84² = 61.47, so n = 62 (round up)`, `Interval: [79, 85]`], a: `n = 62; [79, 85]` },
{ t: "mbk", q: `A 95% confidence interval for the mean weekly spend of customers, from a random sample of 49 customers, is [€412, €468]. Find the sample mean and the sample standard deviation.`, s: [`Midpoint: (412 + 468)/2 = 440`, `Margin of error = (468 − 412)/2 = 28`, `1.96 × ${F("s",R("49"))} = 28, so 0.28s = 28`, `s = 100`], a: `Mean €440, standard deviation €100` },
{ t: "hyp", q: `A candidate believes that 59% of voters support him. A random sample of 504 voters is selected, and 360 of them say they support him. State the null hypothesis and the alternative hypothesis for a test of the candidate's claim.`, s: [`The null hypothesis is the claim being tested: the population proportion is 59%.`, `H₀: p = 0.59 (the proportion of all voters who support him is 59%)`, `H₁: p ≠ 0.59 (the proportion is different from 59%)`, `The wording “test the validity of the claim” gives a two-tailed test.`], a: `H₀: p = 0.59; H₁: p ≠ 0.59` },
{ t: "hyp", q: `A company claims that the mean volume of water in its 500 ml bottles is 500 ml, with standard deviation 7 ml. An inspector tests a random sample of 40 bottles and finds a mean volume of 497.2 ml. At the 5% level of significance, state the hypotheses, the critical values and your conclusion.`, s: [`H₀: μ = 500 ml; H₁: μ ≠ 500 ml (two-tailed).`, `Test statistic: z = (x̄ − μ)/(σ/√n) = (497.2 − 500)/(7/√40) = −2.53`, `At the 5% level the critical values are ±1.96, so the critical region is z < −1.96 or z > 1.96.`, `−2.53 lies in the critical region, so reject H₀.`, `Conclusion: there is evidence at the 5% level that the mean volume is not 500 ml.`], a: `z = −2.53; reject H₀: evidence that the mean volume differs from 500 ml`, gs: "h2" },
{ t: "hyp", q: `A manufacturer claims that the mean life of its batteries is 40 hours. A consumer group suspects the mean life is less. A random sample of 36 batteries has a mean life of 38.9 hours. The standard deviation is 3.5 hours. Test the manufacturer's claim at the 5% level of significance.`, s: [`H₀: μ = 40; H₁: μ < 40 (one-tailed, because the group suspects the life is less).`, `z = (38.9 − 40)/(3.5/√36) = −1.89`, `For a one-tailed test at 5% the critical value is −1.645 (all 5% in the left tail).`, `−1.89 < −1.645, so z is in the critical region: reject H₀.`, `Conclusion: there is evidence at the 5% level that the mean battery life is less than 40 hours.`], a: `z = −1.89; reject H₀: evidence that the mean life is less than 40 hours`, gs: "h3" },
{ t: "hyp", q: `A courier claims that the mean delivery time is 2.4 days. A random sample of 100 deliveries has a mean of 2.49 days. Assume the standard deviation is 0.6 days. Test, at the 5% level, whether the mean delivery time differs from the claim, and write your conclusion in the context of the question.`, s: [`H₀: μ = 2.4; H₁: μ ≠ 2.4`, `z = (2.49 − 2.4)/(0.6/√100) = 0.09/0.06 = 1.50`, `Critical values ±1.96. Since 1.50 is between −1.96 and 1.96, z is not in the critical region.`, `Do not reject H₀.`, `Conclusion: there is not enough evidence to say that the mean delivery time is different from 2.4 days.`], a: `z = 1.50; do not reject H₀: no evidence that the mean delivery time differs from 2.4 days`, gs: "h4" },
{ t: "hyp", q: `State a suitable null hypothesis and alternative hypothesis, and say whether the test is one-tailed or two-tailed, for each situation. (a) A teacher claims the mean mark in a class is 65, but a colleague thinks it has changed. (b) A packet states a mean mass of at least 500 g; an inspector thinks the mean is lower. (c) A council says 40% of residents cycle to work; a survey suggests the proportion is higher.`, s: [`(a) H₀: μ = 65; H₁: μ ≠ 65. Two-tailed (“has changed”, in either direction).`, `(b) H₀: μ = 500; H₁: μ < 500. One-tailed (the inspector suspects lower only).`, `(c) H₀: p = 0.4; H₁: p > 0.4. One-tailed (suspects higher only).`], a: `(a) μ = 65 v μ ≠ 65, two-tailed  (b) μ = 500 v μ < 500, one-tailed  (c) p = 0.4 v p > 0.4, one-tailed` },
{ t: "cit", q: `It is claimed that the mean monthly rent of a two-bedroom apartment in Dublin was €994 in 2015. A sample of 50 apartments has mean rent €1050 and standard deviation €390. Use a 95% confidence interval to decide whether the sample is consistent with the claim.`, s: [`95% CI: 1050 ± 1.96(390/√50) = [941.9, 1158.1]`, `H₀: μ = 994. The claimed value 994 lies inside the interval.`, `Do not reject H₀: the sample is consistent with a mean rent of €994.`], a: `Interval [941.9, 1158.1] contains 994: the claim is not rejected`, gs: "ci1" },
{ t: "cit", q: `It is widely believed that the mean number of tries scored per rugby match is 5.9. A sample of 36 matches from the 2023 World Cup has a mean of 6.4 tries with standard deviation 1.8. Use a 95% confidence interval to decide whether there is evidence that the mean has changed.`, s: [`95% CI: 6.4 ± 1.96(1.8/√36) = 6.4 ± 0.588 = [5.81, 6.99]`, `H₀: μ = 5.9. The value 5.9 is inside the interval, so do not reject H₀.`, `There is not enough evidence at the 5% level to conclude that the mean number of tries per match has changed.`], a: `5.9 lies in [5.81, 6.99]: do not reject H₀; no evidence of a change`, gs: "ci2" },
{ t: "cit", q: `A candidate claims that 59% of voters support him. In a random sample of 504 voters, 360 support him. Using the 95% confidence interval for the proportion, test the validity of his claim.`, s: [`p̂ = 360/504 = 0.7143; margin of error = 1.96√(0.7143 × 0.2857/504) = 0.0394`, `95% CI: [0.675, 0.754]`, `H₀: p = 0.59. The value 0.59 lies outside the interval, so reject H₀.`, `The claim is not supported; the sample suggests support is higher than 59%.`], a: `0.59 lies outside [0.675, 0.754]: reject the claim; support appears to be higher`, gs: "ci3" },
{ t: "cit", q: `A company claims that 80% of its customers are satisfied. In a random sample of 200 customers, 150 say they are satisfied. Use a 95% confidence interval to decide whether the company's claim should be rejected.`, s: [`p̂ = 150/200 = 0.75; margin of error = 1.96√(0.75 × 0.25/200) = 0.0600`, `95% CI: [0.690, 0.810]`, `H₀: p = 0.8. Since 0.8 lies inside the interval, do not reject H₀.`, `The sample does not provide enough evidence against the claim, even though the sample proportion is below 80%.`], a: `0.8 lies in [0.690, 0.810]: do not reject the claim`, gs: "ci4" },
{ t: "ptt", q: `A candidate believes that 59% of voters support him. In a random sample of 504 voters, 360 say they support him. Test the validity of his claim at the 5% level of significance, using a test statistic.`, s: [`H₀: p = 0.59; H₁: p ≠ 0.59`, `p̂ = 360/504 = 0.7143`, `z = (p̂ − p)/${R(F("p(1 − p)","n"))} = (0.7143 − 0.59)/${R(F("0.59 × 0.41","504"))} = 5.67`, `|z| = 5.67 > 1.96, so z is in the critical region: reject H₀.`, `Conclusion: the claim is not valid; there is strong evidence that the support is not 59%.`], a: `z = 5.67; reject H₀: the claim is not valid`, gs: "pt1" },
{ t: "ptt", q: `In 2019, 78.4% of Higher Level Maths candidates achieved a mark over 50%. In 2020, 275 of the 389 candidates achieved a mark over 50%. A student claims the 2020 result is not in line with previous years. Test, at the 5% level of significance, the hypothesis that the percentage of candidates over 50% had not changed. State your hypotheses and conclusion in context.`, s: [`H₀: p = 0.784; H₁: p ≠ 0.784`, `p̂ = 275/389 = 0.7069`, `z = (0.7069 − 0.784)/${R(F("0.784 × 0.216","389"))} = −3.69`, `|z| = 3.69 > 1.96: reject H₀.`, `Conclusion: there is evidence at the 5% level that the percentage of candidates who achieved over 50% in 2020 was different from 2019 (it was lower).`], a: `z = −3.69; reject H₀: the 2020 proportion differs from 2019`, gs: "pt2" },
{ t: "ptt", q: `A die is rolled 300 times and a six comes up 62 times. Test at the 5% level of significance whether the die is fair.`, s: [`H₀: p = 1/6 (fair); H₁: p ≠ 1/6`, `p̂ = 62/300 = 0.2067`, `z = (0.2067 − 1/6)/${R(F("(1/6)(5/6)","300"))} = 1.86`, `1.86 lies between −1.96 and 1.96: do not reject H₀.`, `Conclusion: there is not enough evidence to say that the die is unfair.`], a: `z = 1.86; do not reject H₀: no evidence the die is unfair`, gs: "pt3" },
{ t: "ptt", q: `A drug company claims that its treatment is successful in 70% of patients. In a trial, 130 of 200 patients improved. A doctor thinks the claim is overstated. Test the claim at the 5% level of significance.`, s: [`H₀: p = 0.7; H₁: p < 0.7 (one-tailed: the claim is thought to be too high)`, `p̂ = 130/200 = 0.65`, `z = (0.65 − 0.7)/${R(F("0.7 × 0.3","200"))} = −1.54`, `The one-tailed 5% critical value is −1.645. Since −1.54 > −1.645, do not reject H₀.`, `Conclusion: there is not enough evidence that the drug's success rate is below 70%.`], a: `z = −1.54; do not reject H₀`, gs: "pt4" },
{ t: "mtt", q: `A company claims that its vitamin supplement increases bone mineral density (BMD). A sample of 100 24-year-old women who took the supplement for 3 months had a mean BMD of 970 mg/cm² with standard deviation 120 mg/cm². The mean BMD of 24-year-old women is 940 mg/cm². Test, at the 5% level of significance, the hypothesis that the mean BMD has not changed. State your conclusion in context.`, s: [`H₀: μ = 940; H₁: μ ≠ 940`, `z = (970 − 940)/(120/√100) = 30/12 = 2.50`, `2.50 > 1.96: in the critical region, so reject H₀.`, `Conclusion: there is evidence at the 5% level that taking the supplement changed the mean BMD (it appears to have increased it).`], a: `z = 2.50; reject H₀: evidence that the supplement changed mean BMD`, gs: "mt1" },
{ t: "mtt", q: `A school's mean score in a standardised test was 62. The principal ran extra preparation classes the following year. The 200 students who sat the test had a mean of 64. Assume the standard deviation is 13. Investigate, at the 5% level of significance, if there is evidence that the school's performance has changed.`, s: [`H₀: μ = 62; H₁: μ ≠ 62`, `z = (64 − 62)/(13/√200) = 2/0.9192 = 2.18`, `2.18 > 1.96: reject H₀.`, `Conclusion: there is evidence at the 5% level that the school's performance has changed.`], a: `z = 2.18; reject H₀: evidence of a change`, gs: "mt2" },
{ t: "mtt", q: `The mean mark of candidates in a national exam was 63.3% with standard deviation 16.4%. A random sample of candidates who appealed their results had a mean mark of 67.5%. Show that if the sample size was 25 the result is not significant at the 5% level, and that if the sample size was 100 it is significant.`, s: [`H₀: μ = 63.3; H₁: μ ≠ 63.3.  Critical values ±1.96.`, `n = 25: z = (67.5 − 63.3)/(16.4/√25) = 4.2/3.28 = 1.28. Since 1.28 < 1.96, the result is not significant.`, `n = 100: z = 4.2/(16.4/√100) = 4.2/1.64 = 2.56. Since 2.56 > 1.96, the result is significant.`, `The same sample mean is significant for a larger sample because the standard error is smaller.`], a: `n = 25: z = 1.28 (not significant); n = 100: z = 2.56 (significant)`, gs: "mt3" },
{ t: "mtt", q: `Using the data above (population mean 63.3%, standard deviation 16.4%, sample mean 67.5%), find the smallest sample size for which this result could be regarded as significant at the 5% level.`, s: [`Need z = 4.2/(16.4/√n) > 1.96`, `√n > 1.96 × 16.4/4.2 = 7.653`, `n > 58.57, so the smallest sample size is n = 59.`], a: `n = 59` },
{ t: "mtt", q: `The speed limit on a motorway is 112 km/h. The speeds of 150 randomly selected cars were recorded: the mean was 115 km/h and the standard deviation was 24 km/h. Test, at the 5% level of significance, the hypothesis that the mean speed of cars is greater than the speed limit. State the null and alternative hypotheses and give your conclusion in context.`, s: [`H₀: μ = 112; H₁: μ > 112 (one-tailed)`, `z = (115 − 112)/(24/√150) = 3/1.960 = 1.53`, `The one-tailed 5% critical value is 1.645. Since 1.53 < 1.645, do not reject H₀.`, `Conclusion: there is not enough evidence at the 5% level that the mean speed of cars is greater than the limit.`], a: `z = 1.53; do not reject H₀: no evidence the mean speed exceeds 112 km/h`, gs: "mt5" },
{ t: "mtt", q: `Using the car speed data above (limit 112 km/h, sample mean 115 km/h, standard deviation 24 km/h), find the smallest sample size for which this result would be significant for a one-tailed test at the 5% level.`, s: [`Need z = 3/(24/√n) > 1.645`, `√n > 1.645 × 24/3 = 13.16`, `n > 173.19, so the smallest sample size is n = 174.`], a: `n = 174` },
{ t: "mtt", q: `It is widely believed that the mean number of tries per rugby match is 5.9 with standard deviation 1.8. A sample of 36 matches from the 2023 World Cup has a mean of 6.4. Conduct a hypothesis test at the 5% level to see if there is enough evidence that the mean has changed.`, s: [`H₀: μ = 5.9; H₁: μ ≠ 5.9`, `z = (6.4 − 5.9)/(1.8/√36) = 0.5/0.3 = 1.67`, `1.67 lies between −1.96 and 1.96: do not reject H₀.`, `Conclusion: there is not enough evidence to say that the mean number of tries per match has changed.`], a: `z = 1.67; do not reject H₀`, gs: "mt7" },
{ t: "mtt", q: `A report claims that the mean monthly rent of a one-bedroom apartment in Dublin is €1000. In a sample of 60 one-bedroom apartments in one area, the mean rent was €1150 with standard deviation €400. Test at the 5% level whether the mean rent in this area differs from the citywide claim. State your hypotheses and conclusion.`, s: [`H₀: μ = 1000; H₁: μ ≠ 1000 (the sample standard deviation is used for σ as n = 60 is large)`, `z = (1150 − 1000)/(400/√60) = 150/51.64 = 2.90`, `2.90 > 1.96: reject H₀.`, `Conclusion: there is evidence at the 5% level that the mean rent in this area is different from €1000 (it is higher).`], a: `z = 2.90; reject H₀: the mean rent in this area differs from €1000`, gs: "mt8" },
{ t: "pv", q: `In a sample of 60 one-bedroom apartments the mean rent was €1150 with standard deviation €400. The claimed mean is €1000. For the two-tailed test of H₀: μ = 1000, find the p-value and explain what it represents.`, s: [`z = (1150 − 1000)/(400/√60) = 2.905 ≈ 2.90`, `P(Z > 2.90) = 1 − 0.9981 = 0.0019`, `Two-tailed: p-value = 2 × 0.0019 = 0.0038`, `Meaning: if the true mean rent were €1000, there would be only a 0.38% chance of getting a sample mean this far or further from €1000 (in either direction). This is below 5%, so it is strong evidence against H₀.`], a: `p = 0.0038: very unlikely if the mean really were €1000`, gs: "pv1" },
{ t: "pv", q: `In the vitamin supplement test (H₀: μ = 940, sample mean 970, σ = 120, n = 100), find the p-value and explain what it represents in the context of the question. Is the result significant at the 5% level? At the 1% level?`, s: [`z = 30/12 = 2.50`, `P(Z > 2.50) = 1 − 0.9938 = 0.0062`, `Two-tailed: p-value = 2 × 0.0062 = 0.0124`, `Meaning: if the supplement had no effect, there would be a 1.24% chance of a sample mean BMD at least this far from 940.`, `p = 0.0124 < 0.05: significant at the 5% level. p = 0.0124 > 0.01: not significant at the 1% level.`], a: `p = 0.0124: significant at 5%, not at 1%`, gs: "pv2" },
{ t: "pv", q: `The speeds of 150 cars have mean 115 km/h and standard deviation 24 km/h; the limit is 112 km/h. (i) Find the p-value for the one-tailed test of H₀: μ = 112 against H₁: μ > 112. (ii) What would the p-value be for a two-tailed test, and what can you conclude at the 5% level?`, s: [`z = 3/(24/√150) = 1.531 ≈ 1.53`, `(i) One-tailed p-value = P(Z > 1.53) = 1 − 0.9370 = 0.0630`, `(ii) Two-tailed p-value = 2 × 0.0630 = 0.1260`, `Both p-values are greater than 0.05, so the result is not significant: there is not enough evidence that the mean speed differs from (or exceeds) 112 km/h.`], a: `(i) 0.0630  (ii) 0.1260; not significant at 5%`, gs: "pv3" },
{ t: "pv", q: `For the rugby test (H₀: μ = 5.9, sample mean 6.4, σ = 1.8, n = 36), calculate the p-value and interpret it in the context of the question.`, s: [`z = (6.4 − 5.9)/(1.8/√36) = 1.667 ≈ 1.67`, `P(Z > 1.67) = 1 − 0.9525 = 0.0475`, `Two-tailed: p-value = 2 × 0.0475 = 0.0950`, `Meaning: if the true mean were 5.9 tries per match, there would be a 9.5% chance of getting a sample mean at least 0.5 tries away from 5.9. As this is greater than 5%, the result is not significant.`], a: `p = 0.0950: not significant at 5%`, gs: "pv4" },
{ t: "pv", q: `A hypothesis test gives a p-value of 0.032. State your conclusion at the 5% level and at the 1% level, and explain what the p-value 0.032 means.`, s: [`At the 5% level: 0.032 < 0.05, so reject H₀: the result is significant.`, `At the 1% level: 0.032 > 0.01, so do not reject H₀: the result is not significant.`, `Meaning: if H₀ were true, there would be a 3.2% chance of getting a result at least as extreme as the one observed.`], a: `Significant at 5%; not significant at 1%; 3.2% chance of such an extreme result if H₀ is true` },
{ t: "pv", q: `In the test comparing the 2020 and 2019 results (z = −3.69 for H₀: p = 0.784 using 275 of 389 candidates), find the p-value and explain what it represents.`, s: [`z = −3.69, so |z| = 3.69`, `P(Z > 3.69) = 1 − 0.9999 = 0.0001`, `Two-tailed: p-value = 2 × 0.0001 = 0.0002`, `Meaning: if the true proportion of candidates over 50% were still 78.4%, there would be only about a 0.02% chance of getting a 2020 result this far from 78.4%. This is strong evidence that the proportion has changed.`], a: `p = 0.0002: strong evidence the proportion has changed`, gs: "pv6" },
];

// ---- integration diagrams ----
function areaFig(o) {
  const it = [];
  (o.sh || []).forEach((s) => { const g = s.g || (() => 0), N = 90, pts = []; for (let k = 0; k <= N; k++) { const X = s.lo + (s.hi - s.lo) * k / N; pts.push([X, s.f(X)]); } for (let k = N; k >= 0; k--) { const X = s.lo + (s.hi - s.lo) * k / N; pts.push([X, g(X)]); } it.push({ k: "poly", pts, fill: s.fill || "rgba(185,91,60,.28)", stroke: "none", c: "none" }); });
  return gfig(Object.assign({}, o, { items: it.concat(o.items || []) }));
}
