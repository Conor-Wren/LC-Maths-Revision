/* Identities */
{ t: "ident", q: `Find a and b if (x + a)${s2} + b ≡ x${s2} − 10x + 31 for all values of x.`,
  s: [`x${s2} + 2ax + a${s2} + b`, "x: 2a = −10 ⇒ a = −5", "constant: 25 + b = 31 ⇒ b = 6"], a: "a = −5, b = 6", also: ["cts"] },
{ t: "ident", q: `Find p, q and r if 2x${s3} + px${s2} + 11x − 6 ≡ (2x − 1)(x${s2} + qx + r).`,
  s: [`RHS = 2x${s3} + (2q − 1)x${s2} + (2r − q)x − r`, "−r = −6 ⇒ r = 6", "2r − q = 11 ⇒ q = 1", "p = 2q − 1 = 1"], a: "p = 1, q = 1, r = 6" },
{ t: "ident", q: `Find a, b and c if (x − 2)(ax${s2} + bx + c) ≡ 3x${s3} − 4x${s2} − 5x + 2 for all x.`,
  s: [`LHS = ax${s3} + (b − 2a)x${s2} + (c − 2b)x − 2c`, "a = 3; b − 6 = −4 ⇒ b = 2; c − 4 = −5 ⇒ c = −1", "Check: −2c = 2 ✓"], a: "a = 3, b = 2, c = −1" },
{ t: "ident", q: `Find p and q if x${s2} + px + 5 ≡ (x − 3)${s2} + q for all values of x.`,
  s: [`(x − 3)${s2} + q = x${s2} − 6x + 9 + q`, "p = −6; 9 + q = 5 ⇒ q = −4"], a: "p = −6, q = −4", also: ["cts"] },
{ t: "ident", q: `If (x − a)${s2} is a factor of x${s3} + px + q, prove that 4p${s3} + 27q${s2} = 0.`,
  s: [`No x² term, so the third factor is (x + 2a)`, `(x − a)${s2}(x + 2a) = x${s3} − 3a${s2}x + 2a${s3}`, "p = −3a², q = 2a³", "4(−27a⁶) + 27(4a⁶) = 0"], a: "Shown", also: ["factor"] },

/* Fractions */
{ t: "frac", q: `Express ${F("3", "x − 2")} − ${F("2", "x + 3")} as a single fraction.`,
  s: ["LCD = (x − 2)(x + 3)", "3(x + 3) − 2(x − 2) = x + 13"], a: `${F("x + 13", "(x − 2)(x + 3)")}` },
{ t: "frac", q: `Solve ${F("x", "x − 2")} − ${F("3", "x + 1")} = 1.`,
  s: ["× (x − 2)(x + 1): x(x + 1) − 3(x − 2) = (x − 2)(x + 1)", `x${s2} − 2x + 6 = x${s2} − x − 2 ⇒ x = 8`], a: "x = 8" },
{ t: "frac", q: `Simplify fully ${F(`2x${s2} − 8`, `x${s2} − x − 6`)}.`,
  s: [`Top: 2(x − 2)(x + 2); bottom: (x − 3)(x + 2)`, "Cancel (x + 2)"], a: `${F("2(x − 2)", "x − 3")}` },
{ t: "frac", q: `Solve ${F("3", "x + 1")} + ${F("2", "x − 1")} = 1.`,
  s: ["× (x + 1)(x − 1): 3(x − 1) + 2(x + 1) = x² − 1", "5x − 1 = x² − 1 ⇒ x(x − 5) = 0"], a: "x = 0 or x = 5" },
{ t: "frac", q: `Find A and B such that ${F("5x + 1", "(x − 1)(x + 2)")} ≡ ${F("A", "x − 1")} + ${F("B", "x + 2")}.`,
  s: ["5x + 1 ≡ A(x + 2) + B(x − 1)", "x = 1: 6 = 3A ⇒ A = 2", "x = −2: −9 = −3B ⇒ B = 3"], a: "A = 2, B = 3", also: ["ident"] },

/* Triple */
{ t: "triple", q: `Solve: x + y + z = 6,  2x + y − z = 1,  x − y + 2z = 5.`,
  s: ["① + ②: 3x + 2y = 7", "2×② + ③: 5x + y = 7", "Solve: x = 1, y = 2; then z = 3"], a: "x = 1, y = 2, z = 3" },
{ t: "triple", q: `Solve: 2x + 3y − z = −2,  3x − 2y + 2z = 14,  5x + 4y − 3z = −3.`,
  s: ["2×① + ②: 7x + 4y = 10", "③ − 3×①: −x − 5y = 3", "Solve: y = −1, x = 2; z = 2x + 3y + 2 = 3"], a: "x = 2, y = −1, z = 3" },
{ t: "triple", q: `A cinema sold 50 tickets: adult €12, child €7 and student €9. Takings were €495 and the number of adult tickets equalled the child and student tickets combined. How many of each were sold?`,
  s: ["a + c + s = 50, 12a + 7c + 9s = 495, a = c + s", "a = 25, c + s = 25", "7c + 9s = 195 ⇒ c = 15, s = 10"], a: "25 adult, 15 child, 10 student" },
{ t: "triple", q: `Solve: x + 2y − z = 3,  2x − y + z = 4,  3x + y + 2z = 9.`,
  s: ["① + ②: 3x + y = 7", "③ − 2×②: −x + 3y = 1", "x = 2, y = 1; then z = 1"], a: "x = 2, y = 1, z = 1" },
{ t: "triple", q: `A quadratic y = ax${s2} + bx + c passes through the points shown. Find a, b and c.`, g: "p3",
  s: ["a − b + c = 10, a + b + c = 4, 4a + 2b + c = 4", "2b = −6 ⇒ b = −3; a + c = 7; 4a + c = 10", "a = 1, c = 6"], a: `y = x${s2} − 3x + 6`, also: ["graphs"] },

/* Cubes */
{ t: "cubes", q: `Factorise 8a${s3} + 125.`,
  s: [`(2a)${s3} + 5${s3}`, "a³ + b³ = (a + b)(a² − ab + b²)"], a: `(2a + 5)(4a${s2} − 10a + 25)` },
{ t: "cubes", q: `Factorise fully 3x${s4} − 24x.`,
  s: [`HCF: 3x(x${s3} − 8)`, "Difference of two cubes"], a: `3x(x − 2)(x${s2} + 2x + 4)` },
{ t: "cubes", q: `Given x + y = 5 and xy = 3, find x${s3} + y${s3} without finding x or y.`,
  s: [`x${s3} + y${s3} = (x + y)${s3} − 3xy(x + y)`, "= 125 − 45"], a: "80", also: ["ident"] },
{ t: "cubes", q: `Factorise 27x${s3} − 8.`,
  s: [`(3x)${s3} − 2${s3}`, "a³ − b³ = (a − b)(a² + ab + b²)"], a: `(3x − 2)(9x${s2} + 6x + 4)` },
{ t: "cubes", q: `Factorise fully x<sup>6</sup> − 64.`,
  s: [`Difference of squares first: (x${s3} − 8)(x${s3} + 8)`, "Then a difference and a sum of cubes"], a: `(x − 2)(x + 2)(x${s2} + 2x + 4)(x${s2} − 2x + 4)` },

/* Surds */
{ t: "surd", q: `Solve ${R("3x + 4")} = x.`,
  s: [`3x + 4 = x${s2} ⇒ (x − 4)(x + 1) = 0`, "Check: x = −1 gives 1 ≠ −1 ✗"], a: "x = 4" },
{ t: "surd", q: `Solve ${R("5x + 1")} − ${R("x + 1")} = 2.`,
  s: [`${R("5x + 1")} = 2 + ${R("x + 1")}; square: x − 1 = ${R("x + 1")}`, `Square again: x${s2} − 3x = 0 ⇒ x = 0 or 3`, "Check: x = 0 gives 0 ≠ 2 ✗"], a: "x = 3" },
{ t: "surd", q: `Solve ${R("2x + 5")} + ${R("x + 2")} = ${R("5x + 11")}.`,
  s: [`Square: ${R("(2x + 5)(x + 2)")} = x + 2`, "Square: (x + 2)(x + 3) = 0", "x = −3 gives √(−1): not real ✗"], a: "x = −2" },
{ t: "surd", q: `Solve x − ${R("x + 7")} = 5.`,
  s: [`x − 5 = ${R("x + 7")} ⇒ x${s2} − 11x + 18 = 0`, "x = 9 or 2; x = 2 gives −1 ≠ 5 ✗"], a: "x = 9" },
{ t: "surd", q: `Solve ${R("2x + 6")} − ${R("x + 4")} = 1.`,
  s: [`Isolate and square: x + 1 = 2${R("x + 4")}`, `Square: x${s2} − 2x − 15 = 0 ⇒ x = 5 or −3`, "x = −3 gives −1 ≠ 1 ✗"], a: "x = 5" },

/* Completing the square */
{ t: "cts", q: `Write x${s2} + 8x + 21 in the form (x + p)${s2} + q and state the minimum value.`,
  s: ["Half of 8 is 4: (x + 4)² − 16 + 21"], a: `(x + 4)${s2} + 5; minimum 5 at x = −4` },
{ t: "cts", q: `Write −3x${s2} + 12x + 5 in the form a(x + h)${s2} + k and state the maximum point.`,
  s: ["−3(x² − 4x) + 5 = −3[(x − 2)² − 4] + 5"], a: `−3(x − 2)${s2} + 17; max (2, 17)` },
{ t: "cts", q: `By completing the square, solve 2x${s2} − 8x + 3 = 0, giving answers in surd form.`,
  s: ["2(x − 2)² − 5 = 0 ⇒ (x − 2)² = 5/2", `x − 2 = ±${R("10")}/2`], a: `x = 2 ± ${F(R("10"), "2")}` },
{ t: "cts", q: `Write g(x) = 2x${s2} − 12x + 23 in the form a(x − h)${s2} + k and explain why g(x) > 0 for all x.`,
  s: ["2(x² − 6x) + 23 = 2(x − 3)² − 18 + 23", "A square is never negative, so g(x) ≥ 5"], a: `2(x − 3)${s2} + 5; minimum 5 > 0` },
{ t: "cts", q: `By completing the square on ax${s2} + bx + c = 0, derive the quadratic formula.`,
  s: ["÷ a; (x + b/2a)² = (b² − 4ac)/4a²", "Square root and subtract b/2a"], a: `x = ${F(`−b ± ${R("b² − 4ac")}`, "2a")}` },

/* Factor theorem */
{ t: "factor", q: `Show that x − 3 is a factor of f(x) = x${s3} − 4x${s2} + x + 6 and factorise f(x) fully.`,
  s: ["f(3) = 27 − 36 + 3 + 6 = 0", "Divide: x² − x − 2 = (x − 2)(x + 1)"], a: "(x − 3)(x − 2)(x + 1)" },
{ t: "factor", q: `Given that 2x − 1 is a factor of 2x${s3} + kx${s2} − 13x + 6, find k and solve f(x) = 0.`,
  s: ["f(½) = 0 ⇒ ¼ + k/4 − 13/2 + 6 = 0 ⇒ k = 1", "(2x − 1)(x² + x − 6) = (2x − 1)(x + 3)(x − 2)"], a: "k = 1; x = ½, −3, 2" },
{ t: "factor", q: `Given that x${s2} − x − 2 is a factor of x${s3} + ax${s2} + bx − 6, find a and b.`,
  s: ["x² − x − 2 = (x − 2)(x + 1): f(2) = 0 and f(−1) = 0", "2a + b = −1 and a − b = 7"], a: "a = 2, b = −5 (third factor x + 3)" },
{ t: "factor", q: `x − 1 and x + 2 are factors of x${s3} + ax${s2} + bx − 6. Find a, b and the third factor.`,
  s: ["f(1) = 0 ⇒ a + b = 5", "f(−2) = 0 ⇒ 2a − b = 7", "a = 4, b = 1; x³ + 4x² + x − 6 = (x² + x − 2)(x + 3)"], a: "a = 4, b = 1; (x + 3)" },
{ t: "factor", q: `Show that x + 2 is a factor of 2x${s3} − 3x${s2} − 11x + 6 and solve 2x${s3} − 3x${s2} − 11x + 6 = 0.`,
  s: ["f(−2) = −16 − 12 + 22 + 6 = 0", "(x + 2)(2x² − 7x + 3) = (x + 2)(2x − 1)(x − 3)"], a: "x = −2, ½, 3" },

/* Non-linear */
{ t: "nonlin", q: `Solve: y = x + 1 and x${s2} + y${s2} = 13.`,
  s: [`x${s2} + (x + 1)${s2} = 13 ⇒ x${s2} + x − 6 = 0`, "x = 2 or −3"], a: "(2, 3) and (−3, −2)" },
{ t: "nonlin", q: `Find where the line x + y = 6 meets the circle x${s2} + y${s2} − 4x + 2y − 20 = 0.`,
  s: ["y = 6 − x; substitute", `2x${s2} − 18x + 28 = 0 ⇒ (x − 2)(x − 7) = 0`], a: "(2, 4) and (7, −1)" },
{ t: "nonlin", q: `Find the points of intersection of x + 2y = 5 and x${s2} + y${s2} = 10.`,
  s: ["x = 5 − 2y", `5y${s2} − 20y + 15 = 0 ⇒ y = 1 or 3`], a: "(3, 1) and (−1, 3)" },
{ t: "nonlin", q: `Solve the simultaneous equations x − y = 2 and x${s2} + y${s2} = 10.`,
  s: ["x = y + 2", `2y${s2} + 4y − 6 = 0 ⇒ y = 1 or −3`], a: "(3, 1) and (−1, −3)" },
{ t: "nonlin", q: `Solve the simultaneous equations 2x + y = 5 and x${s2} + y${s2} = 10.`,
  s: ["y = 5 − 2x", `5x${s2} − 20x + 15 = 0 ⇒ x = 1 or 3`], a: "(1, 3) and (3, −1)" },

/* Creating equations from graphs */
{ t: "graphs", q: `The graph of a quadratic function is shown. Find its equation in the form y = x${s2} + bx + c.`, g: "q1",
  s: ["y = k(x + 2)(x − 4)", "(0, −8): −8k = −8 ⇒ k = 1"], a: `y = x${s2} − 2x − 8` },
{ t: "graphs", q: `The cubic shown crosses the x-axis at −1 and touches it at 2. Find its equation.`, g: "c1",
  s: ["Touching ⇒ repeated root: y = k(x + 1)(x − 2)²", "(0, 4): 4k = 4 ⇒ k = 1"], a: `y = x${s3} − 3x${s2} + 4` },
{ t: "graphs", q: `Find the equation of the cubic shown, in the form y = x${s3} + px${s2} + qx + r.`, g: "c2",
  s: ["y = k(x + 1)(x − 2)(x − 4)", "(0, 8): 8k = 8 ⇒ k = 1"], a: `y = x${s3} − 5x${s2} + 2x + 8` },
{ t: "graphs", q: `A parabola has a maximum point at (−1, 8) and crosses the x-axis at x = 1. Find its equation and the other root.`,
  s: ["y = a(x + 1)² + 8", "(1, 0): 4a + 8 = 0 ⇒ a = −2"], a: `y = −2x${s2} − 4x + 6; other root x = −3` },
{ t: "graphs", q: `Find the equation of the quadratic shown.`, g: "q2",
  s: ["y = k(x + 1)(x − 3)", "(0, −6): −3k = −6 ⇒ k = 2"], a: `y = 2x${s2} − 4x − 6` },

/* Discriminant */
{ t: "disc", q: `Find k if x${s2} − 6x + k = 0 has equal roots.`, s: ["b² − 4ac = 0: 36 − 4k = 0"], a: "k = 9" },
{ t: "disc", q: `Find the range of values of k for which 2x${s2} + kx + 8 = 0 has no real roots.`,
  s: ["k² − 64 < 0", "(k − 8)(k + 8) < 0"], a: "−8 < k < 8" },
{ t: "disc", q: `Prove that x${s2} + (k − 2)x − k = 0 has real and distinct roots for all real k.`,
  s: ["Δ = (k − 2)² + 4k = k² + 4", "k² ≥ 0 ⇒ Δ ≥ 4 > 0"], a: "Δ > 0 for all k" },
{ t: "disc", q: `Find the values of k for which x${s2} + (k − 3)x + k = 0 has equal roots.`,
  s: ["(k − 3)² − 4k = 0 ⇒ k² − 10k + 9 = 0", "(k − 1)(k − 9) = 0"], a: "k = 1 or k = 9" },
{ t: "disc", q: `Show that 2x${s2} − 3x + 5 = 0 has no real roots.`, s: ["Δ = 9 − 40 = −31 < 0"], a: "No real roots" },
{ t: "disc", q: `Find the values of k for which the line y = kx − 1 is a tangent to y = x${s2} + 3.`,
  s: ["x² − kx + 4 = 0 must have equal roots", "k² − 16 = 0"], a: "k = ±4", also: ["nonlin"] },

/* Substitution */
{ t: "subst", q: `Solve x${s4} − 10x${s2} + 9 = 0.`, s: ["u = x²: u² − 10u + 9 = 0 ⇒ u = 1 or 9"], a: "x = ±1, ±3" },
{ t: "subst", q: `Solve 2<sup>2x+1</sup> − 9(2<sup>x</sup>) + 4 = 0.`,
  s: ["2^(2x+1) = 2(2^x)²; u = 2^x: 2u² − 9u + 4 = 0", "u = ½ or 4"], a: "x = −1 or x = 2" },
{ t: "subst", q: `Solve (x + ${F("1", "x")})${s2} − 5(x + ${F("1", "x")}) + 6 = 0.`,
  s: ["u = x + 1/x: u = 2 or 3", "x + 1/x = 2 ⇒ x = 1; x + 1/x = 3 ⇒ x² − 3x + 1 = 0"], a: `x = 1, x = ${F(`3 ± ${R("5")}`, "2")}` },
{ t: "subst", q: `Solve 3<sup>2x</sup> − 4(3<sup>x</sup>) + 3 = 0.`, s: ["u = 3^x: (u − 1)(u − 3) = 0"], a: "x = 0 or x = 1" },
{ t: "subst", q: `Solve (x${s2} − 2x)${s2} − 11(x${s2} − 2x) + 24 = 0.`,
  s: ["u = x² − 2x: u = 3 or 8", "x² − 2x = 3 ⇒ x = 3, −1; x² − 2x = 8 ⇒ x = 4, −2"], a: "x = −2, −1, 3, 4" },

/* Radians */
{ t: "rad", q: `Convert 225° to radians and ${F("7π", "12")} radians to degrees.`, s: ["× π/180 and × 180/π"], a: "5π/4 rad; 105°" },
{ t: "rad", q: `A sector of radius 6 cm has a perimeter of 30 cm. Find its angle in radians and its area.`,
  s: ["12 + 6θ = 30 ⇒ θ = 3", "A = ½(36)(3)"], a: "θ = 3 rad; 54 cm²" },
{ t: "rad", q: `A sector of radius r has a perimeter of 20 cm. Show that its area is 10r − r${s2} and find the maximum area.`,
  s: ["θ = (20 − 2r)/r; A = ½r²θ = 10r − r²", "= 25 − (r − 5)²"], a: "25 cm² when r = 5, θ = 2", also: ["cts"] },
{ t: "rad", q: `A sector of radius 10 cm has an arc length of 15 cm. Find the angle in radians and degrees, and the area.`,
  s: ["15 = 10θ ⇒ θ = 1.5", "1.5 × 180/π ≈ 86°; A = ½(100)(1.5)"], a: "1.5 rad ≈ 86°; 75 cm²" },
{ t: "rad", q: `A sector has angle ${F("5π", "6")} and area 15π cm${s2}. Find its radius.`,
  s: ["½r²(5π/6) = 15π ⇒ r² = 36"], a: "r = 6 cm" },

/* Right-angled */
{ t: "right", q: `A ramp is 4.5 m long and rises 0.6 m vertically. Find the angle it makes with the ground to the nearest degree.`,
  s: ["sin θ = 0.6/4.5"], a: "8°" },
{ t: "right", q: `Given tan A = ${F("5", "12")} with A acute, find the exact values of sin A and cos A.`,
  s: ["H = √(25 + 144) = 13"], a: "sin A = 5/13, cos A = 12/13" },
{ t: "right", q: `The angle of elevation of the top of a tower is 30°. From a point 50 m closer it is 60°. Find the exact height.`,
  s: ["d = h/√3 and d + 50 = h√3", "2h = 50√3"], a: `h = 25${R("3")} m` },
{ t: "right", q: `From the top of an 80 m cliff, the angles of depression of two boats in line with its foot are 45° and 30°. Find the exact distance between the boats.`,
  s: ["Near boat: 80/tan 45° = 80", "Far boat: 80/tan 30° = 80√3"], a: `80(${R("3")} − 1) m ≈ 58.6 m` },
{ t: "right", q: `A 6 m ladder makes an angle of 70° with level ground. How high up the wall does it reach?`,
  s: ["h = 6 sin 70°"], a: "5.64 m" },

/* Solving trig equations */
{ t: "solve", q: `Solve cos x = −½ for 0° ≤ x ≤ 360°.`, s: ["Ref angle 60°; cos negative in Q2, Q3"], a: "120°, 240°" },
{ t: "solve", q: `Solve cos(x − 30°) = −${F(R("3"), "2")} for 0° ≤ x ≤ 360°.`,
  s: ["Reference angle 30°; cos is negative in Q2 and Q3", "x − 30° = 150° or 210°", "Add 30° to each"], a: "180°, 240°" },
{ t: "solve", q: `Find the general solution of tan 3x = −1, and list the solutions in 0 ≤ x ≤ π.`,
  s: ["3x = 3π/4 + nπ ⇒ x = π/4 + nπ/3"], a: "π/4, 7π/12, 11π/12" },
{ t: "solve", q: `Solve sin 2x = −${F(R("3"), "2")} for 0° ≤ x ≤ 360°.`,
  s: ["Ref 60°; Q3, Q4: 2x = 240°, 300°, 600°, 660°", "÷ 2"], a: "120°, 150°, 300°, 330°" },
{ t: "solve", q: `Solve 2 sin${s2}x − sin x − 1 = 0 for 0° ≤ x ≤ 360°.`,
  s: ["(2 sin x + 1)(sin x − 1) = 0", "sin x = 1 or −½"], a: "90°, 210°, 330°", also: ["subst"] },

/* Trig graphs */
{ t: "tgraph", q: `Write down the period and range of y = 5 cos 4x.`, s: ["Period 2π/4; amplitude 5"], a: "π/2; [−5, 5]" },
{ t: "tgraph", q: `Sketch f(x) = 3 sin(x/2) for 0 ≤ x ≤ 4π and state how many solutions f(x) = 2 has.`,
  s: ["Period 4π, amplitude 3", "y = 2 cuts the single positive hump twice"], a: "2 solutions" },
{ t: "tgraph", q: `The graph shows y = a + b cos(cx). Find a, b and c.`, g: "t1",
  s: ["Max 3, min −1: a = 1, b = 2", "Period 2π/3 ⇒ c = 3"], a: "y = 1 + 2 cos 3x" },
{ t: "tgraph", q: `The graph shows y = a + b sin(cx). Find a, b and c.`, g: "t2",
  s: ["Max 4, min −2: a = 1, b = 3", "Period π ⇒ c = 2"], a: "y = 1 + 3 sin 2x" },
{ t: "tgraph", q: `State the amplitude, period and range of y = 3 sin 2x.`, s: ["Amplitude 3; period 2π/2"], a: "3; π; [−3, 3]" },

/* Proofs */
{ t: "proof", q: `Prove the sine rule ${F("a", "sin A")} = ${F("b", "sin B")} for an acute-angled triangle.`,
  s: ["Perpendicular h from C: h = b sin A and h = a sin B", "b sin A = a sin B"], a: "Proved" },
{ t: "proof", q: `Prove the cosine rule a${s2} = b${s2} + c${s2} − 2bc cos A.`,
  s: ["Perpendicular CD to AB: |AD| = b cos A and |CD| = b sin A", "Pythagoras in the triangle BCD: a² = |CD|² + (c − |AD|)²", "Expand, then use b² = |CD|² + |AD|² (Pythagoras in the triangle ACD)", "a² = b² + c² − 2bc cos A"], a: "Proved" },
{ t: "proof", q: `Use the cosine rule to prove that a = b cos C + c cos B in any triangle.`,
  s: ["cos C = (a² + b² − c²)/2ab; cos B = (a² + c² − b²)/2ac", "b cos C + c cos B = 2a²/2a"], a: "Proved" },
{ t: "proof", q: `Prove that the area of triangle ABC is ½ab sin C.`,
  s: ["Draw the perpendicular h from A to BC (or BC extended)", "In the right-angled triangle on side b: h = b sin C", "Area = ½ × base × height = ½ × a × h"], a: "Proved" },

/* Rules */
{ t: "rules", q: `A triangle has sides 7 cm, 8 cm and 13 cm. Find the largest angle and the exact area.`,
  s: ["cos θ = (49 + 64 − 169)/112 = −½", "Area = ½(7)(8) sin 120°"], a: `120°; 14${R("3")} cm²` },
{ t: "rules", q: `In triangle ABC, |AB| = 10 cm, |BC| = 7 cm and ∠BAC = 40°. Find the two possible values of ∠ACB.`,
  s: ["sin C = 10 sin 40°/7 = 0.918…", "C or 180° − C"], a: "66.7° or 113.3°" },
{ t: "rules", q: `In quadrilateral ABCD, |AB| = 5, |BC| = 8, |CD| = 6, ∠ABC = 60° and ∠ACD = 50°. Find |AC| and the area of ABCD.`,
  s: ["|AC|² = 25 + 64 − 80 cos 60° = 49", "Areas: 10√3 + ½(7)(6) sin 50°"], a: "|AC| = 7; area ≈ 33.41" },
{ t: "rules", q: `In triangle ABC, |AB| = 8 cm, |BC| = 6 cm and ∠ABC = 120°. Find |AC| and the area in surd form.`,
  s: ["|AC|² = 64 + 36 − 96 cos 120° = 148", "Area = ½(8)(6) sin 120°"], a: `|AC| ≈ 12.17 cm; 12${R("3")} cm²` },
{ t: "rules", q: `A triangle has sides 5 cm, 7 cm and 8 cm. Find the angle opposite the 7 cm side and the area.`,
  s: ["cos θ = (25 + 64 − 49)/80 = ½", "Area = ½(5)(8) sin 60°"], a: `60°; 10${R("3")} cm²` },
{ t: "rules", q: `In triangle PQR, |PQ| = 8 cm, |QR| = 11 cm and ∠PQR = 52°. Find |PR| and the area.`,
  s: ["|PR|² = 64 + 121 − 176 cos 52°", "Area = ½(8)(11) sin 52°"], a: "|PR| ≈ 8.8 cm; 35 cm²" },

/* 3D */
{ t: "threeD", q: `A vertical pole 15 m high stands on level ground. Point A is 20 m from its foot. Find the distance from A to the top and the angle of elevation.`,
  s: ["√(15² + 20²) = 25", "tan θ = 15/20"], a: "25 m; 36.9°", also: ["right"] },
{ t: "threeD", q: `A right pyramid has a square base of side 8 cm and sloping edges of 9 cm. Find its height and the angle a sloping edge makes with the base.`,
  s: ["Half-diagonal = 4√2", "h² = 81 − 32 = 49", "tan θ = 7/(4√2)"], a: "7 cm; 51.1°" },
{ t: "threeD", q: `A mast stands on level ground. A is due south and B is due east of its foot, with |AB| = 100 m. The angles of elevation of the top from A and B are 40° and 30°. Find the height.`,
  s: ["|QA| = h/tan 40°, |QB| = h√3", "|QA|² + |QB|² = 100²"], a: "≈ 47.6 m" },
{ t: "threeD", q: `A cuboid measures 12 cm by 5 cm by 4 cm. Find the length of a space diagonal and the angle it makes with the base.`,
  s: ["Base diagonal = 13", "Space diagonal = √(169 + 16)", "tan θ = 4/13"], a: "≈ 13.6 cm; 17.1°" },
{ t: "threeD", q: `A vertical mast PQ stands on level ground. |QA| = 40 m, ∠AQB = 90°, and the angles of elevation of P from A and B are 32° and 25°. Find |PQ| and |AB|.`,
  s: ["|PQ| = 40 tan 32°", "|QB| = |PQ|/tan 25°", "|AB| = √(40² + |QB|²)"], a: "|PQ| ≈ 25.0 m; |AB| ≈ 67 m" },

/* ===== Sequences & Series ===== */
/* Writing the general term */
{ t: "genterm", q: `Find the general term ${TT("n")} of the sequence 3, 7, 11, …`,
  s: ["Common difference d = 7 − 3 = 4, so the sequence is arithmetic", `${TT("n")} = a + (n − 1)d = 3 + 4(n − 1)`], a: `${TT("n")} = 4n − 1` },
{ t: "genterm", q: `Find the general term of the sequence 100, −50, 25, …`,
  s: ["Common ratio r = −50 ÷ 100 = −½ and 25 ÷ (−50) = −½, so it is geometric", `${TT("n")} = ar<sup>n−1</sup> with a = 100`], a: `${TT("n")} = 100(−${F("1", "2")})<sup>n−1</sup>` },
{ t: "genterm", q: `Find the general term of the sequence 560, 224, 89.6, …`,
  s: ["224 ÷ 560 = 0.4 and 89.6 ÷ 224 = 0.4, so r = 0.4 (geometric)", `${TT("n")} = ar<sup>n−1</sup> with a = 560`], a: `${TT("n")} = 560(0.4)<sup>n−1</sup>` },
{ t: "genterm", q: `Find the general term of the sequence 5, 1, −3, −7, …`,
  s: ["Each term is 4 less than the one before: d = −4 (arithmetic)", `${TT("n")} = 5 + (n − 1)(−4) = 5 − 4n + 4`], a: `${TT("n")} = 9 − 4n` },
{ t: "genterm", q: `Find the general term of the sequence 12, 18, 27, …`,
  s: ["18 ÷ 12 = 1.5 and 27 ÷ 18 = 1.5, so r = 1.5 (geometric)", `${TT("n")} = 12(1.5)<sup>n−1</sup>`], a: `${TT("n")} = 12(${F("3", "2")})<sup>n−1</sup>` },

/* How many terms */
{ t: "nterms", q: `How many terms are in the sequence 710 190, 236 730, 78 910, …, ${F("78 910", "2187")}?`,
  s: ["236 730 ÷ 710 190 = ⅓ and 78 910 ÷ 236 730 = ⅓, so it is geometric", `${TT("n")} = 710 190(⅓)<sup>n−1</sup> = ${F("78 910", "2187")}`, "(⅓)<sup>n−1</sup> = 1 ÷ 19 683 = (⅓)<sup>9</sup>, so n − 1 = 9"], a: "n = 10" },
{ t: "nterms", q: `How many terms are in the sequence −4, 8, 24, …, 2228?`,
  s: ["First differences 12, 16; the second difference 4 is constant, so it is quadratic", `2a = 4, so a = 2 and ${TT("n")} = 2n² + bn + c`, `${TT("1")} = −4 and ${TT("2")} = 8 give b = 6 and c = −12, so ${TT("n")} = 2n² + 6n − 12`, "2n² + 6n − 12 = 2228 ⇒ n² + 3n − 1120 = 0 ⇒ (n − 32)(n + 35) = 0"], a: "n = 32 (reject n = −35)", also: ["quadcub"] },
{ t: "nterms", q: `How many terms are in the sequence −7, −${F("31", "4")}, −${F("17", "2")}, …, −19?`,
  s: ["d = −31/4 − (−7) = −¾ each time, so it is arithmetic", `${TT("n")} = −7 + (n − 1)(−¾)`, "−7 − ¾(n − 1) = −19 ⇒ n − 1 = 16"], a: "n = 17" },
{ t: "nterms", q: `How many terms are in the sequence 2178, 726, 242, …, ${F("242", "59 049")}?`,
  s: ["726 ÷ 2178 = ⅓ and 242 ÷ 726 = ⅓, so it is geometric", `2178(⅓)<sup>n−1</sup> = ${F("242", "59 049")}`, "(⅓)<sup>n−1</sup> = 1 ÷ 531 441 = (⅓)<sup>12</sup>, so n − 1 = 12"], a: "n = 13" },
{ t: "nterms", q: `How many terms are in the sequence 560, 224, 89.6, …, 0.3670016?`,
  s: ["r = 224 ÷ 560 = 0.4, so it is geometric", `560(0.4)<sup>n−1</sup> = 0.3670016`, "(0.4)<sup>n−1</sup> = 0.00065536 = (0.4)<sup>8</sup>"], a: "n = 9" },

/* General term from given terms */
{ t: "tnvals", q: `In a geometric sequence ${TT("4")} = −${F("27", "32")} and ${TT("7")} = −${F("729", "2048")}. Find the general term and write down the first four terms.`,
  s: [`${TT("4")} = ar³ = −27/32 and ${TT("7")} = ar⁶ = −729/2048`, "Divide: r³ = 729/2048 ÷ 27/32 = 27/64, so r = ¾", "a(27/64) = −27/32 ⇒ a = −2"], a: `${TT("n")} = −2(${F("3", "4")})<sup>n−1</sup>; −2, −${F("3", "2")}, −${F("9", "8")}, −${F("27", "32")}` },
{ t: "tnvals", q: `In an arithmetic sequence ${TT("3")} = 52 and ${TT("10")} = 213. Find the general term and write down the first four terms.`,
  s: ["a + 2d = 52 and a + 9d = 213", "Subtract: 7d = 161, so d = 23", "a = 52 − 46 = 6"], a: `${TT("n")} = 23n − 17; 6, 29, 52, 75` },
{ t: "tnvals", q: `In a geometric sequence ${TT("6")} = 32 and ${TT("9")} = 4. Find the general term and write down the first four terms.`,
  s: ["ar⁵ = 32 and ar⁸ = 4", "Divide: r³ = 4/32 = 1/8, so r = ½", "a(½)⁵ = 32 ⇒ a = 1024"], a: `${TT("n")} = 1024(½)<sup>n−1</sup>; 1024, 512, 256, 128` },
{ t: "tnvals", q: `A geometric sequence has ${TT("3")} = 32 and ${TT("6")} = ${F("32", "125")}. Find the general term.`,
  s: ["ar² = 32 and ar⁵ = 32/125", "Divide: r³ = 1/125, so r = ⅕", "a(1/25) = 32 ⇒ a = 800"], a: `${TT("n")} = 800(${F("1", "5")})<sup>n−1</sup>` },
{ t: "tnvals", q: `A geometric sequence with a positive common ratio has ${TT("5")} = 256 and ${TT("9")} = ${F("256", "81")}. Find the general term.`,
  s: ["ar⁴ = 256 and ar⁸ = 256/81", "Divide: r⁴ = 1/81, and r > 0 gives r = ⅓", "a(1/81) = 256 ⇒ a = 20 736"], a: `${TT("n")} = 20 736(${F("1", "3")})<sup>n−1</sup>` },
{ t: "tnvals", q: `In an arithmetic sequence ${TT("4")} = 11 and ${TT("9")} = 31. Find the general term.`,
  s: ["a + 3d = 11 and a + 8d = 31", "Subtract: 5d = 20, so d = 4", "a = 11 − 12 = −1"], a: `${TT("n")} = 4n − 5` },

/* Consecutive terms */
{ t: "consec", q: `The expressions 2x − 10, 4x + 3, 10x − 8 are the first three terms of an arithmetic sequence. Find x and the general term.`,
  s: [`${TT("2")} − ${TT("1")} = ${TT("3")} − ${TT("2")}`, "(4x + 3) − (2x − 10) = (10x − 8) − (4x + 3)", "2x + 13 = 6x − 11 ⇒ x = 6", "The terms are 2, 27, 52, so a = 2 and d = 25"], a: `x = 6; ${TT("n")} = 25n − 23` },
{ t: "consec", q: `The expressions x + 2, x, x − 1 are the first three terms of a geometric sequence. Find x and the general term.`,
  s: [`${TT("2")} ÷ ${TT("1")} = ${TT("3")} ÷ ${TT("2")}`, "x/(x + 2) = (x − 1)/x ⇒ x² = x² + x − 2", "x = 2, so the terms are 4, 2, 1 and r = ½"], a: `x = 2; ${TT("n")} = 4(½)<sup>n−1</sup>` },
{ t: "consec", q: `The expressions 4x + 36, 2x − 8, x − 22 are the first three terms of an arithmetic sequence. Find x and the general term.`,
  s: ["(2x − 8) − (4x + 36) = (x − 22) − (2x − 8)", "−2x − 44 = −x − 14 ⇒ x = −30", "The terms are −84, −68, −52, so a = −84 and d = 16"], a: `x = −30; ${TT("n")} = 16n − 100` },
{ t: "consec", q: `The expressions x + 1, 3x − 1, 6x are three consecutive terms of an arithmetic sequence. Find x and the general term.`,
  s: ["(3x − 1) − (x + 1) = 6x − (3x − 1)", "2x − 2 = 3x + 1 ⇒ x = −3", "The terms are −2, −10, −18, so a = −2 and d = −8"], a: `x = −3; ${TT("n")} = −8n + 6` },
{ t: "consec", q: `The expressions x + 4, 4x, 6x + 8 are consecutive terms of a geometric sequence. Find the possible values of x.`,
  s: [`${TT("2")} ÷ ${TT("1")} = ${TT("3")} ÷ ${TT("2")}, so (4x)² = (x + 4)(6x + 8)`, "16x² = 6x² + 32x + 32 ⇒ 5x² − 16x − 16 = 0", "(5x + 4)(x − 4) = 0"], a: `x = 4 (terms 8, 16, 32) or x = −${F("4", "5")} (terms 3.2, −3.2, 3.2)` },

/* Proving arithmetic or geometric */
{ t: "prove", q: `Prove that the sequence ${TT("n")} = ${F("3n − 4", "5")} is linear (arithmetic), and say whether it is increasing or decreasing.`,
  s: [`${TT("n+1")} = (3(n + 1) − 4)/5 = (3n − 1)/5`, `${TT("n+1")} − ${TT("n")} = (3n − 1)/5 − (3n − 4)/5 = 3/5, a constant`, "d = ⅗ is positive"], a: "Arithmetic with d = ⅗, so it is increasing" },
{ t: "prove", q: `Prove that the sequence ${TT("n")} = 0.02(3<sup>4n</sup>) is geometric, and say whether it is increasing or decreasing.`,
  s: [`${TT("n+1")} = 0.02(3<sup>4n+4</sup>)`, `${TT("n+1")} ÷ ${TT("n")} = 3<sup>4n+4</sup> ÷ 3<sup>4n</sup> = 3⁴ = 81, a constant`, "r = 81 > 1 and the terms are positive"], a: "Geometric with r = 81, so it is increasing" },
{ t: "prove", q: `Prove that the sequence ${TT("n")} = ${F("7 − 8n", "6")} is arithmetic, and say whether it is increasing or decreasing.`,
  s: [`${TT("n+1")} = (7 − 8(n + 1))/6 = (−8n − 1)/6`, `${TT("n+1")} − ${TT("n")} = (−8n − 1)/6 − (7 − 8n)/6 = −8/6 = −4/3`, "The difference is constant and negative"], a: `Arithmetic with d = −${F("4", "3")}, so it is decreasing` },
{ t: "prove", q: `Prove that the sequence with general term ${TT("n")} = 4n − 1 is arithmetic.`,
  s: [`${TT("n+1")} = 4(n + 1) − 1 = 4n + 3`, `${TT("n+1")} − ${TT("n")} = (4n + 3) − (4n − 1) = 4`], a: "The common difference is 4, so it is arithmetic" },
{ t: "prove", q: `The general term of the sequence 560, 224, 89.6, … is ${TT("n")} = 560(0.4)<sup>n−1</sup>. Prove that the sequence is geometric.`,
  s: [`${TT("n+1")} = 560(0.4)<sup>n</sup>`, `${TT("n+1")} ÷ ${TT("n")} = 560(0.4)<sup>n</sup> ÷ 560(0.4)<sup>n−1</sup> = 0.4`], a: "The common ratio is 0.4, so it is geometric (and decreasing)" },

/* Product and sum of three terms */
{ t: "prodsum", q: `The product of the first three terms of a geometric sequence is 13 824 and their sum is 172. Given that the common ratio is greater than 1, find the general term and the first three terms.`,
  s: ["Let the terms be a/r, a, ar. Product: a³ = 13 824, so a = 24", "Sum: 24/r + 24 + 24r = 172 ⇒ 6r² − 37r + 6 = 0", "(6r − 1)(r − 6) = 0 ⇒ r = 6 (since r > 1)", "The first term is 24/6 = 4"], a: `${TT("n")} = 4(6)<sup>n−1</sup>; 4, 24, 144` },
{ t: "prodsum", q: `The sum of three consecutive terms of a geometric sequence is 42 and their product is 1728. Find the general term.`,
  s: ["Let the terms be a/r, a, ar. Product: a³ = 1728, so a = 12", "Sum: 12/r + 12 + 12r = 42 ⇒ 2r² − 5r + 2 = 0", "(2r − 1)(r − 2) = 0 ⇒ r = ½ or r = 2"], a: `${TT("n")} = 12(2)<sup>n−1</sup> or ${TT("n")} = 12(½)<sup>n−1</sup> (the same three terms in reverse order)` },
{ t: "prodsum", q: `The product of the first three terms of a geometric sequence is 3375 and their sum is 93. Given that r > 1, find the sum of the first four terms.`,
  s: ["Let the terms be a/r, a, ar. Product: a³ = 3375, so a = 15", "Sum: 15/r + 15 + 15r = 93 ⇒ 5r² − 26r + 5 = 0 ⇒ (5r − 1)(r − 5) = 0", "r = 5, so the first term is 3 and the terms are 3, 15, 75, 375", `${"S<sub>4</sub>"} = 3(5⁴ − 1)/(5 − 1)`], a: "468", also: ["finite"] },
{ t: "prodsum", q: `The sum of three consecutive terms of an arithmetic sequence is 27 and their product is 693. Given that the common difference is positive, find the three terms.`,
  s: ["Let the terms be a − d, a, a + d. Sum: 3a = 27, so a = 9", "Product: 9(81 − d²) = 693 ⇒ 81 − d² = 77 ⇒ d² = 4", "d = 2 (positive)"], a: "7, 9, 11" },
{ t: "prodsum", q: `The product of three consecutive terms of a geometric sequence is 216 and their sum is 26. Given that r > 1, find the general term.`,
  s: ["Let the terms be a/r, a, ar. Product: a³ = 216, so a = 6", "Sum: 6/r + 6 + 6r = 26 ⇒ 3r² − 10r + 3 = 0 ⇒ (3r − 1)(r − 3) = 0", "r = 3 (since r > 1), so the terms are 2, 6, 18"], a: `${TT("n")} = 2(3)<sup>n−1</sup>` },

/* Sum of a finite series */
{ t: "finite", q: `Find the sum of the series √3 + 3 + 3√3 + … + 729.`,
  s: ["3 ÷ √3 = √3, so it is geometric with a = √3 and r = √3", `${TT("n")} = (√3)<sup>n</sup> = 729 = (√3)<sup>12</sup>, so n = 12`, `${"S<sub>12</sub>"} = √3(1 − (√3)<sup>12</sup>)/(1 − √3) = √3(1 − 729)/(1 − √3)`], a: "≈ 1722.47" },
{ t: "finite", q: `Find the sum of the series −400 + (−397) + … + (−43).`,
  s: ["d = 3, so it is arithmetic with a = −400", `${TT("n")} = −400 + 3(n − 1) = −43 ⇒ n = 120`, `${"S<sub>120</sub>"} = 60(2(−400) + 119(3)) = 60(−443)`], a: "−26 580" },
{ t: "finite", q: `Find the sum of the terms of the sequence 2178, 726, 242, …, ${F("242", "59 049")}, correct to the nearest whole number.`,
  s: ["Geometric with a = 2178 and r = ⅓", "Last term: (⅓)<sup>n−1</sup> = 1/531 441 = (⅓)<sup>12</sup>, so n = 13", `${"S<sub>13</sub>"} = 2178(1 − (⅓)<sup>13</sup>)/(1 − ⅓)`], a: "≈ 3267" },
{ t: "finite", q: `Find the sum of the first 12 terms of the series 3 + 7 + 11 + …`,
  s: ["Arithmetic with a = 3 and d = 4", `${"S<sub>12</sub>"} = (12/2)(2(3) + 11(4)) = 6(50)`], a: "300" },
{ t: "finite", q: `Find the sum of the series 100 − 50 + 25 − … − ${F("25", "512")}.`,
  s: ["Geometric with a = 100 and r = −½", "100(−½)<sup>n−1</sup> = −25/512 ⇒ (−½)<sup>n−1</sup> = −1/2048 = (−½)<sup>11</sup>, so n = 12", `${"S<sub>12</sub>"} = 100(1 − (−½)<sup>12</sup>)/(1 + ½)`], a: `${F("34 125", "512")} ≈ 66.65` },

/* Sum to infinity */
{ t: "sinf", q: `Find the sum of the series 32 + 16 + 8 + 4 + …`,
  s: ["Geometric with a = 32 and r = ½", "|r| < 1, so the series has a sum to infinity", `${"S<sub>∞</sub>"} = a/(1 − r) = 32/(1 − 0.5)`], a: "64" },
{ t: "sinf", q: `Show, using the sum to infinity of a geometric series, that ${SG("n = 1", "∞", "(0.25)<sup>n</sup>")} = ${F("1", "3")}.`,
  s: ["The terms are 0.25 + 0.0625 + 0.015625 + …, so a = 0.25 and r = 0.25", `${"S<sub>∞</sub>"} = a/(1 − r) = 0.25/(1 − 0.25) = 0.25/0.75`], a: `${F("1", "3")}`, also: ["sigma"] },
{ t: "sinf", q: `The first term of a geometric series is 12 and its sum to infinity is 48. Find the common ratio.`,
  s: [`${"S<sub>∞</sub>"} = a/(1 − r)`, "48 = 12/(1 − r) ⇒ 1 − r = ¼"], a: `r = ${F("3", "4")}` },
{ t: "sinf", q: `Find the values of x for which the series 1 + 2x + 4x² + 8x³ + … has a sum to infinity, and find the sum when x = ¼.`,
  s: ["Geometric with a = 1 and r = 2x", "A sum to infinity needs |r| < 1: |2x| < 1", "When x = ¼, r = ½ and S<sub>∞</sub> = 1/(1 − ½)"], a: `−½ < x < ½; sum = 2` },
{ t: "sinf", q: `A ball is dropped from a height of 10 m. Each time it hits the ground it rebounds to ¾ of its previous height. Find the total distance it travels before coming to rest.`,
  s: ["Down 10 m, then up and down for each rebound", "Each rebound height: 7.5, 5.625, … is geometric with a = 7.5 and r = ¾", "Up and down: 2 × S<sub>∞</sub> = 2 × 7.5/(1 − ¾) = 60", "Total = 10 + 60"], a: "70 m" },

/* Recurring decimals */
{ t: "recdec", q: `Write 0.9̇ as an infinite geometric series and hence write it as a fraction.`,
  s: ["0.9̇ = 0.9 + 0.09 + 0.009 + …", "a = 0.9 and r = 0.1", `${"S<sub>∞</sub>"} = 0.9/(1 − 0.1) = 0.9/0.9`], a: "0.9̇ = 1" },
{ t: "recdec", q: `Write 1.23̇ as the sum of an infinite geometric series and hence write it as a fraction.`,
  s: ["1.23̇ = 1.2 + 0.03̇, and 0.03̇ = 0.03 + 0.003 + 0.0003 + …", "a = 0.03 and r = 0.1, so S<sub>∞</sub> = 0.03/0.9 = 1/30", "1.2 + 1/30 = 36/30 + 1/30"], a: `${F("37", "30")}` },
{ t: "recdec", q: `Write 0.5̇26̇ as the sum of an infinite geometric series and hence write it as a fraction.`,
  s: ["0.5̇26̇ = 0.526 + 0.000526 + 0.000000526 + …", "a = 0.526 and r = 0.001", `${"S<sub>∞</sub>"} = 0.526/(1 − 0.001) = 0.526/0.999`], a: `${F("526", "999")}` },
{ t: "recdec", q: `Write 0.2̇3̇ as the sum of an infinite geometric series and hence write it as a fraction.`,
  s: ["0.2̇3̇ = 0.23 + 0.0023 + 0.000023 + …", "a = 0.23 and r = 0.01", `${"S<sub>∞</sub>"} = 0.23/(1 − 0.01) = 0.23/0.99`], a: `${F("23", "99")}` },

/* Sigma notation */
{ t: "sigma", q: `Evaluate ${SG("r = 1", "5", "(2r − 4)")}.`,
  s: ["Substitute r = 1, 2, 3, 4, 5 into 2r − 4", "−2, 0, 2, 4, 6", "−2 + 0 + 2 + 4 + 6"], a: "10" },
{ t: "sigma", q: `Evaluate ${SG("r = 0", "6", "r²")}.`,
  s: ["Substitute r = 0, 1, 2, 3, 4, 5, 6 into r²", "0 + 1 + 4 + 9 + 16 + 25 + 36"], a: "91" },
{ t: "sigma", q: `Evaluate ${SG("r = 0", "4", "(2r + 4)")}.`,
  s: ["Substitute r = 0, 1, 2, 3, 4 into 2r + 4", "4 + 6 + 8 + 10 + 12"], a: "40" },
{ t: "sigma", q: `Write the series 100 − 50 + 25 − … − ${F("25", "512")} using sigma notation.`,
  s: ["Geometric with a = 100 and r = −½, so the general term is 100(−½)<sup>n−1</sup>", "The last term −25/512 is the 12th term (n = 12)"], a: `${SG("n = 1", "12", "100(−½)<sup>n−1</sup>")}` },
{ t: "sigma", q: `Write 3 + 7 + 11 + … + 39 using sigma notation and find its value.`,
  s: ["Arithmetic with a = 3 and d = 4, so the general term is 4r − 1", "4r − 1 = 39 ⇒ r = 10", "Sum = 10/2 × (3 + 39)"], a: `${SG("r = 1", "10", "(4r − 1)")} = 210` },

/* Tn from Sn */
{ t: "tnsn", q: `The sum of the first n terms of an arithmetic sequence is ${"S<sub>n</sub>"} = 2n² + 5n. Find the general term.`,
  s: [`${TT("n")} = ${"S<sub>n</sub>"} − ${"S<sub>n−1</sub>"}`, `${"S<sub>n−1</sub>"} = 2(n − 1)² + 5(n − 1) = 2n² + n − 3`, "(2n² + 5n) − (2n² + n − 3) = 4n + 3"], a: `${TT("n")} = 4n + 3` },
{ t: "tnsn", q: `Given that ${"S<sub>n</sub>"} = 3n² + 2n is the sum of the first n terms of an arithmetic sequence, find the general term.`,
  s: [`${TT("n")} = ${"S<sub>n</sub>"} − ${"S<sub>n−1</sub>"}`, `${"S<sub>n−1</sub>"} = 3(n − 1)² + 2(n − 1) = 3n² − 4n + 1`, "(3n² + 2n) − (3n² − 4n + 1) = 6n − 1"], a: `${TT("n")} = 6n − 1` },
{ t: "tnsn", q: `${"S<sub>n</sub>"} = 3n² + n gives the sum of the first n terms of an arithmetic sequence. Find ${TT("n")}.`,
  s: [`${TT("1")} = ${"S<sub>1</sub>"} = 4, and ${"S<sub>2</sub>"} = 14, so ${TT("2")} = 14 − 4 = 10`, "a = 4 and d = 6", `${TT("n")} = 4 + 6(n − 1)`], a: `${TT("n")} = 6n − 2` },
{ t: "tnsn", q: `In an arithmetic sequence ${TT("4")} = 30 and ${"S<sub>4</sub>"} = 72. Find ${"S<sub>8</sub>"}.`,
  s: ["a + 3d = 30", `${"S<sub>4</sub>"} = 2(2a + 3d) = 72 ⇒ 2a + 3d = 36`, "Subtract: a = 6, then d = 8", `${"S<sub>8</sub>"} = 4(2(6) + 7(8)) = 4(68)`], a: "272", also: ["tnvals"] },
{ t: "tnsn", q: `The sum of the first n terms of an arithmetic sequence is ${"S<sub>n</sub>"} = 5n² − 2n. Find ${TT("10")}.`,
  s: [`${TT("n")} = ${"S<sub>n</sub>"} − ${"S<sub>n−1</sub>"} = (5n² − 2n) − (5n² − 12n + 7) = 10n − 7`, `${TT("10")} = 10(10) − 7`], a: "93" },

/* Quadratic and cubic sequences */
{ t: "quadcub", q: `A quadratic sequence has ${TT("2")} = 4, ${TT("4")} = 4 and ${TT("6")} = 12. Find the general term and the first four terms.`,
  s: [`${TT("n")} = an² + bn + c, so 4a + 2b + c = 4, 16a + 4b + c = 4 and 36a + 6b + c = 12`, "Subtract: 12a + 2b = 0 and 20a + 2b = 8", "8a = 8 ⇒ a = 1, then b = −6 and c = 12"], a: `${TT("n")} = n² − 6n + 12; 7, 4, 3, 4` },
{ t: "quadcub", q: `Write the sequence 9, 29, 81, 177, 329 in the form ${TT("n")} = an³ + bn² + cn + d.`,
  s: ["Differences: 20, 52, 96, 152, then 32, 44, 56, then 12, 12", "Third difference = 6a = 12 ⇒ a = 2", `${TT("1")}, ${TT("2")}, ${TT("3")} give b + c + d = 7, 4b + 2c + d = 13 and 9b + 3c + d = 27`, "Solving: b = 4, c = −6, d = 9"], a: `${TT("n")} = 2n³ + 4n² − 6n + 9` },
{ t: "quadcub", q: `Write the sequence −12, −14, −12, 0, 28 in the form ${TT("n")} = an³ + bn² + cn + d.`,
  s: ["Differences: −2, 2, 12, 28, then 4, 10, 16, then 6, 6", "Third difference = 6a = 6 ⇒ a = 1", `Using ${TT("1")}, ${TT("2")} and ${TT("3")} gives b + c + d = −13, 4b + 2c + d = −22 and 9b + 3c + d = −39`, "Solving: b = −4, c = 3, d = −12"], a: `${TT("n")} = n³ − 4n² + 3n − 12` },
{ t: "quadcub", q: `The pattern 4, 13, 38, 85, 160 can be modelled by ${TT("n")} = an³ + 2n² + bn + 5. Find a and b.`,
  s: ["Differences: 9, 25, 47, 75, then 16, 22, 28, then 6, 6", "Third difference = 6a = 6 ⇒ a = 1", `${TT("1")} = 1 + 2 + b + 5 = 4`], a: "a = 1, b = −4" },
{ t: "quadcub", q: `Find the general term of the quadratic sequence 5, 12, 23, 38, …`,
  s: ["First differences 7, 11, 15; second difference 4 (constant)", `2a = 4 ⇒ a = 2, so ${TT("n")} = 2n² + bn + c`, `${TT("1")} = 5 ⇒ b + c = 3 and ${TT("2")} = 12 ⇒ 2b + c = 4, so b = 1 and c = 2`], a: `${TT("n")} = 2n² + n + 2` },

/* Recurrence relations */
{ t: "recur", q: `The Fibonacci sequence is given by ${TT("n")} = ${TT("n−1")} + ${TT("n−2")} with first terms 0, 1, 1. Write out the next six terms.`,
  s: ["Each term is the sum of the two before it", "1 + 1 = 2, 1 + 2 = 3, 2 + 3 = 5, 3 + 5 = 8, 5 + 8 = 13, 8 + 13 = 21"], a: "2, 3, 5, 8, 13, 21" },
{ t: "recur", q: `Write a recurrence relation for the sequence in which two times the current term, minus the previous term, gives the next term.`,
  s: [`Next term = 2 × (current term) − (previous term)`], a: `${TT("n+1")} = 2${TT("n")} − ${TT("n−1")}  (or ${TT("n")} = 2${TT("n−1")} − ${TT("n−2")})` },
{ t: "recur", q: `Describe in words the recurrence relation ${TT("n")} = 2${TT("n−2")} + 3${TT("n−1")}.`,
  s: [`${TT("n−1")} is the previous term and ${TT("n−2")} is the term before that`], a: "Each term is three times the previous term plus twice the term before that" },
{ t: "recur", q: `A sequence is defined by ${"G<sub>n</sub>"} = 3${"G<sub>n−1</sub>"} + (${"G<sub>n−2</sub>"})² with ${"G<sub>1</sub>"} = 1 and ${"G<sub>2</sub>"} = 1. Write down the first five terms.`,
  s: ["G<sub>3</sub> = 3(1) + 1² = 4", "G<sub>4</sub> = 3(4) + 1² = 13", "G<sub>5</sub> = 3(13) + 4² = 55"], a: "1, 1, 4, 13, 55" },
{ t: "recur", q: `A sequence is defined by ${TT("1")} = 2 and ${TT("n+1")} = 3${TT("n")} − 1. Write down the first four terms.`,
  s: [`${TT("2")} = 3(2) − 1 = 5`, `${TT("3")} = 3(5) − 1 = 14`, `${TT("4")} = 3(14) − 1 = 41`], a: "2, 5, 14, 41" },
/* ===== Complex Numbers ===== */

/* Transformations */
{ t: "cxtrans", q: `Plot z = 1 − 2i and w = 3i on an Argand diagram. Work out 3z, z + w and z × w, and state the type of transformation each one represents.`,
  s: ["3z = 3(1 − 2i) = 3 − 6i: every part is scaled by 3, so the modulus is multiplied by 3", "z + w = 1 − 2i + 3i = 1 + i: three units are added to the imaginary part", "z × w = 3i(1 − 2i) = 3i − 6i² = 6 + 3i: multiplying by 3i scales by 3 and rotates 90° anticlockwise"],
  a: "3z = 3 − 6i (scaling by 3); z + w = 1 + i (translation up 3); zw = 6 + 3i (scaling by 3 and a 90° anticlockwise rotation)" },
{ t: "cxtrans", q: `Given |m| = 4 and arg(m) = 120°, find the value of i⁴⁵ × m in the form a + bi. Explain what has happened geometrically to m.`,
  s: ["i⁴⁵ = (i⁴)¹¹ × i = i", "m = 4(cos 120° + i sin 120°) = −2 + 2√3 i", "i × m = −2√3 − 2i. Multiplying by i is a 90° anticlockwise rotation about the origin; the modulus stays 4 and the argument becomes 210°"],
  a: `i⁴⁵m = −2${SQ(3)} − 2i: m is rotated 90° anticlockwise about the origin` },
{ t: "cxtrans", q: `Write 4i³ + 7i⁹ in the form bi, where b ∈ ℤ.`,
  s: ["i³ = −i (three quarter-turns anticlockwise)", "i⁹ = (i⁴)² × i = i", "4(−i) + 7(i) = −4i + 7i"],
  a: "3i" },
{ t: "cxtrans", q: `The complex number u = a + bi lies in the second quadrant. Write iu and the conjugate of iu in terms of a and b, and state a transformation (not a translation) that sends u to the conjugate of iu.`,
  s: ["iu = i(a + bi) = ai + bi² = −b + ai", `conjugate of iu = −b − ai`, "u to iu is a 90° anticlockwise rotation about the origin; changing the sign of the imaginary part is then a reflection in the real axis"],
  a: `iu = −b + ai and ${CJ("iu")} = −b − ai. Rotate u by 90° anticlockwise, then reflect in the real axis (equivalently, reflect u in the line y = −x)` },
{ t: "cxtrans", q: `Describe fully what happens to z = 4 + 2i when it is multiplied by 1 + i.`,
  s: ["z(1 + i) = (4 + 2i)(1 + i) = 4 + 4i + 2i + 2i² = 2 + 6i", `1 + i has modulus ${SQ(2)} and argument 45°`, "So z is scaled by √2 and rotated 45° anticlockwise"],
  a: `z(1 + i) = 2 + 6i: scaled by ${SQ(2)} and rotated 45° anticlockwise about the origin` },
{ t: "cxtrans", q: `A point z = 2 + 5i is moved to 5 + 3i by adding a complex number. Find that number and describe the translation.`,
  s: ["Added number = (5 + 3i) − (2 + 5i)", "= 3 − 2i"],
  a: "3 − 2i: a translation of 3 units to the right and 2 units down" },

/* Division */
{ t: "cxdiv", q: `Write ${F("2i(3 + 4i)", "2 + 3i")} in the form a + bi, where a, b ∈ ℝ.`,
  s: ["Top: 2i(3 + 4i) = 6i + 8i² = −8 + 6i", "Multiply top and bottom by the conjugate 2 − 3i", `(−8 + 6i)(2 − 3i) = −16 + 24i + 12i − 18i² = 2 + 36i and (2 + 3i)(2 − 3i) = 13`],
  a: `${F(2, 13)} + ${F(36, 13)}i` },
{ t: "cxdiv", q: `Simplify ${F("(2 − 6i) − (3 + 2i)", "2 + 2i")}.`,
  s: ["Top: (2 − 6i) − (3 + 2i) = −1 − 8i", "Multiply by the conjugate 2 − 2i over 2 − 2i", "(−1 − 8i)(2 − 2i) = −2 + 2i − 16i + 16i² = −18 − 14i and (2 + 2i)(2 − 2i) = 8"],
  a: `−${F(9, 4)} − ${F(7, 4)}i` },
{ t: "cxdiv", q: `${F("4 − 2i", "2 + 4i")} = 0 + ki, where k ∈ ℤ and i² = −1. Find the value of k.`,
  s: ["Multiply top and bottom by the conjugate 2 − 4i", "(4 − 2i)(2 − 4i) = 8 − 16i − 4i + 8i² = −20i and (2 + 4i)(2 − 4i) = 20", "−20i ÷ 20 = −i = 0 + (−1)i"],
  a: "k = −1" },
{ t: "cxdiv", q: `Write ${F("7 + i", "1 + i")} in the form a + bi, where a, b ∈ ℝ.`,
  s: ["Multiply top and bottom by the conjugate 1 − i", "(7 + i)(1 − i) = 7 − 7i + i − i² = 8 − 6i and (1 + i)(1 − i) = 2", "(8 − 6i) ÷ 2"],
  a: "4 − 3i" },
{ t: "cxdiv", q: `Write ${F("5 + 5i", "3 − 4i")} in the form a + bi, where a, b ∈ ℝ.`,
  s: ["Multiply top and bottom by the conjugate 3 + 4i", "(5 + 5i)(3 + 4i) = 15 + 20i + 15i + 20i² = −5 + 35i and (3 − 4i)(3 + 4i) = 25", "Divide each part by 25"],
  a: `−${F(1, 5)} + ${F(7, 5)}i` },

/* Equality */
{ t: "cxeq", q: `Write √(3 + 4i) in the form a ± bi, where a, b ∈ ℝ.`,
  s: ["Let √(3 + 4i) = a + bi and square both sides: 3 + 4i = a² − b² + 2abi", "Equate parts: a² − b² = 3 and 2ab = 4, so b = 2/a", "a² − 4/a² = 3 gives a⁴ − 3a² − 4 = 0, so (a² − 4)(a² + 1) = 0 and a = ±2 (a is real)", "a = 2 gives b = 1; a = −2 gives b = −1"],
  a: "±(2 + i)" },
{ t: "cxeq", q: `Find √(−5 + 12i). Give both answers in the form a + bi, where a, b ∈ ℝ.`,
  s: ["Let (a + bi)² = −5 + 12i, so a² − b² = −5 and 2ab = 12", "b = 6/a gives a⁴ + 5a² − 36 = 0, so (a² + 9)(a² − 4) = 0 and a = ±2", "a = 2 gives b = 3; a = −2 gives b = −3"],
  a: "2 + 3i and −2 − 3i" },
{ t: "cxeq", q: `Find the real numbers x and y such that (x + yi)(2 − i) = 5 + 5i.`,
  s: ["Expand: 2x − xi + 2yi − yi² = (2x + y) + (2y − x)i", "Equate parts: 2x + y = 5 and 2y − x = 5", "Solving gives x = 1 and y = 3"],
  a: "x = 1, y = 3" },
{ t: "cxeq", q: `Find the complex number z such that z + 2${CJ("z")} = 9 − 4i.`,
  s: ["Let z = a + bi, so z̄ = a − bi", "z + 2z̄ = 3a − bi", "3a = 9 and −b = −4"],
  a: "z = 3 + 4i" },
{ t: "cxeq", q: `Find the values of k ∈ ℝ for which (2 + ki)² is purely imaginary.`,
  s: ["(2 + ki)² = 4 + 4ki + k²i² = (4 − k²) + 4ki", "Purely imaginary means the real part is zero: 4 − k² = 0"],
  a: "k = 2 or k = −2" },

/* Modulus and conjugate */
{ t: "cxmod", q: `If |3 + 4i + k + 2i| = 10, find the values of k ∈ ℝ.`,
  s: ["Collect: |(3 + k) + 6i| = 10", "(3 + k)² + 36 = 100, so (3 + k)² = 64", "3 + k = ±8"],
  a: "k = 5 or k = −11" },
{ t: "cxmod", q: `Show that 1/z = ${F(CJ("z"), "|z|²")}, where z is any non-zero complex number.`,
  s: ["Let z = a + bi. Then 1/z = 1/(a + bi) × (a − bi)/(a − bi)", "= (a − bi)/(a² + b²), since (a + bi)(a − bi) = a² + b²", "a − bi = z̄ and a² + b² = |z|²"],
  a: `1/z = ${F(CJ("z"), "|z|²")}` },
{ t: "cxmod", q: `Find |(3 − 4i)(1 + i)|.`,
  s: ["Multiply out: (3 − 4i)(1 + i) = 3 + 3i − 4i − 4i² = 7 − i", "|7 − i| = √(49 + 1)"],
  a: `${SQ(50)} = 5${SQ(2)}` },
{ t: "cxmod", q: `Given z = 2 − 3i, write down the conjugate of z and find z × (conjugate of z).`,
  s: ["The conjugate changes the sign of the imaginary part: 2 + 3i", "(2 − 3i)(2 + 3i) = 4 − 9i² = 4 + 9"],
  a: `${CJ("z")} = 2 + 3i and z${CJ("z")} = 13 (which is |z|²)` },
{ t: "cxmod", q: `Find all complex numbers z = a + bi with |z| = 5 and real part 3.`,
  s: ["a = 3, so |z|² = 9 + b² = 25", "b² = 16"],
  a: "z = 3 + 4i or z = 3 − 4i" },

/* Complex roots of equations */
{ t: "cxroots", q: `Solve x² − 2x + 17 = 0 and give your answers in the form a + bi, where a, b ∈ ℝ.`,
  s: ["x = (2 ± √(4 − 68))/2 = (2 ± √(−64))/2", "√(−64) = 8i", "x = (2 ± 8i)/2"],
  a: "x = 1 + 4i or x = 1 − 4i" },
{ t: "cxroots", q: `Show that −2 + 2i is a root of z³ + 3z² + 4z − 8 = 0 and find the other roots.`,
  s: ["(−2 + 2i)² = −8i and (−2 + 2i)³ = 16 + 16i", "16 + 16i + 3(−8i) + 4(−2 + 2i) − 8 = 0, so it is a root", "The coefficients are real, so −2 − 2i is also a root. These give the factor z² + 4z + 8", "(z² + 4z + 8)(z − 1) = z³ + 3z² + 4z − 8, so the third root is 1"],
  a: "The other roots are −2 − 2i and 1" },
{ t: "cxroots", q: `z = 3 − 5i is a root of f(z) = 3z³ − 14z² + 78z + 136. Find the other two roots and state clearly any theorem you use.`,
  s: ["The coefficients are real, so by the Conjugate Root Theorem 3 + 5i is also a root", "(z − 3 + 5i)(z − 3 − 5i) = z² − 6z + 34", "(z² − 6z + 34)(3z + 4) = 3z³ − 14z² + 78z + 136, so the last root comes from 3z + 4 = 0"],
  a: `3 + 5i (Conjugate Root Theorem) and −${F(4, 3)}` },
{ t: "cxroots", q: `z = 2 + i is a root of f(z) = z² − z − 1 − 3i. Find the other root.`,
  s: ["The coefficients are not all real, so the conjugate is not necessarily a root", "The sum of the roots is 1 (minus the coefficient of z), so the other root is 1 − (2 + i)", "Check with the product: (2 + i)(−1 − i) = −1 − 3i ✓"],
  a: "z = −1 − i" },
{ t: "cxroots", q: `z₁ = 1 + i is a root of z² + (3 − 2i)z + p = 0. Find p, where p = a + bi and a, b ∈ ℤ.`,
  s: ["Substitute z = 1 + i: (1 + i)² + (3 − 2i)(1 + i) + p = 0", "(1 + i)² = 2i and (3 − 2i)(1 + i) = 5 + i", "2i + 5 + i + p = 0"],
  a: "p = −5 − 3i" },
{ t: "cxroots", q: `Show that z = 2 + i is a root of 3z³ − 14z² + 23z − 10 and hence find the other two roots.`,
  s: ["3(2 + i)³ − 14(2 + i)² + 23(2 + i) − 10 = 0, so it is a root", "By the Conjugate Root Theorem 2 − i is also a root, giving the factor z² − 4z + 5", "(z² − 4z + 5)(3z − 2) = 3z³ − 14z² + 23z − 10, so the last root comes from 3z − 2 = 0"],
  a: `2 − i and ${F(2, 3)}` },

/* Converting to polar form */
{ t: "topolar", q: `Write 6 − 2i in polar form, with the angle rounded to the nearest degree.`,
  s: [`|z| = √(36 + 4) = √40 = 2${SQ(10)}`, "tan⁻¹(2/6) ≈ 18.4°, and 6 − 2i is in the fourth quadrant", "θ = 360° − 18° = 342°"],
  a: `2${SQ(10)}(cos 342° + i sin 342°)` },
{ t: "topolar", q: `Write −3 − 3i in polar form, with the angle rounded to the nearest degree.`,
  s: [`|z| = √(9 + 9) = 3${SQ(2)}`, "tan⁻¹(3/3) = 45°, and −3 − 3i is in the third quadrant", "θ = 180° + 45° = 225°"],
  a: `3${SQ(2)}(cos 225° + i sin 225°)` },
{ t: "topolar", q: `Write −2 in polar form.`,
  s: ["|z| = 2", "−2 lies on the negative real axis, so the angle is 180°"],
  a: `2(cos 180° + i sin 180°)` },
{ t: "topolar", q: `Write −5 + 2i in polar form.`,
  s: [`|w| = √(25 + 4) = ${SQ(29)}`, "tan⁻¹(2/5) ≈ 21.8°, and −5 + 2i is in the second quadrant", "θ = 180° − 21.8° = 158.2°"],
  a: `${SQ(29)}(cos 158.2° + i sin 158.2°)` },
{ t: "topolar", q: `Write −√3 + i in polar form.`,
  s: ["|z| = √(3 + 1) = 2", "tan⁻¹(1/√3) = 30°, and the number is in the second quadrant", "θ = 180° − 30° = 150°"],
  a: `2(cos 150° + i sin 150°)` },

/* Converting to rectangular form */
{ t: "torect", q: `Write 4(cos 60° + i sin 60°) in the form a + bi.`,
  s: [`cos 60° = ${F(1, 2)} and sin 60° = ${F(SQ(3), 2)}`, `4 × ${F(1, 2)} = 2 and 4 × ${F(SQ(3), 2)} = 2${SQ(3)}`],
  a: `2 + 2${SQ(3)}i` },
{ t: "torect", q: `Write 6(cos 135° + i sin 135°) in the form a + bi.`,
  s: [`cos 135° = −${F(SQ(2), 2)} and sin 135° = ${F(SQ(2), 2)}`, `6 × ${F(SQ(2), 2)} = 3${SQ(2)}`],
  a: `−3${SQ(2)} + 3${SQ(2)}i` },
{ t: "torect", q: `Write 2(cos 210° + i sin 210°) in the form a + bi.`,
  s: [`210° is in the third quadrant: cos 210° = −${F(SQ(3), 2)} and sin 210° = −${F(1, 2)}`, "Multiply each by 2"],
  a: `−${SQ(3)} − i` },
{ t: "torect", q: `Write 5(cos 270° + i sin 270°) in the form a + bi.`,
  s: ["cos 270° = 0 and sin 270° = −1", "5(0 + i(−1))"],
  a: "−5i" },
{ t: "torect", q: `Write 8(cos(2π/3) + i sin(2π/3)) in the form a + bi.`,
  s: [`cos(2π/3) = −${F(1, 2)} and sin(2π/3) = ${F(SQ(3), 2)}`, `8 × −${F(1, 2)} = −4 and 8 × ${F(SQ(3), 2)} = 4${SQ(3)}`],
  a: `−4 + 4${SQ(3)}i` },

/* Multiplying and dividing in polar form */
{ t: "polarmd", q: `Given |m| = 4 and arg(m) = 120°, and |v| = 2 and arg(v) = 60°, write m and v in polar form and hence write 2m × 3v in polar form.`,
  s: ["m = 4(cos 120° + i sin 120°) and v = 2(cos 60° + i sin 60°)", "2m has modulus 8 and argument 120°; 3v has modulus 6 and argument 60°", "Multiply the moduli: 8 × 6 = 48. Add the arguments: 120° + 60° = 180°"],
  a: `m = 4(cos 120° + i sin 120°), v = 2(cos 60° + i sin 60°); 2m × 3v = 48(cos 180° + i sin 180°)` },
{ t: "polarmd", q: `Given m = 4(cos 120° + i sin 120°) and v = 2(cos 60° + i sin 60°), find ${F("m²", "v²")} × (2 + 3i) in the form a + bi.`,
  s: ["m² = 16(cos 240° + i sin 240°) and v² = 4(cos 120° + i sin 120°)", "m²/v² = 4(cos 120° + i sin 120°) = −2 + 2√3 i", "(−2 + 2√3 i)(2 + 3i) = −4 − 6i + 4√3 i + 6√3 i²"],
  a: `(−4 − 6${SQ(3)}) + (4${SQ(3)} − 6)i` },
{ t: "polarmd", q: `Given z₁ = 3(cos 20° + i sin 20°) and z₂ = 2(cos 40° + i sin 40°), find z₁z₂ in polar form and in the form a + bi.`,
  s: ["Multiply the moduli: 3 × 2 = 6", "Add the arguments: 20° + 40° = 60°", `6(cos 60° + i sin 60°) = 3 + 3${SQ(3)}i`],
  a: `6(cos 60° + i sin 60°) = 3 + 3${SQ(3)}i` },
{ t: "polarmd", q: `Find 12(cos 150° + i sin 150°) ÷ 3(cos 30° + i sin 30°) and write the answer in the form a + bi.`,
  s: ["Divide the moduli: 12 ÷ 3 = 4", "Subtract the arguments: 150° − 30° = 120°", `4(cos 120° + i sin 120°) = 4(−${F(1, 2)} + ${F(SQ(3), 2)}i)`],
  a: `−2 + 2${SQ(3)}i` },
{ t: "polarmd", q: `Write 1 + i and √3 + i in polar form and hence find their product in polar form.`,
  s: [`1 + i = ${SQ(2)}(cos 45° + i sin 45°)`, "√3 + i = 2(cos 30° + i sin 30°)", `Moduli: ${SQ(2)} × 2 = 2${SQ(2)}. Arguments: 45° + 30° = 75°`],
  a: `2${SQ(2)}(cos 75° + i sin 75°)` },

/* De Moivre's theorem: powers */
{ t: "demoivre", q: `Find the value of (3 + 3√3 i)¹⁰ in the form a + bi, where a, b ∈ ℝ.`,
  s: [`|z| = √(9 + 27) = 6 and arg(z) = tan⁻¹(√3) = 60°`, "z¹⁰ = 6¹⁰(cos 600° + i sin 600°)", `600° = 240° (mod 360°): cos 240° = −${F(1, 2)} and sin 240° = −${F(SQ(3), 2)}`, "6¹⁰ = 60 466 176"],

{ t: "divide", q: `Find the quotient and remainder when 3x³ − 4x² + 2x − 7 is divided by x − 2.`,
  s: ["3x² × (x − 2) = 3x³ − 6x², leaving 2x² + 2x − 7", "2x × (x − 2) = 2x² − 4x, leaving 6x − 7", "6 × (x − 2) = 6x − 12, leaving 5"], a: "Quotient 3x² + 2x + 6, remainder 5" },
{ t: "divide", q: `Divide 4x³ − 13x + 6 by 2x − 3 and hence factorise 4x³ − 13x + 6 fully.`,
  s: ["Write the missing term in: 4x³ + 0x² − 13x + 6", "2x² × (2x − 3) = 4x³ − 6x², leaving 6x² − 13x + 6", "3x × (2x − 3) = 6x² − 9x, leaving −4x + 6", "−2 × (2x − 3) = −4x + 6, leaving 0", "2x² + 3x − 2 = (2x − 1)(x + 2)"], a: "Quotient 2x² + 3x − 2, so 4x³ − 13x + 6 = (2x − 3)(2x − 1)(x + 2)", also: ["factor"] },
{ t: "divide", q: `Divide x⁴ − 16 by x − 2.`,
  s: ["Write it as x⁴ + 0x³ + 0x² + 0x − 16", "x³ × (x − 2) = x⁴ − 2x³, leaving 2x³", "2x² × (x − 2) = 2x³ − 4x², leaving 4x²", "4x × (x − 2) = 4x² − 8x, leaving 8x − 16", "8 × (x − 2) = 8x − 16, leaving 0"], a: "x³ + 2x² + 4x + 8 (remainder 0)" },
{ t: "divide", q: `Find the quotient and remainder when 2x³ + x² − 8x + 3 is divided by x − 1.`,
  s: ["2x² × (x − 1) = 2x³ − 2x², leaving 3x² − 8x + 3", "3x × (x − 1) = 3x² − 3x, leaving −5x + 3", "−5 × (x − 1) = −5x + 5, leaving −2"], a: "Quotient 2x² + 3x − 5, remainder −2" },

/* ===== Fill-out: Algebra II ===== */
/* Surd equations */
{ t: "surd", q: `Solve 4 + 2${SQ("x + 3")} = x + 2. Leave your answer in the form a + b${SQ("c")} and check it.`,
  s: ["Isolate the root: 2√(x + 3) = x − 2", "Square both sides: 4(x + 3) = x² − 4x + 4, so x² − 8x − 8 = 0", `x = (8 ± √96)/2 = 4 ± 2${SQ(6)}`, `Check: the right side x − 2 must be positive. 4 + 2√6 works, but 4 − 2√6 ≈ −0.9 makes x − 2 negative, so it is rejected`], a: `x = 4 + 2${SQ(6)} only` },
{ t: "surd", q: `Solve ${SQ("x − 2")} + 2 = ${SQ("3x − 2")}.`,
  s: ["Square both sides: x − 2 + 4√(x − 2) + 4 = 3x − 2", "Isolate the root: 4√(x − 2) = 2x − 4", "Square again: 16(x − 2) = 4x² − 16x + 16, so x² − 8x + 12 = 0", "(x − 2)(x − 6) = 0. Check: x = 2 gives 0 + 2 = 2 ✓ and x = 6 gives 2 + 2 = 4 ✓"], a: "x = 2 or x = 6" },
{ t: "surd", q: `Solve ${SQ("x + 7")} + ${SQ("x")} = 7 and check your solution.`,
  s: ["Isolate one root: √(x + 7) = 7 − √x", "Square: x + 7 = 49 − 14√x + x", "14√x = 42, so √x = 3", "x = 9. Check: √16 + √9 = 4 + 3 = 7 ✓"], a: "x = 9" },
{ t: "surd", q: `Solve ${SQ("x + 5")} + 1 = x.`,
  s: ["Isolate the root: √(x + 5) = x − 1", "Square: x + 5 = x² − 2x + 1, so x² − 3x − 4 = 0", "(x − 4)(x + 1) = 0", "Check: x = 4 gives 3 + 1 = 4 ✓. x = −1 gives 2 + 1 = 3 ≠ −1, so it is rejected"], a: "x = 4" },

/* Completing the square */
{ t: "cts", q: `Write y = 2x² + 5x − 9 in the form y = a(x + b)² + c, where a, b, c ∈ ℝ. Hence find the minimum point of the curve.`,
  s: [`Take out the 2: y = 2(x² + ${F(5, 2)}x − ${F(9, 2)})`, `Half of 5/2 is 5/4, and (x + 5/4)² = x² + 5x/2 + 25/16`, `y = 2[(x + 5/4)² − 25/16 − 9/2] = 2[(x + 5/4)² − 97/16]`], a: `y = 2(x + ${F(5, 4)})² − ${F(97, 8)}; minimum point (−${F(5, 4)}, −${F(97, 8)})` },
{ t: "cts", q: `Write f(x) = −2x² + 2x + 5 in the form f(x) = k(x + q)² + t, where k, q, t ∈ ℝ, and hence write down the turning point.`,
  s: ["Take out −2: f(x) = −2(x² − x − 5/2)", "(x − 1/2)² = x² − x + 1/4, so x² − x − 5/2 = (x − 1/2)² − 11/4", "f(x) = −2[(x − 1/2)² − 11/4] = −2(x − 1/2)² + 11/2"], a: `f(x) = −2(x − ${F(1, 2)})² + ${F(11, 2)}; turning point (${F(1, 2)}, ${F(11, 2)}), a maximum` },
{ t: "cts", q: `Write each of the following in the form (x − p)² + q = 0: (i) x² + 4x − 6 = 0, (ii) x² + 9x + 4 = 0, (iii) x² − 7x − 3 = 0.`,
  s: ["Add and subtract the square of half the x coefficient in each", "(i) (x + 2)² − 4 − 6", "(ii) (x + 9/2)² − 81/4 + 4", "(iii) (x − 7/2)² − 49/4 − 3"], a: `(i) (x + 2)² − 10 = 0; (ii) (x + ${F(9, 2)})² − ${F(65, 4)} = 0; (iii) (x − ${F(7, 2)})² − ${F(61, 4)} = 0` },
{ t: "cts", q: `Find the maximum value of 7 + 6x − x² and the value of x at which it occurs.`,
  s: ["Rewrite as −x² + 6x + 7 = −(x² − 6x − 7)", "x² − 6x − 7 = (x − 3)² − 16", "So the expression equals −(x − 3)² + 16"], a: "Maximum value 16, at x = 3" },

/* Factor theorem */
{ t: "factor", q: `Given that x = 6 is a root of y = 6x³ − kx² + 31x − 6, find k and hence find the other two roots.`,
  s: ["6(6)³ − k(6)² + 31(6) − 6 = 0, so 1476 = 36k and k = 41", "Divide 6x³ − 41x² + 31x − 6 by (x − 6): quotient 6x² − 5x + 1", "6x² − 5x + 1 = (3x − 1)(2x − 1)"], a: `k = 41; the other roots are x = ${F(1, 3)} and x = ${F(1, 2)}` },
{ t: "factor", q: `If (x + 2) is a factor of x³ + ax² − x − 2, find a and hence find the other two factors.`,
  s: ["f(−2) = 0: −8 + 4a + 2 − 2 = 0, so a = 2", "Divide x³ + 2x² − x − 2 by (x + 2): quotient x² − 1", "x² − 1 = (x − 1)(x + 1)"], a: "a = 2; the other factors are (x − 1) and (x + 1)" },
{ t: "factor", q: `Solve the cubic equation 2x³ + 4x² − 6x − 12 = 0.`,
  s: ["Try x = −2: 2(−8) + 4(4) + 12 − 12 = 0, so (x + 2) is a factor", "Divide: 2x³ + 4x² − 6x − 12 = (x + 2)(2x² − 6)", "2x² − 6 = 0 gives x² = 3"], a: `x = −2, x = ${SQ(3)} or x = −${SQ(3)}` },
{ t: "factor", q: `When f(x) = x³ + kx² − 5x + 2 is divided by (x − 2) the remainder is 4. Find k.`,
  s: ["The remainder is f(2)", "f(2) = 8 + 4k − 10 + 2 = 4k", "4k = 4"], a: "k = 1" },

/* Non-linear simultaneous equations */
{ t: "nonlin", q: `Find the points of intersection of y = 2x² + 3x − 7 and 6x − 2y + 2 = 0.`,
  s: ["From the line: y = 3x + 1", "Substitute: 2x² + 3x − 7 = 3x + 1, so 2x² = 8 and x = ±2", "y = 3(2) + 1 = 7 and y = 3(−2) + 1 = −5"], a: "(2, 7) and (−2, −5)" },
{ t: "nonlin", q: `Find the points of intersection of the line 4x − 2y = 5 and the circle x² + y² = ${F(25, 4)}.`,
  s: ["From the line: y = 2x − 5/2", "x² + (2x − 5/2)² = 25/4, so 5x² − 10x + 25/4 = 25/4", "5x(x − 2) = 0, so x = 0 or x = 2", "y = −5/2 when x = 0 and y = 3/2 when x = 2"], a: `(0, −${F(5, 2)}) and (2, ${F(3, 2)})` },
{ t: "nonlin", q: `Solve the pair of simultaneous equations x² + y² = 25 and x + y = 7.`,
  s: ["From the line: y = 7 − x", "x² + (7 − x)² = 25, so 2x² − 14x + 24 = 0", "x² − 7x + 12 = 0, so (x − 3)(x − 4) = 0"], a: "(3, 4) and (4, 3)" },
{ t: "nonlin", q: `Find the points where the curve y = x² − 4x + 1 meets the line y = x − 3.`,
  s: ["Set equal: x² − 4x + 1 = x − 3", "x² − 5x + 4 = 0, so (x − 1)(x − 4) = 0", "y = −2 when x = 1 and y = 1 when x = 4"], a: "(1, −2) and (4, 1)" },

/* Creating equations from graphs */
{ t: "graphs", q: `The graph of y = ax³ + bx² + cx + d crosses the x-axis at x = 1, x = −2 and x = ${F(1, 2)}, and crosses the y-axis at (0, 6). Find a, b, c and d.`,
  s: ["y = a(x − 1)(x + 2)(x − 1/2)", "At (0, 6): a(−1)(2)(−1/2) = 6, so a = 6", "6(x − 1)(x + 2)(x − 1/2) = 3(x − 1)(x + 2)(2x − 1)", "(x − 1)(x + 2) = x² + x − 2 and (x² + x − 2)(2x − 1) = 2x³ + x² − 5x + 2, then multiply by 3"], a: "y = 6x³ + 3x² − 15x + 6, so a = 6, b = 3, c = −15, d = 6", also: ["factor"] },
{ t: "graphs", q: `A quadratic has its turning point at (−3, −1) and passes through (−2, −3). Write its equation in the form y = ax² + bx + c.`,
  s: ["y = k(x + 3)² − 1", "At (−2, −3): −3 = k(1) − 1, so k = −2", "y = −2(x² + 6x + 9) − 1"], a: "y = −2x² − 12x − 19", also: ["cts"] },
{ t: "graphs", q: `A cubic crosses the x-axis at x = −1, x = 3 and x = 7 and passes through (0, 7). Write its equation in the form y = ax³ + bx² + cx + d.`,
  s: ["y = a(x + 1)(x − 3)(x − 7) = a(x³ − 9x² + 11x + 21)", "At (0, 7): 21a = 7, so a = 1/3"], a: `y = ${F(1, 3)}x³ − 3x² + ${F(11, 3)}x + 7` },
{ t: "graphs", q: `A quadratic has a maximum point at (2, 4) and passes through (1, 1). Find its equation.`,
  s: ["y = a(x − 2)² + 4", "At (1, 1): 1 = a(1) + 4, so a = −3"], a: "y = −3(x − 2)² + 4 = −3x² + 12x − 8" },

/* Discriminant */
{ t: "disc", q: `Find the values of a for which y = ax² + 6x + a has two equal roots.`,
  s: ["Equal roots means b² − 4ac = 0", "36 − 4a² = 0, so a² = 9"], a: "a = 3 or a = −3" },
{ t: "disc", q: `Prove that y = x² − 4x + 5 is positive for all values of x.`,
  s: ["b² − 4ac = (−4)² − 4(1)(5) = −4 < 0, so there are no real roots and the curve never meets the x-axis", "The coefficient of x² is positive, so the curve opens upwards and lies above the x-axis"], a: "y > 0 for all x", also: ["cts"] },
{ t: "disc", q: `Find the discriminant of each equation and state whether its roots are real and different, real and equal, or imaginary: (i) 2x² + x + 5 = 0, (ii) −2x² + 3x + 1 = 0, (iii) 3x² + 2x − 1 = 0.`,
  s: ["Discriminant = b² − 4ac", "(i) 1 − 40 = −39", "(ii) 9 + 8 = 17", "(iii) 4 + 12 = 16"], a: "(i) −39: imaginary roots; (ii) 17: real and different; (iii) 16: real and different" },

  s: ["b² − 4ac = 4 − 12 = −8 < 0, so there are no real roots", "The coefficient of x² is negative, so the curve opens downwards and lies below the x-axis"], a: "y < 0 for all x", also: ["cts"] },

/* Substitution method */
{ t: "subst", q: `Find all real solutions of 2(x² − 1)² + 7(x² − 1) = 15.`,

{ t: "subst", q: `Find all real solutions of 2x⁴ − 8x² = 10.`,
  s: ["Let u = x²: 2u² − 8u − 10 = 0, so u² − 4u − 5 = 0", "(u − 5)(u + 1) = 0, so u = 5 or u = −1", "x² = 5 gives x = ±√5; x² = −1 has no real solution"], a: `x = ${SQ(5)} or x = −${SQ(5)}` },
{ t: "subst", q: `Solve (2t − ${F(5, "t")})² − 12(2t − ${F(5, "t")}) + 27 = 0.`,
  s: ["Let u = 2t − 5/t: u² − 12u + 27 = 0, so (u − 3)(u − 9) = 0", "2t − 5/t = 3: 2t² − 3t − 5 = 0, so (2t − 5)(t + 1) = 0", "2t − 5/t = 9: 2t² − 9t − 5 = 0, so (2t + 1)(t − 5) = 0"], a: `t = ${F(5, 2)}, −1, −${F(1, 2)} or 5` },
{ t: "subst", q: `Solve x − 5${SQ("x")} + 6 = 0.`,
  s: ["Let u = √x: u² − 5u + 6 = 0", "(u − 2)(u − 3) = 0, so u = 2 or u = 3", "x = u²"], a: "x = 4 or x = 9", also: ["surd"] },

/* ===== Fill-out: Trigonometry I ===== */
/* Radians, arc length and sector area */
{ t: "rad", q: `A sector has radius 5 cm and an angle of 2 radians. Find its area.`,
  s: ["A = ½θr² = ½(2)(5)²"], a: "25 cm²" },
{ t: "rad", q: `A sector has an angle of 220° and an area of 20 cm². Convert 220° to radians and hence find the arc length of the sector.`,
  s: ["220° = 220π/180 = 11π/9 radians", "20 = ½(11π/9)r², so r² = 360/(11π) and r ≈ 3.2276 cm", "Arc length l = rθ = 3.2276 × 11π/9"], a: "≈ 12.4 cm" },
{ t: "rad", q: `Three concentric arcs AB, CD and EF with centre O subtend the same angle θ at O and have radii 10 m, 12 m and 14 m. Arc CD is 5 m longer than arc AB. Find θ in radians and the length of arc EF.`,
  s: ["Arc AB = 10θ and arc CD = 12θ", "12θ = 10θ + 5, so θ = 2.5", "Arc EF = 14θ = 14 × 2.5"], a: "θ = 2.5 radians; arc EF = 35 m" },
{ t: "rad", q: `A sector of a circle with centre O and radius 4 cm has a reflex angle AOB, and the reflex sector has area ${F("32π", 3)} cm². Find the reflex angle in radians, ∠AOB in degrees, the length |AB| in the form a√b, and the area of triangle AOB to one decimal place.`,
  s: ["½θ(4)² = 32π/3, so θ = 4π/3 (which is 240°)", "∠AOB = 360° − 240° = 120°", "Cosine rule: |AB|² = 4² + 4² − 2(4)(4)cos 120° = 48, so |AB| = 4√3", "Area = ½(4)(4) sin 120° = 8 sin 120°"], a: `Reflex angle ${F("4π", 3)}; ∠AOB = 120°; |AB| = 4${SQ(3)} cm; area ≈ 6.9 cm²`, also: ["rules"] },
{ t: "rad", q: `A pendulum 80 cm long swings through an angle of 0.6 radians. Find the length of the arc traced by its tip and the area swept out.`,
  s: ["Arc length l = rθ = 80(0.6)", "Area = ½r²θ = ½(80)²(0.6)"], a: "48 cm and 1920 cm²" },

/* Right-angled triangles */
{ t: "right", q: `In a right-angled triangle sin x = ${F(2, 3)} and the side adjacent to angle x is 12 cm. Find the length of the hypotenuse and write down the value of cos²x.`,
  s: ["Opposite = 2k and hypotenuse = 3k, so adjacent = √(9 − 4)k = √5k", "cos x = √5/3, so cos²x = 5/9", "12 = √5k gives k = 12/√5, and the hypotenuse is 3k"], a: `Hypotenuse = ${F("36" + SQ(5), 5)} ≈ 16.1 cm; cos²x = ${F(5, 9)}` },
{ t: "right", q: `Given cot A = 2, find the exact values of sin A and cos A, and find the angle A to the nearest minute.`,
  s: ["cot A = 1/tan A = 2, so tan A = 1/2: take opposite 1 and adjacent 2", "Hypotenuse = √(1 + 4) = √5", "A = tan⁻¹(0.5) = 26.565° = 26°34′"], a: `sin A = ${F(1, SQ(5))}, cos A = ${F(2, SQ(5))}, A = 26°34′` },
{ t: "right", q: `When David is x metres from a building, the angle of elevation of its top is 62°. When he walks 3 m further away it reduces to 32°. Find the height of the building, ignoring David's height, correct to two decimal places.`,
  s: ["Let the height be h. tan 62° = h/x, so h = x tan 62°", "tan 32° = h/(x + 3), so h = (x + 3) tan 32°", "x tan 62° = (x + 3) tan 32°, so x(tan 62° − tan 32°) = 3 tan 32°", "x = 3 tan 32°/(tan 62° − tan 32°) ≈ 1.493 m", "h = 1.493 × tan 62° ≈ 2.81 m"], a: "≈ 2.81 m" },
{ t: "right", q: `From the top of a 40 m lighthouse the angle of depression of a boat is 25°. How far is the boat from the foot of the lighthouse, to the nearest metre?`,
  s: ["The angle of elevation of the top from the boat is also 25° (alternate angles)", "tan 25° = 40/d, so d = 40/tan 25°"], a: "≈ 86 m" },
{ t: "right", q: `Without a calculator, find the exact value of sin 60° cos 30° − tan 45° sin 30°.`,
  s: ["sin 60° = √3/2, cos 30° = √3/2, tan 45° = 1 and sin 30° = 1/2", "(√3/2)(√3/2) − (1)(1/2) = 3/4 − 1/2"], a: F(1, 4) },

/* Solving trig equations */
{ t: "solve", q: `Find the general solution of 2 + 2 sin x = 1.`,
  s: ["sin x = −1/2, with reference angle 30°", "Sine is negative in the third and fourth quadrants: x = 210° and x = 330°"], a: "x = 210° + 360°n or x = 330° + 360°n, n ∈ ℤ" },
{ t: "solve", q: `Find all solutions of 2 cos 3x = √3 on the domain 0° ≤ x < 240°.`,

{ t: "solve", q: `Find the general solution of tan 4x = 1, and hence list all solutions in the domain 0° < x < 180°.`,

{ t: "solve", q: `Find the general solution of 4 sin(${F("x", 2)}) = 2, and hence all solutions on the domain 0 ≤ x ≤ 5π.`,
  s: ["sin(x/2) = 1/2, so x/2 = π/6 + 2πn or x/2 = 5π/6 + 2πn", "x = π/3 + 4πn or x = 5π/3 + 4πn", "n = 0: π/3 and 5π/3. n = 1: 13π/3 is inside the domain (it is less than 5π), but 17π/3 is outside"], a: `x = ${F("π", 3)}, ${F("5π", 3)}, ${F("13π", 3)}` },
{ t: "solve", q: `Find the general solution of 3 + 2 sin x = 2, and hence all solutions on the domain 0 ≤ x ≤ 4π.`,
  s: ["sin x = −1/2, with reference angle π/6", "Sine is negative in the third and fourth quadrants: x = 7π/6 and x = 11π/6", "General solution: x = 7π/6 + 2πn or x = 11π/6 + 2πn", "n = 0 and n = 1 give four solutions in [0, 4π]"], a: `${F("7π", 6)}, ${F("11π", 6)}, ${F("19π", 6)}, ${F("23π", 6)}` },
{ t: "solve", q: `Find the values of x where f(x) = 2 + 3 sin 2x meets the line y = 3. Give the general solution in degrees, to two decimal places.`,
  s: ["2 + 3 sin 2x = 3, so sin 2x = 1/3", "2x = 19.47° or 2x = 180° − 19.47° = 160.53° (plus multiples of 360°)", "Divide by 2"], a: "x = 9.74° + 180°n or x = 80.26° + 180°n, n ∈ ℤ", also: ["tgraph"] },

/* Graphs of trig functions */
{ t: "tgraph", q: `State the range, amplitude, midway line and period of g(x) = −2 cos x and m(x) = 2 + cos x.`,
  s: ["g(x): −2 cos x oscillates between −2 and 2 about y = 0", "m(x): 2 + cos x oscillates between 1 and 3 about y = 2", "The period of cos x is 2π and neither function changes it"], a: "g: range [−2, 2], amplitude 2, midway line y = 0, period 2π. m: range [1, 3], amplitude 1, midway line y = 2, period 2π" },
{ t: "tgraph", q: `A function f(x) = a + b sin(cx), with b > 0 and c > 0, has range [2.5, 3.5] and period π. Find f(x).`,
  s: ["Midway line: a = (2.5 + 3.5)/2 = 3", "Amplitude: b = (3.5 − 2.5)/2 = 1/2", "Period 2π/c = π, so c = 2"], a: `f(x) = 3 + ${F(1, 2)} sin 2x` },
{ t: "tgraph", q: `A function f(x) = a + b sin(cx) has range [3, 5] and period 3π. It starts on its midway line and then decreases. Find f(x).`,

{ t: "tgraph", q: `A function f(x) = a + b sin(cx) has range [−10, 2]. It starts on its midway line and rises, and returns to the midway line (falling) at x = 3π. Find f(x).`,
  s: ["a = (−10 + 2)/2 = −4 and b = 6 (it rises first)", "A half rotation takes 3π, so the period is 6π and c = 2π/6π = 1/3"], a: `f(x) = −4 + 6 sin(${F("x", 3)})` },
{ t: "tgraph", q: `State the domain, range and period of f(x) = tan x, and write down the equations of its asymptotes.`,

{ t: "tgraph", q: `For f(x) = tan(${F("3x", 2)}) find the period, the equations of the asymptotes either side of the origin, and one point on the curve other than the origin.`,
