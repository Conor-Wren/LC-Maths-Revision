{ t: "iconst", q: `A curve has gradient <span class="fr"><span>dy</span><span>dx</span></span> = 3x² + 4x − 4 and passes through the point (1, 2). Find the equation of the curve.`, s: [`Integrate the gradient: y = x³ + 2x² − 4x + c.`, `Substitute the point (1, 2): 1 + 2 − 4 + c = 2, so c = 3.`], a: `y = x³ + 2x² − 4x + 3` },
{ t: "iconst", q: `Given f′(x) = <span class="sq">√<span>x</span></span> − <span class="fr"><span>1</span><span>x²</span></span> and f(1) = 2, find f(x).`, s: [`Write as powers: f′(x) = x<sup>1/2</sup> − x<sup>−2</sup>.`, `f(x) = <span class="fr"><span>2</span><span>3</span></span>x<sup>3/2</sup> + <span class="fr"><span>1</span><span>x</span></span> + c.`, `f(1) = <span class="fr"><span>2</span><span>3</span></span> + 1 + c = 2, so c = <span class="fr"><span>1</span><span>3</span></span>.`], a: `f(x) = <span class="fr"><span>2</span><span>3</span></span>x<sup>3/2</sup> + <span class="fr"><span>1</span><span>x</span></span> + <span class="fr"><span>1</span><span>3</span></span>` },
{ t: "iconst", q: `Find the antiderivative of f′(x) = e<sup>3x−5</sup>. Hence find the constant of integration, given that f(<span class="fr"><span>5</span><span>3</span></span>) = 1.`, s: [`f(x) = <span class="fr"><span>e<sup>3x−5</sup></span><span>3</span></span> + c.`, `At x = <span class="fr"><span>5</span><span>3</span></span>, the power is 3 × <span class="fr"><span>5</span><span>3</span></span> − 5 = 0 and e⁰ = 1, so f(<span class="fr"><span>5</span><span>3</span></span>) = <span class="fr"><span>1</span><span>3</span></span> + c = 1.`, `c = 1 − <span class="fr"><span>1</span><span>3</span></span> = <span class="fr"><span>2</span><span>3</span></span>.`], a: `f(x) = <span class="fr"><span>e<sup>3x−5</sup></span><span>3</span></span> + c, with c = <span class="fr"><span>2</span><span>3</span></span>` },
{ t: "iconst", q: `Given f′(x) = 4 + e<sup>3x</sup> and f(0) = 3, find f(x).`, s: [`f(x) = 4x + <span class="fr"><span>e<sup>3x</sup></span><span>3</span></span> + c.`, `f(0) = 0 + <span class="fr"><span>1</span><span>3</span></span> + c = 3, so c = <span class="fr"><span>8</span><span>3</span></span>.`], a: `f(x) = 4x + <span class="fr"><span>e<sup>3x</sup></span><span>3</span></span> + <span class="fr"><span>8</span><span>3</span></span>` },
{ t: "iconst", q: `A curve satisfies <span class="fr"><span>dy</span><span>dx</span></span> = 6 cos 2x and y = 5 when x = <span class="fr"><span>π</span><span>4</span></span>. Find y in terms of x.`, s: [`y = 3 sin 2x + c.`, `At x = <span class="fr"><span>π</span><span>4</span></span>: 3 sin(<span class="fr"><span>π</span><span>2</span></span>) + c = 3 + c = 5, so c = 2.`], a: `y = 3 sin 2x + 2` },
{ t: "iconst", q: `Given f′(x) = 2<sup>x</sup> + 1 and f(0) = 2, find f(x), and the value of the constant of integration correct to 3 decimal places.`, s: [`f(x) = <span class="fr"><span>2<sup>x</sup></span><span>ln 2</span></span> + x + c.`, `f(0) = <span class="fr"><span>1</span><span>ln 2</span></span> + c = 2, so c = 2 − <span class="fr"><span>1</span><span>ln 2</span></span> = 0.557.`], a: `f(x) = <span class="fr"><span>2<sup>x</sup></span><span>ln 2</span></span> + x + c, with c ≈ 0.557` },
{ t: "iconst", q: `The gradient of a curve is 6x − 4 and the curve passes through (2, 5). Find the equation of the curve, and the value of y when x = 3.`, s: [`Integrate: y = 3x² − 4x + c.`, `Substitute (2, 5): 12 − 8 + c = 5, so c = 1 and y = 3x² − 4x + 1.`, `When x = 3: y = 27 − 12 + 1 = 16.`], a: `y = 3x² − 4x + 1; y = 16 when x = 3` },
{ t: "iconst", q: `Given f″(x) = 12x − 6, f′(1) = 3 and f(0) = 2, find f(x).`, s: [`Integrate once: f′(x) = 6x² − 6x + c₁.`, `f′(1) = 6 − 6 + c₁ = 3, so c₁ = 3.`, `Integrate again: f(x) = 2x³ − 3x² + 3x + c₂.`, `f(0) = c₂ = 2.`], a: `f(x) = 2x³ − 3x² + 3x + 2` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">3</span><span class="sg-s">∫</span><span class="sg-b">−1</span></span> (2x² + x) dx.`, s: [`A definite integral has limits, so there is no constant: find the antiderivative, then (upper) − (lower).`, `[<span class="fr"><span>2x³</span><span>3</span></span> + <span class="fr"><span>x²</span><span>2</span></span>] from −1 to 3.`, `At 3: 18 + <span class="fr"><span>9</span><span>2</span></span> = <span class="fr"><span>45</span><span>2</span></span>.  At −1: −<span class="fr"><span>2</span><span>3</span></span> + <span class="fr"><span>1</span><span>2</span></span> = −<span class="fr"><span>1</span><span>6</span></span>.`, `<span class="fr"><span>45</span><span>2</span></span> + <span class="fr"><span>1</span><span>6</span></span> = <span class="fr"><span>68</span><span>3</span></span>.`], a: `<span class="fr"><span>68</span><span>3</span></span> ≈ 22.67` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">2</span><span class="sg-s">∫</span><span class="sg-b">−1</span></span> e<sup>4x+3</sup> dx.`, s: [`The antiderivative is <span class="fr"><span>e<sup>4x+3</sup></span><span>4</span></span>.`, `Upper limit: <span class="fr"><span>e<sup>11</sup></span><span>4</span></span>.  Lower limit: <span class="fr"><span>e<sup>−1</sup></span><span>4</span></span>.`, `<span class="fr"><span>e<sup>11</sup> − e<sup>−1</sup></span><span>4</span></span> ≈ 14968.4.`], a: `<span class="fr"><span>e<sup>11</sup> − e<sup>−1</sup></span><span>4</span></span> ≈ 14968.4` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">11π/18</span><span class="sg-s">∫</span><span class="sg-b">π/2</span></span> cos(4x + 1) dx, with the angles in radians. Give your answer correct to 3 decimal places.`, s: [`The antiderivative is <span class="fr"><span>sin(4x + 1)</span><span>4</span></span>, and the calculator must be in radian mode.`, `Upper: <span class="fr"><span>sin(4 × 11π/18 + 1)</span><span>4</span></span>.  Lower: <span class="fr"><span>sin(4 × π/2 + 1)</span><span>4</span></span> = <span class="fr"><span>sin(2π + 1)</span><span>4</span></span>.`, `Subtract: ≈ −0.041.`], a: `≈ −0.041` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">3</span><span class="sg-s">∫</span><span class="sg-b">1</span></span> 2<sup>x</sup> dx.`, s: [`The antiderivative is <span class="fr"><span>2<sup>x</sup></span><span>ln 2</span></span>.`, `<span class="fr"><span>2³ − 2¹</span><span>ln 2</span></span> = <span class="fr"><span>6</span><span>ln 2</span></span> ≈ 8.66.`], a: `<span class="fr"><span>6</span><span>ln 2</span></span> ≈ 8.66` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">16</span><span class="sg-s">∫</span><span class="sg-b">4</span></span> <span class="fr"><span>1</span><span><span class="sq">√<span>x</span></span></span></span> dx.`, s: [`Write the integrand as x<sup>−1/2</sup>, with antiderivative <span class="fr"><span>x<sup>1/2</sup></span><span>1/2</span></span> = 2<span class="sq">√<span>x</span></span>.`, `Upper: 2<span class="sq">√<span>16</span></span> = 8.  Lower: 2<span class="sq">√<span>4</span></span> = 4.`, `8 − 4 = 4.`], a: `4` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">2</span><span class="sg-s">∫</span><span class="sg-b">1</span></span> (<span class="fr"><span>3</span><span><span class="sq">√<span>x</span></span></span></span> − e<sup>x</sup>) dx, correct to 1 decimal place.`, s: [`Write 3/√x as 3x<sup>−1/2</sup>, which integrates to 6x<sup>1/2</sup>. The antiderivative is 6<span class="sq">√<span>x</span></span> − e<sup>x</sup>.`, `Upper: 6<span class="sq">√<span>2</span></span> − e². Lower: 6 − e.`, `(6<span class="sq">√<span>2</span></span> − e²) − (6 − e) ≈ −2.19.`], a: `≈ −2.2` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">2</span><span class="sg-s">∫</span><span class="sg-b">1</span></span> <span class="fr"><span>x³ − 1</span><span>x²</span></span> dx.`, s: [`Divide each term by x² first: x − x<sup>−2</sup>.`, `The antiderivative is <span class="fr"><span>x²</span><span>2</span></span> + <span class="fr"><span>1</span><span>x</span></span>.`, `Upper: 2 + <span class="fr"><span>1</span><span>2</span></span> = <span class="fr"><span>5</span><span>2</span></span>.  Lower: <span class="fr"><span>1</span><span>2</span></span> + 1 = <span class="fr"><span>3</span><span>2</span></span>.`, `<span class="fr"><span>5</span><span>2</span></span> − <span class="fr"><span>3</span><span>2</span></span> = 1.`], a: `1` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">3π/2</span><span class="sg-s">∫</span><span class="sg-b">π/4</span></span> 3 cos(−2x) dx.`, s: [`From earlier: ∫ 3 cos(−2x) dx = <span class="fr"><span>3</span><span>2</span></span> sin 2x.`, `Upper: <span class="fr"><span>3</span><span>2</span></span> sin 3π = 0.  Lower: <span class="fr"><span>3</span><span>2</span></span> sin(<span class="fr"><span>π</span><span>2</span></span>) = <span class="fr"><span>3</span><span>2</span></span>.`, `0 − <span class="fr"><span>3</span><span>2</span></span> = −<span class="fr"><span>3</span><span>2</span></span>.`], a: `−<span class="fr"><span>3</span><span>2</span></span>` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">9</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> <span class="fr"><span>10<span class="sq">√<span>x</span></span></span><span>3</span></span> dx.`, s: [`Write the integrand as <span class="fr"><span>10</span><span>3</span></span>x<sup>1/2</sup>.`, `The antiderivative is <span class="fr"><span>10</span><span>3</span></span> × <span class="fr"><span>2</span><span>3</span></span>x<sup>3/2</sup> = <span class="fr"><span>20</span><span>9</span></span>x<sup>3/2</sup>.`, `At 9: 9<sup>3/2</sup> = 27, so <span class="fr"><span>20</span><span>9</span></span> × 27 = 60.  At 0: 0.`], a: `60` },
{ t: "idef", q: `Evaluate <span class="sig"><span class="sg-t">2π/3</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> (−cos 2x) dx.`, s: [`The antiderivative of −cos 2x is −<span class="fr"><span>sin 2x</span><span>2</span></span>.`, `Upper: −<span class="fr"><span>sin(4π/3)</span><span>2</span></span> = −<span class="fr"><span>(−<span class="sq">√<span>3</span></span>/2)</span><span>2</span></span> = <span class="fr"><span><span class="sq">√<span>3</span></span></span><span>4</span></span>.  Lower: 0.`, `So the value is <span class="fr"><span><span class="sq">√<span>3</span></span></span><span>4</span></span> ≈ 0.433.`], a: `<span class="fr"><span><span class="sq">√<span>3</span></span></span><span>4</span></span> ≈ 0.433` },
{ t: "ihence", q: `(i) Find <span class="fr"><span>dy</span><span>dx</span></span> given y = e<sup>x²</sup>.  (ii) Hence find ∫ 2x e<sup>x²</sup> dx.  (iii) Hence evaluate <span class="sig"><span class="sg-t">1</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> x e<sup>x²</sup> dx.`, s: [`(i) Chain rule: <span class="fr"><span>dy</span><span>dx</span></span> = 2x e<sup>x²</sup>.`, `(ii) Integrating a derivative gives back the original function: ∫ 2x e<sup>x²</sup> dx = e<sup>x²</sup> + c.`, `(iii) Halve the result: ∫ x e<sup>x²</sup> dx = <span class="fr"><span>1</span><span>2</span></span>e<sup>x²</sup>.`, `From 0 to 1: <span class="fr"><span>1</span><span>2</span></span>(e − 1) ≈ 0.859.`], a: `(i) 2x e<sup>x²</sup>  (ii) e<sup>x²</sup> + c  (iii) <span class="fr"><span>e − 1</span><span>2</span></span> ≈ 0.859` },
{ t: "ihence", q: `(i) Find <span class="fr"><span>dy</span><span>dx</span></span> given y = cos(x² − 4).  (ii) Hence find ∫ x sin(x² − 4) dx.`, s: [`(i) Chain rule: <span class="fr"><span>dy</span><span>dx</span></span> = −sin(x² − 4) × 2x = −2x sin(x² − 4).`, `(ii) So ∫ −2x sin(x² − 4) dx = cos(x² − 4) + c.`, `Divide by −2: ∫ x sin(x² − 4) dx = −<span class="fr"><span>1</span><span>2</span></span> cos(x² − 4) + c.`], a: `(i) −2x sin(x² − 4)  (ii) −<span class="fr"><span>1</span><span>2</span></span> cos(x² − 4) + c` },
{ t: "ihence", q: `(i) Differentiate y = x cos 5x.  (ii) Hence find ∫ x sin 5x dx.`, s: [`(i) Product rule: <span class="fr"><span>dy</span><span>dx</span></span> = x(−5 sin 5x) + cos 5x × 1 = cos 5x − 5x sin 5x.`, `(ii) Integrate both sides: x cos 5x = ∫ cos 5x dx − 5 ∫ x sin 5x dx.`, `∫ cos 5x dx = <span class="fr"><span>sin 5x</span><span>5</span></span>, so 5 ∫ x sin 5x dx = <span class="fr"><span>sin 5x</span><span>5</span></span> − x cos 5x.`, `Divide by 5: ∫ x sin 5x dx = <span class="fr"><span>sin 5x</span><span>25</span></span> − <span class="fr"><span>x cos 5x</span><span>5</span></span> + c.`], a: `(i) cos 5x − 5x sin 5x  (ii) <span class="fr"><span>sin 5x</span><span>25</span></span> − <span class="fr"><span>x cos 5x</span><span>5</span></span> + c` },
{ t: "ihence", q: `(i) Differentiate y = x e<sup>2x</sup>.  (ii) Hence find ∫ x e<sup>2x</sup> dx.`, s: [`(i) Product rule: <span class="fr"><span>dy</span><span>dx</span></span> = x × 2e<sup>2x</sup> + e<sup>2x</sup> × 1 = e<sup>2x</sup> + 2x e<sup>2x</sup>.`, `(ii) Integrate both sides: x e<sup>2x</sup> = ∫ e<sup>2x</sup> dx + 2 ∫ x e<sup>2x</sup> dx = <span class="fr"><span>e<sup>2x</sup></span><span>2</span></span> + 2 ∫ x e<sup>2x</sup> dx.`, `So 2 ∫ x e<sup>2x</sup> dx = x e<sup>2x</sup> − <span class="fr"><span>e<sup>2x</sup></span><span>2</span></span>.`, `Divide by 2.`], a: `(i) e<sup>2x</sup> + 2x e<sup>2x</sup>  (ii) <span class="fr"><span>x e<sup>2x</sup></span><span>2</span></span> − <span class="fr"><span>e<sup>2x</sup></span><span>4</span></span> + c` },
{ t: "ihence", q: `(i) Differentiate y = sin³x.  (ii) Hence evaluate <span class="sig"><span class="sg-t">π/2</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> sin²x cos x dx.`, s: [`(i) Chain rule: <span class="fr"><span>dy</span><span>dx</span></span> = 3 sin²x cos x.`, `(ii) So ∫ sin²x cos x dx = <span class="fr"><span>1</span><span>3</span></span> sin³x.`, `From 0 to <span class="fr"><span>π</span><span>2</span></span>: <span class="fr"><span>1</span><span>3</span></span>(1³ − 0³) = <span class="fr"><span>1</span><span>3</span></span>.`], a: `(i) 3 sin²x cos x  (ii) <span class="fr"><span>1</span><span>3</span></span>` },
{ t: "ihence", q: `Given m = e<sup>x²+1</sup>, find <span class="fr"><span>dm</span><span>dx</span></span>. Hence find ∫ x e<sup>x²+1</sup> dx.`, s: [`<span class="fr"><span>dm</span><span>dx</span></span> = 2x e<sup>x²+1</sup> (chain rule).`, `So ∫ 2x e<sup>x²+1</sup> dx = e<sup>x²+1</sup> + c, and halving gives ∫ x e<sup>x²+1</sup> dx = <span class="fr"><span>1</span><span>2</span></span>e<sup>x²+1</sup> + c.`], a: `<span class="fr"><span>dm</span><span>dx</span></span> = 2x e<sup>x²+1</sup>;  ∫ x e<sup>x²+1</sup> dx = <span class="fr"><span>1</span><span>2</span></span>e<sup>x²+1</sup> + c` },
{ t: "ihence", q: `(i) Differentiate y = <span class="sq">√<span>x² + 4</span></span>.  (ii) Hence evaluate <span class="sig"><span class="sg-t">√5</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> <span class="fr"><span>x</span><span><span class="sq">√<span>x² + 4</span></span></span></span> dx.`, s: [`(i) Write y = (x² + 4)<sup>1/2</sup>. Chain rule: <span class="fr"><span>dy</span><span>dx</span></span> = <span class="fr"><span>1</span><span>2</span></span>(x² + 4)<sup>−1/2</sup> × 2x = <span class="fr"><span>x</span><span><span class="sq">√<span>x² + 4</span></span></span></span>.`, `(ii) The integrand is exactly the derivative, so ∫ <span class="fr"><span>x</span><span><span class="sq">√<span>x² + 4</span></span></span></span> dx = <span class="sq">√<span>x² + 4</span></span>.`, `From 0 to √5: <span class="sq">√<span>9</span></span> − <span class="sq">√<span>4</span></span> = 3 − 2 = 1.`], a: `(i) <span class="fr"><span>x</span><span><span class="sq">√<span>x² + 4</span></span></span></span>  (ii) 1` },
{ t: "kin", q: `The velocity of a car is v(t) = 10 + 4t, where v is in m/s and t is in seconds. (i) Find the speed after 5 seconds. (ii) The car is 100 m from a fixed point when t = 4. How far from that point is it when t = 8? (iii) Show that the acceleration is constant. (iv) How far has the car gone when its speed has doubled from its initial speed?`, s: [`(i) v(5) = 10 + 20 = 30 m/s.`, `(ii) Distance is the integral of velocity: s(t) = 10t + 2t² + c. At t = 4: 40 + 32 + c = 100, so c = 28. Then s(8) = 80 + 128 + 28 = 236.`, `(iii) Acceleration is the derivative of velocity: a = v′(t) = 4 m/s², a constant.`, `(iv) Initial speed v(0) = 10, double is 20: 10 + 4t = 20 so t = 2.5. s(2.5) = 25 + 12.5 + 28 = 65.5 m.`], a: `(i) 30 m/s  (ii) 236 m  (iii) a = 4 m/s²  (iv) 65.5 m` },
{ t: "kin", q: `An object starts from rest at a point A. Its acceleration is a(t) = 100 − 3t m/s², where t is in seconds. (i) Find its speed after 5 seconds. (ii) Find its distance from A after 4 seconds. (iii) Find the distances from A at the times when its speed is 50 m/s, correct to the nearest metre.`, s: [`(i) Integrate acceleration to get velocity: v(t) = 100t − <span class="fr"><span>3t²</span><span>2</span></span> + c. At rest at t = 0, so c = 0. v(5) = 500 − 37.5 = 462.5 m/s.`, `(ii) Integrate velocity: s(t) = 50t² − <span class="fr"><span>t³</span><span>2</span></span> + c, and s(0) = 0 gives c = 0. s(4) = 800 − 32 = 768 m.`, `(iii) Solve 100t − 1.5t² = 50, i.e. 3t² − 200t + 100 = 0: t ≈ 0.50 or t ≈ 66.16.`, `s(0.50) ≈ 13 m and s(66.16) ≈ 74061 m.`], a: `(i) 462.5 m/s  (ii) 768 m  (iii) 13 m and 74061 m` },
{ t: "kin", q: `A particle moves in a straight line with acceleration a = 6t − 12 m/s². At t = 0 its velocity is 9 m/s and it is at the origin. (i) Find expressions for its velocity and displacement. (ii) Find when it is at rest. (iii) How far is it from the origin at each of those times?`, s: [`(i) v = 3t² − 12t + c, and v(0) = 9 gives c = 9. So v = 3t² − 12t + 9. Then s = t³ − 6t² + 9t + c, and s(0) = 0 gives c = 0.`, `(ii) At rest: 3t² − 12t + 9 = 0, so t² − 4t + 3 = 0 and t = 1 or t = 3.`, `(iii) s(1) = 1 − 6 + 9 = 4 m. s(3) = 27 − 54 + 27 = 0, so it is back at the origin.`], a: `(i) v = 3t² − 12t + 9, s = t³ − 6t² + 9t  (ii) t = 1 and t = 3  (iii) 4 m and 0 m` },
{ t: "kin", q: `The velocity of an object, in m/s, is v(t) = −<span class="fr"><span>t²</span><span>3</span></span> + 3t + 5 after t seconds. (i) Find the initial velocity. (ii) Find the displacement function s(t), given s(0) = 0, and hence the distance travelled after 5 seconds. (iii) Find the acceleration after 4 seconds. (iv) Find the average speed on [0, 10]. (v) Find the average value of s(t) on 3 ≤ t ≤ 8.`, s: [`(i) v(0) = 5 m/s.`, `(ii) s(t) = −<span class="fr"><span>t³</span><span>9</span></span> + <span class="fr"><span>3t²</span><span>2</span></span> + 5t + c, and c = 0. s(5) = −<span class="fr"><span>125</span><span>9</span></span> + 37.5 + 25 ≈ 48.61 m.`, `(iii) a = v′(t) = −<span class="fr"><span>2t</span><span>3</span></span> + 3, so a(4) = −<span class="fr"><span>8</span><span>3</span></span> + 3 = <span class="fr"><span>1</span><span>3</span></span> m/s².`, `(iv) Average speed = <span class="fr"><span>1</span><span>10</span></span> <span class="sig"><span class="sg-t">10</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> v dt = <span class="fr"><span>s(10)</span><span>10</span></span> = <span class="fr"><span>88.89</span><span>10</span></span> ≈ 8.889 m/s.`, `(v) <span class="fr"><span>1</span><span>5</span></span> <span class="sig"><span class="sg-t">8</span><span class="sg-s">∫</span><span class="sg-b">3</span></span> s dt, with antiderivative −<span class="fr"><span>t⁴</span><span>36</span></span> + <span class="fr"><span>t³</span><span>2</span></span> + <span class="fr"><span>5t²</span><span>2</span></span>: ≈ 53.69.`], a: `(i) 5 m/s  (ii) ≈ 48.61 m  (iii) <span class="fr"><span>1</span><span>3</span></span> m/s²  (iv) ≈ 8.889 m/s  (v) ≈ 53.69` },
{ t: "kin", q: `A ball is thrown upwards from the ground with velocity v = 30 − 9.8t m/s. (i) When does it reach its highest point? (ii) Find its greatest height. (iii) When does it return to the ground?`, s: [`(i) At the highest point v = 0: 30 − 9.8t = 0, so t = <span class="fr"><span>30</span><span>9.8</span></span> ≈ 3.061 s.`, `(ii) Integrate: s = 30t − 4.9t² (s(0) = 0). s(3.061) ≈ 45.92 m.`, `(iii) s = 0 again: t(30 − 4.9t) = 0, so t = <span class="fr"><span>30</span><span>4.9</span></span> ≈ 6.12 s (twice the time to the top).`], a: `(i) ≈ 3.06 s  (ii) ≈ 45.92 m  (iii) ≈ 6.12 s` },
{ t: "kin", q: `The velocity of a particle is v = 9 − (3 − t)² m/s, for t seconds after starting. (i) Show that v = 6t − t². (ii) When is it at rest? (iii) What distance does it travel in the first six seconds?`, s: [`(i) 9 − (9 − 6t + t²) = 6t − t².`, `(ii) 6t − t² = t(6 − t) = 0, so t = 0 or t = 6 s.`, `(iii) Distance is the integral of velocity: <span class="sig"><span class="sg-t">6</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> (6t − t²) dt = [3t² − <span class="fr"><span>t³</span><span>3</span></span>] = 108 − 72 = 36 m. The velocity is never negative between 0 and 6, so there is no change of direction.`], a: `(ii) t = 0 and t = 6  (iii) 36 m`, gs: "k7" },
{ t: "kin", q: `A car is travelling at 20 m/s when the driver brakes with constant deceleration 4 m/s². Find how long it takes to stop and the braking distance.`, s: [`Deceleration means a = −4. Integrate: v = −4t + c, and v(0) = 20, so v = 20 − 4t.`, `It stops when v = 0: t = 5 s.`, `Integrate again: s = 20t − 2t² (s(0) = 0). s(5) = 100 − 50 = 50 m.`], a: `5 s and 50 m` },
{ t: "kin", q: `A train is travelling at 2 m/s when it starts to accelerate at a = 0.6t m/s², where t is in seconds. Find its speed and the distance it has travelled after 10 seconds.`, s: [`v = 0.3t² + c, and v(0) = 2, so v = 0.3t² + 2.`, `v(10) = 30 + 2 = 32 m/s.`, `s = 0.1t³ + 2t (s(0) = 0). s(10) = 100 + 20 = 120 m.`], a: `32 m/s and 120 m` },
{ t: "kin", q: `The velocity of a particle is v = t² − 6t + 5 m/s. (i) Find the displacement from its starting point after 6 seconds. (ii) Find the total distance it travels in those 6 seconds.`, s: [`(i) Displacement = <span class="sig"><span class="sg-t">6</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> v dt = [<span class="fr"><span>t³</span><span>3</span></span> − 3t² + 5t] = 72 − 108 + 30 = −6 m (6 m back in the negative direction).`, `(ii) The velocity changes sign where t² − 6t + 5 = 0, i.e. at t = 1 and t = 5, so the particle turns round there. Split the integral.`, `0 to 1: <span class="fr"><span>7</span><span>3</span></span>.  1 to 5: −<span class="fr"><span>32</span><span>3</span></span> (negative, so take the positive value <span class="fr"><span>32</span><span>3</span></span>).  5 to 6: <span class="fr"><span>7</span><span>3</span></span>.`, `Total distance = <span class="fr"><span>7</span><span>3</span></span> + <span class="fr"><span>32</span><span>3</span></span> + <span class="fr"><span>7</span><span>3</span></span> = <span class="fr"><span>46</span><span>3</span></span> ≈ 15.33 m.`], a: `(i) −6 m  (ii) <span class="fr"><span>46</span><span>3</span></span> m ≈ 15.33 m`, gs: "k10" },
{ t: "rate", q: `Water is poured into a hemispherical bowl so that <span class="fr"><span>dV</span><span>dt</span></span> = 2πt² cm³/s, where V is the volume of water after t seconds. There is <span class="fr"><span>4</span><span>3</span></span>π cm³ in the bowl at the start. (i) Find a formula for V in terms of t. (ii) The bowl holds 457 cm³ when full. How long does it take to fill, correct to 1 decimal place?`, s: [`(i) Integrate the rate of change to recover the volume: V = <span class="fr"><span>2π</span><span>3</span></span>t³ + c. At t = 0, V = <span class="fr"><span>4π</span><span>3</span></span>, so c = <span class="fr"><span>4π</span><span>3</span></span>. V = <span class="fr"><span>2π</span><span>3</span></span>t³ + <span class="fr"><span>4π</span><span>3</span></span>.`, `(ii) Set V = 457: <span class="fr"><span>2π</span><span>3</span></span>t³ = 457 − <span class="fr"><span>4π</span><span>3</span></span> ≈ 452.81, so t³ ≈ 216.2 and t ≈ 6.00.`], a: `(i) V = <span class="fr"><span>2π</span><span>3</span></span>t³ + <span class="fr"><span>4π</span><span>3</span></span>  (ii) t ≈ 6.0 s` },
{ t: "rate", q: `A tank contains 50 litres of water when a tap is turned on. Water flows in at a rate of <span class="fr"><span>dV</span><span>dt</span></span> = 12 − 0.6t litres per minute. (i) Find the volume after 10 minutes. (ii) The flow stops when the rate reaches zero. Find the volume in the tank then. (iii) When does the volume first reach 100 litres?`, s: [`Integrate the rate: V = 12t − 0.3t² + c, and V(0) = 50, so V = 50 + 12t − 0.3t².`, `(i) V(10) = 50 + 120 − 30 = 140 litres.`, `(ii) 12 − 0.6t = 0 gives t = 20, and V(20) = 50 + 240 − 120 = 170 litres.`, `(iii) 50 + 12t − 0.3t² = 100 gives 0.3t² − 12t + 50 = 0, so t ≈ 4.72 minutes (the smaller root).`], a: `(i) 140 L  (ii) 170 L  (iii) ≈ 4.7 min` },
{ t: "rate", q: `The population of a town is growing at a rate of <span class="fr"><span>dP</span><span>dt</span></span> = 120e<sup>0.05t</sup> people per year, where t is in years. The population is 3000 when t = 0. Find the population after 10 years, to the nearest whole number.`, s: [`Integrate: P = <span class="fr"><span>120</span><span>0.05</span></span>e<sup>0.05t</sup> + c = 2400e<sup>0.05t</sup> + c.`, `P(0) = 2400 + c = 3000, so c = 600.`, `P(10) = 2400e<sup>0.5</sup> + 600 ≈ 4557.`], a: `≈ 4557` },
{ t: "rate", q: `A tank holds 500 litres. It drains at the rate <span class="fr"><span>dV</span><span>dt</span></span> = −4 − 0.2t litres per minute. How long does it take to empty, to 1 decimal place?`, s: [`Integrate the rate: V = −4t − 0.1t² + c, and V(0) = 500, so V = 500 − 4t − 0.1t².`, `Empty means V = 0: 0.1t² + 4t − 500 = 0, so t² + 40t − 5000 = 0.`, `t = <span class="fr"><span>−40 + <span class="sq">√<span>21600</span></span></span><span>2</span></span> ≈ 53.5 minutes (reject the negative root).`], a: `≈ 53.5 minutes` },
{ t: "rate", q: `The mass m, in grams, of a substance changes at the rate <span class="fr"><span>dm</span><span>dt</span></span> = −0.4e<sup>−0.2t</sup> g/hour. Its mass is 5 g at t = 0. Find its mass after 5 hours, correct to 2 decimal places.`, s: [`Integrate: m = <span class="fr"><span>−0.4</span><span>−0.2</span></span>e<sup>−0.2t</sup> + c = 2e<sup>−0.2t</sup> + c.`, `m(0) = 2 + c = 5, so c = 3.`, `m(5) = 2e<sup>−1</sup> + 3 ≈ 3.74 g.`], a: `≈ 3.74 g` },
{ t: "aunder", q: `Find the area under the curve f(x) = x² − 3x between x = 3 and x = 5, bounded by the x-axis.`, s: [`First check the curve is above the axis on [3, 5]: x² − 3x = x(x − 3) ≥ 0 for x ≥ 3, so the integral is the area.`, `Area = <span class="sig"><span class="sg-t">5</span><span class="sg-s">∫</span><span class="sg-b">3</span></span> (x² − 3x) dx = [<span class="fr"><span>x³</span><span>3</span></span> − <span class="fr"><span>3x²</span><span>2</span></span>] from 3 to 5.`, `At 5: <span class="fr"><span>125</span><span>3</span></span> − <span class="fr"><span>75</span><span>2</span></span> = <span class="fr"><span>25</span><span>6</span></span>.  At 3: 9 − <span class="fr"><span>27</span><span>2</span></span> = −<span class="fr"><span>9</span><span>2</span></span>.`, `<span class="fr"><span>25</span><span>6</span></span> + <span class="fr"><span>9</span><span>2</span></span> = <span class="fr"><span>26</span><span>3</span></span>.`], a: `<span class="fr"><span>26</span><span>3</span></span> ≈ 8.67 square units`, gs: "ua1" },
{ t: "aunder", q: `Find the area between the curve f(x) = 2x² + 1 and the x-axis from the point (0, 1) to the point (3, 19).`, s: [`The x-values of the two points are 0 and 3, so these are the limits.`, `Area = <span class="sig"><span class="sg-t">3</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> (2x² + 1) dx = [<span class="fr"><span>2x³</span><span>3</span></span> + x] from 0 to 3.`, `(18 + 3) − 0 = 21.`], a: `21 square units`, gs: "ua2" },
{ t: "aunder", q: `Find the area enclosed between the curve y = 3 cos 2x and the x-axis on 0 ≤ x ≤ π (x in radians).`, s: [`Take care: the curve goes below the axis, and an integral counts that part as negative, so split at the roots.`, `3 cos 2x = 0 gives 2x = <span class="fr"><span>π</span><span>2</span></span>, <span class="fr"><span>3π</span><span>2</span></span>, so x = <span class="fr"><span>π</span><span>4</span></span> and <span class="fr"><span>3π</span><span>4</span></span>.`, `Antiderivative: <span class="fr"><span>3</span><span>2</span></span> sin 2x.`, `0 to <span class="fr"><span>π</span><span>4</span></span>: <span class="fr"><span>3</span><span>2</span></span>.  <span class="fr"><span>π</span><span>4</span></span> to <span class="fr"><span>3π</span><span>4</span></span>: <span class="fr"><span>3</span><span>2</span></span>(−1 − 1) = −3, so its area is 3.  <span class="fr"><span>3π</span><span>4</span></span> to π: <span class="fr"><span>3</span><span>2</span></span>.`, `Total area = 1.5 + 3 + 1.5 = 6.`], a: `6 square units`, gs: "ua3" },
{ t: "aunder", q: `Find the total area between the curve y = x² − 4 and the x-axis from x = 0 to x = 3.`, s: [`The curve crosses the axis at x = 2 (x² − 4 = 0), so part of it lies below the axis. Split the integral there.`, `Antiderivative: <span class="fr"><span>x³</span><span>3</span></span> − 4x.`, `0 to 2: [<span class="fr"><span>x³</span><span>3</span></span> − 4x] = <span class="fr"><span>8</span><span>3</span></span> − 8 = −<span class="fr"><span>16</span><span>3</span></span>, so its area is <span class="fr"><span>16</span><span>3</span></span>.  2 to 3: (9 − 12) − (<span class="fr"><span>8</span><span>3</span></span> − 8) = <span class="fr"><span>7</span><span>3</span></span>.`, `Total area = <span class="fr"><span>16</span><span>3</span></span> + <span class="fr"><span>7</span><span>3</span></span> = <span class="fr"><span>23</span><span>3</span></span>.`], a: `<span class="fr"><span>23</span><span>3</span></span> ≈ 7.67 square units`, gs: "ua4" },
{ t: "aunder", q: `Find the area under y = <span class="sq">√<span>x</span></span> from x = 1 to x = 9.`, s: [`Write y = x<sup>1/2</sup>, with antiderivative <span class="fr"><span>2</span><span>3</span></span>x<sup>3/2</sup>.`, `<span class="fr"><span>2</span><span>3</span></span>(9<sup>3/2</sup> − 1<sup>3/2</sup>) = <span class="fr"><span>2</span><span>3</span></span>(27 − 1) = <span class="fr"><span>52</span><span>3</span></span>.`], a: `<span class="fr"><span>52</span><span>3</span></span> ≈ 17.33 square units`, gs: "ua5" },
{ t: "aunder", q: `Find the area under y = e<sup>x/2</sup> + 1 from x = 0 to x = 4, correct to 2 decimal places.`, s: [`Antiderivative: 2e<sup>x/2</sup> + x.`, `At 4: 2e² + 4.  At 0: 2.`, `2e² + 4 − 2 = 2e² + 2 ≈ 16.78.`], a: `≈ 16.78 square units`, gs: "ua6" },
{ t: "aunder", q: `Find the area under the curve y = 2<sup>x</sup> from x = 0 to x = 3, correct to 2 decimal places.`, s: [`Use ∫ a<sup>x</sup> dx = <span class="fr"><span>a<sup>x</sup></span><span>ln a</span></span>.`, `<span class="fr"><span>2³ − 2⁰</span><span>ln 2</span></span> = <span class="fr"><span>7</span><span>ln 2</span></span> ≈ 10.10.`], a: `≈ 10.10 square units`, gs: "ua7" },
{ t: "aaxis", q: `Find the area enclosed between the curve f(x) = x² − 6x + 5 and the x-axis.`, s: [`The limits are where the curve meets the axis: x² − 6x + 5 = (x − 1)(x − 5) = 0, so x = 1 and x = 5.`, `∫ from 1 to 5 of (x² − 6x + 5) dx = [<span class="fr"><span>x³</span><span>3</span></span> − 3x² + 5x] = (<span class="fr"><span>125</span><span>3</span></span> − 75 + 25) − (<span class="fr"><span>1</span><span>3</span></span> − 3 + 5) = −<span class="fr"><span>32</span><span>3</span></span>.`, `The curve is below the axis, so the integral is negative. Area = <span class="fr"><span>32</span><span>3</span></span>.`], a: `<span class="fr"><span>32</span><span>3</span></span> ≈ 10.67 square units`, gs: "ea1" },
{ t: "aaxis", q: `Find the area enclosed between the function f(x) = x² + 5x − 6 and the x-axis.`, s: [`Roots: x² + 5x − 6 = (x + 6)(x − 1) = 0, so x = −6 and x = 1.`, `∫ from −6 to 1 of (x² + 5x − 6) dx = [<span class="fr"><span>x³</span><span>3</span></span> + <span class="fr"><span>5x²</span><span>2</span></span> − 6x].`, `At 1: <span class="fr"><span>1</span><span>3</span></span> + <span class="fr"><span>5</span><span>2</span></span> − 6 = −<span class="fr"><span>19</span><span>6</span></span>.  At −6: −72 + 90 + 36 = 54.`, `−<span class="fr"><span>19</span><span>6</span></span> − 54 = −<span class="fr"><span>343</span><span>6</span></span>. The area is the positive value <span class="fr"><span>343</span><span>6</span></span>.`], a: `<span class="fr"><span>343</span><span>6</span></span> ≈ 57.17 square units`, gs: "ea2" },
{ t: "aaxis", q: `Find the area enclosed between y = 8 + 2x − x² and the x-axis.`, s: [`Roots: 8 + 2x − x² = 0 ⇒ x² − 2x − 8 = (x − 4)(x + 2) = 0, so x = −2 and x = 4.`, `Antiderivative: 8x + x² − <span class="fr"><span>x³</span><span>3</span></span>.`, `At 4: 32 + 16 − <span class="fr"><span>64</span><span>3</span></span> = <span class="fr"><span>80</span><span>3</span></span>.  At −2: −16 + 4 + <span class="fr"><span>8</span><span>3</span></span> = −<span class="fr"><span>28</span><span>3</span></span>.`, `<span class="fr"><span>80</span><span>3</span></span> + <span class="fr"><span>28</span><span>3</span></span> = 36.`], a: `36 square units`, gs: "ea3" },
{ t: "aaxis", q: `Find the total area enclosed between the curve y = x³ − 2x² − 3x and the x-axis.`, s: [`Factorise: x(x − 3)(x + 1) = 0, so the curve meets the axis at x = −1, 0 and 3. It lies above the axis on (−1, 0) and below on (0, 3), so find the two areas separately.`, `Antiderivative: <span class="fr"><span>x⁴</span><span>4</span></span> − <span class="fr"><span>2x³</span><span>3</span></span> − <span class="fr"><span>3x²</span><span>2</span></span>.`, `−1 to 0: 0 − (<span class="fr"><span>1</span><span>4</span></span> + <span class="fr"><span>2</span><span>3</span></span> − <span class="fr"><span>3</span><span>2</span></span>) = <span class="fr"><span>7</span><span>12</span></span>.`, `0 to 3: <span class="fr"><span>81</span><span>4</span></span> − 18 − <span class="fr"><span>27</span><span>2</span></span> = −<span class="fr"><span>45</span><span>4</span></span>, an area of <span class="fr"><span>45</span><span>4</span></span>.`, `Total = <span class="fr"><span>7</span><span>12</span></span> + <span class="fr"><span>45</span><span>4</span></span> = <span class="fr"><span>71</span><span>6</span></span>.`], a: `<span class="fr"><span>71</span><span>6</span></span> ≈ 11.83 square units`, gs: "ea4" },
{ t: "aaxis", q: `Find the area enclosed between y = x² − 4x and the x-axis.`, s: [`Roots: x(x − 4) = 0, so x = 0 and x = 4.`, `∫ from 0 to 4 of (x² − 4x) dx = [<span class="fr"><span>x³</span><span>3</span></span> − 2x²] = <span class="fr"><span>64</span><span>3</span></span> − 32 = −<span class="fr"><span>32</span><span>3</span></span>.`, `Area = <span class="fr"><span>32</span><span>3</span></span> (the curve is below the axis).`], a: `<span class="fr"><span>32</span><span>3</span></span> ≈ 10.67 square units`, gs: "ea5" },
{ t: "aaxis", q: `Find the area enclosed between y = 4 sin x and the x-axis from x = 0 to the next point where it meets the axis (x in radians).`, s: [`4 sin x = 0 first again at x = π, so the limits are 0 and π.`, `Antiderivative: −4 cos x.`, `[−4 cos x] from 0 to π = −4(−1) − (−4(1)) = 4 + 4 = 8.`], a: `8 square units`, gs: "ea6" },
{ t: "aaxis", q: `Find the area enclosed between y = 3 − 3x² and the x-axis.`, s: [`Roots: 3(1 − x²) = 0, so x = ±1.`, `Antiderivative: 3x − x³.`, `At 1: 2.  At −1: −2.  Area = 2 − (−2) = 4.`], a: `4 square units`, gs: "ea7" },
{ t: "acurve", q: `Find the area of the region enclosed by f(x) = −2x² + 5x + 3 and g(x) = x + 3.`, s: [`Find where they meet: −2x² + 5x + 3 = x + 3 ⇒ −2x² + 4x = 0 ⇒ x = 0 or x = 2.`, `Check which is on top: at x = 1, f = 6 and g = 4, so f is above g on (0, 2).`, `Area = ∫ (f − g) dx = <span class="sig"><span class="sg-t">2</span><span class="sg-s">∫</span><span class="sg-b">0</span></span> (−2x² + 4x) dx = [−<span class="fr"><span>2x³</span><span>3</span></span> + 2x²] = −<span class="fr"><span>16</span><span>3</span></span> + 8 = <span class="fr"><span>8</span><span>3</span></span>.`], a: `<span class="fr"><span>8</span><span>3</span></span> ≈ 2.67 square units`, gs: "ac1" },

function load() { try { return JSON.parse(localStorage.getItem("ntq-practice") || "[]"); } catch (e) { return []; } }
function loadSel() { try { return new Set(JSON.parse(localStorage.getItem("ntq-topics") || "[]").filter((id) => TYPE[id])); } catch (e) { return new Set(); } }
function saveSel() { try { localStorage.setItem("ntq-topics", JSON.stringify([...S.sel])); } catch (e) {} S.used = new Set(); }
function save() { try { localStorage.setItem("ntq-practice", JSON.stringify(S.practice)); } catch (e) {} updateCount(); }
function updateCount() { document.getElementById("pcount").textContent = S.practice.length; }
function isStarred(id) { return S.practice.includes(id); }
function toggleStar(id) {
  if (isStarred(id)) S.practice = S.practice.filter((x) => x !== id);
  else S.practice.push(id);
  save();
  toast(isStarred(id) ? "Added to the practice list" : "Removed from the practice list");
}
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); }

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const deckTypes = () => TYPES.filter((t) => S.sel.has(t.id));

// ================= drawing toolkit (diagrams) =================
const INK = "var(--ink)", ACC = "var(--tr)", BLU = "var(--a1)", GRN = "var(--a2)", MUT = "var(--muted)", LNS = "var(--line-strong)";
const rad = (d) => d * Math.PI / 180, degOf = (r) => r * 180 / Math.PI;
const pol = (c, r, d) => [c[0] + r * Math.cos(rad(d)), c[1] + r * Math.sin(rad(d))];
const nf = (v) => v.toFixed(1);
function fig(items, o = {}) {
  const W = o.w || 420, H = o.h || 260, M = o.m == null ? 30 : o.m;
  const xs = [], ys = []; const add = (p) => { xs.push(p[0]); ys.push(p[1]); };
  items.forEach((it) => {
    if (it.segs) it.segs.forEach((sg) => sg.forEach(add)); if (it.a) add(it.a); if (it.b) add(it.b); if (it.p && !it.nofit) add(it.p); if (it.pts) it.pts.forEach(add);
    if (it.k === "arc" || it.k === "sector") { for (let a = it.a0; a <= it.a1 + 1e-9; a += Math.max(2, (it.a1 - it.a0) / 60)) add(pol(it.cc, it.r, a)); add(it.cc); }
    if (it.k === "circ") { add([it.cc[0] - it.r, it.cc[1] - it.r]); add([it.cc[0] + it.r, it.cc[1] + it.r]); }
  });
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (o.box) [x0, y0, x1, y1] = o.box;
  const s = Math.min((W - 2 * M) / ((x1 - x0) || 1), (H - 2 * M) / ((y1 - y0) || 1));
  const sx = o.free ? (W - 2 * M) / ((x1 - x0) || 1) : s, sy = o.free ? (H - 2 * M) / ((y1 - y0) || 1) : s;
  const ox = (W - sx * (x1 - x0)) / 2, oy = (H - sy * (y1 - y0)) / 2;
  const T = (p) => [ox + (p[0] - x0) * sx, H - oy - (p[1] - y0) * sy];
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label || "Diagram for this problem"}" style="font-family:var(--math)"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs>`;
  const dash = (d) => d ? ` stroke-dasharray="${d === true ? "5 4" : d}"` : "";
  items.forEach((it) => {
    const c = it.c || INK, w = it.w || 1.8;
    switch (it.k) {
      case "line": { const a = T(it.a), b = T(it.b); out += `<line x1="${nf(a[0])}" y1="${nf(a[1])}" x2="${nf(b[0])}" y2="${nf(b[1])}" stroke="${c}" stroke-width="${w}"${dash(it.dash)}${it.arrow ? ' marker-end="url(#ah)"' : ""}/>`; break; }
      case "path": it.segs.forEach((sg) => { out += `<polyline points="${sg.map((p) => T(p).map(nf).join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"${dash(it.dash)}/>`; }); break;
      case "poly": out += `<polygon points="${it.pts.map((p) => T(p).map(nf).join(",")).join(" ")}" fill="${it.fill || "none"}" stroke="${it.stroke || c}" stroke-width="${w}" stroke-linejoin="round"${dash(it.dash)}/>`; break;
      case "circ": { const p = T(it.cc); out += `<circle cx="${nf(p[0])}" cy="${nf(p[1])}" r="${nf(it.r * s)}" fill="${it.fill || "none"}" stroke="${c}" stroke-width="${w}"${dash(it.dash)}/>`; break; }
      case "arc": case "sector": {
        const p0 = T(pol(it.cc, it.r, it.a0)), p1 = T(pol(it.cc, it.r, it.a1)), r = it.r * s, large = it.a1 - it.a0 > 180 ? 1 : 0, cc = T(it.cc);
        const arcp = `A${nf(r)},${nf(r)} 0 ${large} 0 ${nf(p1[0])},${nf(p1[1])}`;
        if (it.k === "arc") out += `<path d="M${nf(p0[0])},${nf(p0[1])} ${arcp}" fill="none" stroke="${c}" stroke-width="${w}"${dash(it.dash)}/>`;
        else out += `<path d="M${nf(cc[0])},${nf(cc[1])} L${nf(p0[0])},${nf(p0[1])} ${arcp} Z" fill="${it.fill || "none"}" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
        break; }
      case "ang": { const v = T(it.v), r = it.r || 20; const a0 = rad(it.a0), a1 = rad(it.a1);
        const p0 = [v[0] + r * Math.cos(a0), v[1] - r * Math.sin(a0)], p1 = [v[0] + r * Math.cos(a1), v[1] - r * Math.sin(a1)];
        out += `<path d="M${nf(p0[0])},${nf(p0[1])} A${r},${r} 0 ${it.a1 - it.a0 > 180 ? 1 : 0} 0 ${nf(p1[0])},${nf(p1[1])}" fill="none" stroke="${it.c || ACC}" stroke-width="1.6"/>`;
        if (it.t) { const m = rad((it.a0 + it.a1) / 2), rr = r + (it.tr == null ? 13 : it.tr); out += `<text x="${nf(v[0] + rr * Math.cos(m))}" y="${nf(v[1] - rr * Math.sin(m) + 4)}" font-size="${it.size || 13}" text-anchor="middle" fill="${it.c || ACC}">${it.t}</text>`; }
        break; }
      case "rt": { const v = T(it.v), sz = it.sz || 10, a = rad(it.a0), b = rad(it.a0 + 90);
        const p = [[v[0] + sz * Math.cos(a), v[1] - sz * Math.sin(a)], [v[0] + sz * (Math.cos(a) + Math.cos(b)), v[1] - sz * (Math.sin(a) + Math.sin(b))], [v[0] + sz * Math.cos(b), v[1] - sz * Math.sin(b)]];

  let body = "";
  if (S.mode === "choice") {
    body += `<div class="opts" role="group" aria-label="Choose the topic">${options(p).map((id, k) => `<button class="opt" type="button" data-pick="${id}"><span class="k">${k + 1}</span><span class="sw" style="background:${CH_COL[TYPE[id].ch]}"></span>${TYPE[id].name}</button>`).join("")}</div>`;
  } else {
    body += `<div class="clue" style="border-style:solid"><b>Say it out loud:</b> which topic is this, and what is your first step? Then reveal.</div>
      <div class="timer" aria-hidden="true"><i id="tbar"></i></div>
      <div class="row"><button class="btn primary big" id="reveal" type="button">Reveal</button></div>`;
  }
  view().innerHTML = `
    <div class="playbar"><div class="steps" aria-label="Mode"><span class="on">${mode.name}</span><span>${plural(S.sel.size, "topic")}</span></div><div class="score">Card ${S.i + 1} of ${S.cards.length} · ${right} correct</div></div>
    <div class="progress" aria-hidden="true"><i style="width:${S.i / S.cards.length * 100}%"></i></div>
    <article class="qcard">
      <div class="label"><span>${mode.name}</span><button class="btn starbtn" type="button" id="star" aria-pressed="${isStarred(p.id)}">${isStarred(p.id) ? "★ In practice list" : "☆ Practise later"}</button></div>
      ${qBody(p)}
      ${body}
      <div id="fb"></div>
    </article>`;
  document.getElementById("star").onclick = (e) => { toggleStar(p.id); e.currentTarget.setAttribute("aria-pressed", isStarred(p.id)); e.currentTarget.textContent = isStarred(p.id) ? "★ In practice list" : "☆ Practise later"; };
  view().querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => pick(b.dataset.pick));
  const rv = document.getElementById("reveal");
  if (rv) {
    rv.onclick = revealCold;
    const bar = document.getElementById("tbar"); let t0 = performance.now();
    const tick = (now) => { if (!document.getElementById("tbar") || S.answered) return; const f = Math.max(0, 1 - (now - t0) / 15000); bar.style.width = f * 100 + "%"; if (f > 0) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
}
function feedbackBlock(p, ok, picked) {
  const t = TYPE[p.t];
  const also = (p.also || []).length ? `<p class="muted" style="font-size:14px">Also accepted: ${p.also.map((a) => TYPE[a].name).join(", ")}.</p>` : "";
  return `<div class="feedback ${ok ? "good" : "bad"}">
      <div class="verdict">${ok ? "Correct" : "Not quite"}</div>
      <p>This is ${typeChip(p.t)}.${!ok && picked ? ` You chose ${TYPE[picked].name}.` : ""}</p>
      ${also}
      <p><b>The giveaway:</b> ${t.clue}</p>
      <p><b>First move:</b> ${t.first}</p>
      <div class="row">
        <button class="btn" type="button" id="showsol" aria-expanded="false">Show the full solution</button>
        <button class="btn primary" type="button" id="next">${S.i + 1 < S.cards.length ? "Next problem →" : "See stage results →"}</button>
      </div>
      <div id="sol" hidden>${solHTML(p)}</div>
    </div>`;
}
function wireFeedback() {
  document.getElementById("showsol").onclick = (e) => { const s = document.getElementById("sol"); s.hidden = !s.hidden; e.currentTarget.setAttribute("aria-expanded", !s.hidden); e.currentTarget.textContent = s.hidden ? "Show the full solution" : "Hide the solution"; };
  document.getElementById("next").onclick = next;
  document.getElementById("next").focus();
}
function pick(id) {
  if (S.answered) return;
  const p = PROB[S.cards[S.i]]; const ok = accepted(p).includes(id);
  S.answered = { id, ok }; S.results.push({ id: p.id, ok, picked: id });
  view().querySelectorAll("[data-pick]").forEach((b) => { b.disabled = true; if (accepted(p).includes(b.dataset.pick)) b.classList.add("right"); else if (b.dataset.pick === id) b.classList.add("wrong"); });
  document.getElementById("fb").innerHTML = feedbackBlock(p, ok, id);
  wireFeedback();
}
function revealCold() {
  const p = PROB[S.cards[S.i]]; S.answered = { cold: true };
  const t = TYPE[p.t];
  document.getElementById("reveal").parentElement.remove();
  document.getElementById("fb").innerHTML = `<div class="feedback" style="background:var(--paper);border:1px solid var(--line)">
      <p style="font-size:19px">It’s ${typeChip(p.t)}${(p.also || []).length ? ` <span class="muted">(also fine: ${p.also.map((a) => TYPE[a].name).join(", ")})</span>` : ""}</p>
      <p><b>First move:</b> ${t.first}</p>
      <p><b>Did you get it?</b></p>
      <div class="row"><button class="btn" type="button" id="gotit" style="border-color:var(--good);color:var(--good)">✓ I got it</button><button class="btn" type="button" id="missed" style="border-color:var(--bad);color:var(--bad)">✗ I missed it</button></div>
    </div>`;
  const mark = (ok) => {
    S.results.push({ id: p.id, ok, picked: null }); S.answered = { ok };
    document.getElementById("fb").innerHTML = feedbackBlock(p, ok, null).replace(ok ? "Correct" : "Not quite", ok ? "Nice — you named it" : "Marked as missed");
    wireFeedback();
  };
  document.getElementById("gotit").onclick = () => mark(true);
  document.getElementById("missed").onclick = () => mark(false);
}
function next() {
  S.answered = null;
  if (S.i + 1 < S.cards.length) { S.i++; play(); window.scrollTo({ top: 0 }); }
  else go("results");
}

// ================= RESULTS =================
function results() {
  if (!S.results.length) return go("home");
  const right = S.results.filter((r) => r.ok).length; const n = S.results.length;
  const missed = S.results.filter((r) => !r.ok);
  const other = MODES.find((m) => m.id !== S.mode);
  const canOther = S.sel.size >= other.min;
  const msg = right / n >= 0.75 ? "Strong round. Keep going, or try the other mode." : "Replay the round, or star the ones you missed and come back to them.";
  view().innerHTML = `
    <section style="display:flex;flex-direction:column;gap:6px"><span class="muted">${MODES.find((m) => m.id === S.mode).name} · ${plural(S.sel.size, "topic")}</span><h1>${right} out of ${n}</h1><p class="lead" style="font-size:18px">${msg}</p></section>
    <div class="row">
      <button class="btn primary big" id="replay" type="button">Play another round</button>
      ${canOther ? `<button class="btn big" id="othermode" type="button">Try ${other.name}</button>` : ""}
      <button class="btn big" id="retopics" type="button">Change topics</button>
      ${missed.length ? `<button class="btn big" id="starmissed" type="button">☆ Add the ${missed.length} missed to the practice list</button>` : ""}
    </div>
    <section class="list">${S.results.map((r) => itemHTML(PROB[r.id], r)).join("")}</section>`;
  document.getElementById("replay").onclick = startRound;
  const om = document.getElementById("othermode"); if (om) om.onclick = () => { S.mode = other.id; startRound(); };
  document.getElementById("retopics").onclick = () => go("home");
  const sm = document.getElementById("starmissed");
  if (sm) sm.onclick = () => { missed.forEach((r) => { if (!isStarred(r.id)) S.practice.push(r.id); }); save(); toast(`${missed.length} added to the practice list`); results(); };
  wireItems();
}
function itemHTML(p, r, label) {
  const t = TYPE[p.t];
  return `<article class="item" style="border-left-color:${CH_COL[t.ch]}">
      <div class="meta">${label ? `<b class="muted">${label}</b>` : typeChip(p.t)}<span class="row" style="gap:8px">${r ? `<span class="mark ${r.ok ? "ok" : "no"}">${r.ok ? "✓ Correct" : "✗ Missed"}</span>` : ""}
        <button class="btn starbtn" type="button" data-star="${p.id}" aria-pressed="${isStarred(p.id)}" style="padding:5px 10px;font-size:14px">${isStarred(p.id) ? "★ Saved" : "☆ Practise"}</button>
        <button class="btn" type="button" data-sol="${p.id}" aria-expanded="false" style="padding:5px 10px;font-size:14px">Solution</button></span></div>
      <div class="qt">${p.q}</div>${p.g ? `<div class="graph" style="max-width:320px">${drawing(p.g)}</div>` : ""}
      <div data-solbox="${p.id}" hidden>${solHTML(p)}</div>
    </article>`;
}
function wireItems(onChange) {
  view().querySelectorAll("[data-star]").forEach((b) => b.onclick = () => { toggleStar(b.dataset.star); b.setAttribute("aria-pressed", isStarred(b.dataset.star)); b.textContent = isStarred(b.dataset.star) ? "★ Saved" : "☆ Practise"; if (onChange) onChange(); });
  view().querySelectorAll("[data-sol]").forEach((b) => b.onclick = () => { const box = b.closest(".item").querySelector("[data-solbox]"); box.hidden = !box.hidden; b.setAttribute("aria-expanded", !box.hidden); b.textContent = box.hidden ? "Solution" : "Hide"; });
}

// ================= LIBRARY =================
function library() {
  const strands = STRANDS.filter((s) => TYPES.some((t) => t.ch === s.id));
  if (!strands.some((s) => s.id === S.libStrand)) S.libStrand = strands[0].id;
  const st = strands.find((s) => s.id === S.libStrand);
  const ts = TYPES.filter((t) => t.ch === st.id);
  if (S.libTopic !== "all" && !ts.some((t) => t.id === S.libTopic)) S.libTopic = "all";
  const nIn = (sid) => PROBLEMS.filter((p) => TYPE[p.t].ch === sid).length;
  const tabs = strands.map((s) => `<button class="tab" type="button" role="tab" data-s="${s.id}" aria-selected="${s.id === st.id}" style="--sc:${s.color}"><b>${s.id}</b><span>${plural(TYPES.filter((t) => t.ch === s.id).length, "topic")} · ${plural(nIn(s.id), "problem")}</span></button>`).join("");
  const chips = [`<button class="chip" type="button" data-f="all" aria-pressed="${S.libTopic === "all"}">All ${st.id} (${nIn(st.id)})</button>`]
    .concat(groupsOf(ts).map((g) => (g.name ? `<span class="grplabel">${g.name}</span>` : "") + g.ts.map((t) => `<button class="chip" type="button" data-f="${t.id}" aria-pressed="${S.libTopic === t.id}">${t.name} (${countOf(t.id)})</button>`).join(""))).join("");
  let lastGrp = null;
  const groups = ts.filter((t) => S.libTopic === "all" || t.id === S.libTopic).map((t) => {
    const ps = PROBLEMS.filter((p) => p.t === t.id);
    const band = t.grp && t.grp !== lastGrp && S.libTopic === "all" ? `<h3 class="grpband" style="--sc:${st.color}">${t.grp}</h3>` : ""; lastGrp = t.grp || null;
    return `${band}<section class="tgroup" style="--sc:${st.color}"><h2>${t.name}<small>${plural(ps.length, "problem")}</small></h2>
      <p class="muted" style="font-size:15px"><b>The giveaway:</b> ${t.clue}</p>
      <div class="list">${ps.map((p, k) => itemHTML(p, null, `Problem ${k + 1}`)).join("")}</div></section>`;
  }).join("");
  view().innerHTML = `
    <section style="display:flex;flex-direction:column;gap:6px"><h1>Problem library</h1><p class="muted">Every problem in the game, organised by strand and then by topic. Star the ones the class wants to practise.</p></section>
    <div class="tabs" role="tablist" aria-label="Strand">${tabs}</div>
    <div class="filters" role="group" aria-label="Filter by topic">${chips}</div>
    ${groups}`;
  view().querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { S.libStrand = b.dataset.s; S.libTopic = "all"; library(); });
  view().querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { S.libTopic = b.dataset.f; library(); });
  wireItems();
}

// ================= PRACTICE =================
function practice() {
  const list = S.practice.map((id) => PROB[id]).filter(Boolean);
  view().innerHTML = `
    <section style="display:flex;flex-direction:column;gap:6px"><h1>Practice list</h1>
      <p class="muted">${list.length ? `${list.length} problem${list.length === 1 ? "" : "s"} saved on this device. Work them in your copy, then open each solution to check.` : "Nothing saved yet. Star a problem during the game or in the problem library and it appears here."}</p></section>
    ${list.length ? `<div class="row">
      <button class="btn" type="button" id="allsol">Show all solutions</button>
      <button class="btn" type="button" id="copy">Copy the list as text</button>
      <button class="btn" type="button" id="clear">Clear the list</button></div>` : `<div class="row"><button class="btn primary" type="button" id="tolib">Open the problem library</button></div>`}
    <section class="list">${list.map((p) => itemHTML(p)).join("")}</section>
    <div id="confirm"></div>`;
  wireItems(() => practice());
  const tl = document.getElementById("tolib"); if (tl) tl.onclick = () => go("library");
  if (!list.length) return;
  document.getElementById("allsol").onclick = (e) => { const boxes = view().querySelectorAll("[data-solbox]"); const show = [...boxes].some((b) => b.hidden); boxes.forEach((b) => b.hidden = !show); view().querySelectorAll("[data-sol]").forEach((b) => { b.textContent = show ? "Hide" : "Solution"; b.setAttribute("aria-expanded", show); }); e.currentTarget.textContent = show ? "Hide all solutions" : "Show all solutions"; };
  document.getElementById("copy").onclick = async () => {
    const txt = list.map((p, i) => { const d = document.createElement("div"); d.innerHTML = p.q; const a = document.createElement("div"); a.innerHTML = p.a; return `${i + 1}. [${TYPE[p.t].name}] ${d.textContent.replace(/\s+/g, " ")}\n   Answer: ${a.textContent}`; }).join("\n\n");
    try { await navigator.clipboard.writeText(txt); toast("Copied to the clipboard"); } catch (e) { toast("Copy was blocked by the browser"); }
  };
  document.getElementById("clear").onclick = () => {
    document.getElementById("confirm").innerHTML = `<div class="panel row" style="justify-content:space-between"><span>Remove all ${list.length} problems from the practice list?</span><span class="row"><button class="btn" type="button" id="no">Keep them</button><button class="btn primary" type="button" id="yes">Clear the list</button></span></div>`;
    document.getElementById("no").onclick = () => document.getElementById("confirm").innerHTML = "";
    document.getElementById("yes").onclick = () => { S.practice = []; save(); practice(); };
  };
}

// ================= routing & keys =================
function route() {
  const h = location.hash.replace("#", "") || "home";
  const tabOf = { home: "home", play: "home", results: "home", library: "library", practice: "practice" }[h] || "home";
  ["home", "library", "practice"].forEach((k) => { const b = document.getElementById("nav-" + k); if (k === tabOf) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  ({ home, play, results, library, practice }[h] || home)();
}
window.addEventListener("hashchange", route);
document.getElementById("nav-home").onclick = () => go("home");
document.getElementById("nav-library").onclick = () => go("library");
document.getElementById("nav-practice").onclick = () => go("practice");
document.addEventListener("keydown", (e) => {
  if ((location.hash || "") !== "#play" || e.target.closest("input,textarea")) return;
  if (!S.answered && S.mode === "choice" && /^[1-4]$/.test(e.key)) { const b = view().querySelectorAll("[data-pick]")[+e.key - 1]; if (b) b.click(); }
});
updateCount();
route();
</script>
</body>
</html>
